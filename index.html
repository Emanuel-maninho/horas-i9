<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F1F1F">
<title>Horas i9</title>
<style>
:root{
  --red:#C00000;--red-d:#8E0000;--red-l:#FBE9E9;
  --ink:#1A1A1A;--ink2:#4A4A4A;--ink3:#8A8A8A;
  --line:#E3E3E3;--bg:#F4F4F4;--card:#FFFFFF;--dark:#1F1F1F;
  --ok:#2E7D32;--ok-l:#E8F3E8;--warn:#9A6200;--warn-l:#FFF4DC;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.45}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0))}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* topo */
.top{background:var(--dark);color:#fff;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.top-t{flex:1;min-width:0}
.top-t b{display:block;font-size:15px}
.top-t span{font-size:12px;color:#BDBDBD}
.top-a{display:flex;gap:6px;align-items:center}
.top input[type=month]{background:#2D2D2D;border:1px solid #444;color:#fff;border-radius:8px;padding:6px 8px;font-size:13px}
.lnk{background:none;border:1px solid #555;color:#EEE;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}

/* abas */
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs-in{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--red);border-bottom-color:var(--red);font-weight:700}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;margin-left:5px}

.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:16px;margin-bottom:10px}
h3{font-size:14px;margin-bottom:8px;color:var(--ink2)}
.sub{font-size:13px;color:var(--ink3)}
.muted{color:var(--ink3)}

/* formulários */
label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.in{width:100%;border:1px solid #CFCFCF;border-radius:8px;padding:10px 12px;background:#fff;font-size:16px}
.in:focus{outline:2px solid var(--red);outline-offset:0;border-color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #CFCFCF;background:#fff;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:14px}
.btn.p{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.p:active{background:var(--red-d)}
.btn.w{width:100%;margin-top:14px}
.btn.s{padding:6px 10px;font-size:13px}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.no{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
/* manual */
.man details{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
.man summary{cursor:pointer;padding:13px 14px;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.man summary::-webkit-details-marker{display:none}
.man summary::after{content:'▾';color:var(--ink3);transition:transform .15s}
.man details[open] summary::after{transform:rotate(180deg)}
.man details[open] summary{border-bottom:1px solid var(--line)}
.man .bd{padding:4px 14px 14px;font-size:14px;line-height:1.55}
.man .bd p{margin:8px 0}
.man .bd ol,.man .bd ul{margin:8px 0 8px 20px;padding:0}
.man .bd li{margin:5px 0}
.man .bd table{font-size:13px;margin:8px 0}
.man .bd td,.man .bd th{white-space:normal;text-align:left;padding:6px 8px}
.man .ui{pointer-events:none;vertical-align:middle;margin:1px 2px}
.man .ui.btn{padding:3px 9px;font-size:12px}
.man .quem{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
.man .dica{background:#F7F7F7;border-radius:8px;padding:9px 11px;font-size:13px;margin:8px 0}
.msg{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:8px}
.msg.e{background:var(--red-l);color:var(--red-d)}
.msg.o{background:var(--ok-l);color:var(--ok)}

/* login */
.login{max-width:420px;margin:32px auto;padding:0 16px}
.login .brand{text-align:center;margin-bottom:18px}
.login .brand .logo{margin:0 auto 10px;width:52px;height:52px;font-size:22px;color:#fff}
.login .brand b{font-size:19px}
.switch{text-align:center;margin-top:14px;font-size:14px}
.switch a{color:var(--red);font-weight:700;cursor:pointer}

/* saldo */
.saldo{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-bottom:14px}
.big{background:var(--dark);color:#fff;border-radius:var(--r);padding:16px}
.big .v{font-size:40px;font-weight:700;line-height:1.1}
.big .l{font-size:13px;color:#CFCFCF}
.big.zero{background:var(--ok)}
.st{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.st .v{font-size:24px;font-weight:700}
.st .l{font-size:12px;color:var(--ink3)}
@media(max-width:640px){.saldo{grid-template-columns:1fr 1fr}.big{grid-column:1/-1}.row{grid-template-columns:1fr}}
.note{background:var(--warn-l);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}

/* listas */
.day{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.day:last-child{border-bottom:0}
.day.warn{background:#FFF8E6;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
.tag.t-sa{background:#E7EEFA;color:#1D4E89}
.tag.t-inc{background:#FDEBC8;color:#8A5300}
.sa-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.sa-t{border-collapse:separate;border-spacing:0;font-size:12px;width:auto}
.sa-t th,.sa-t td{padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.sa-t thead th{position:sticky;top:0;background:#fff;z-index:2;font-size:10px;text-align:center;padding:4px 0;color:var(--ink3)}
.sa-t thead th.fds{background:#F4F4F4}
.sa-t .nm{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:6px 10px 6px 6px;min-width:220px;max-width:260px;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.sa-t thead .nm{z-index:3}
.sa-t td.dd{width:26px;min-width:26px;height:28px;text-align:center;cursor:pointer;border-left:1px solid #F0F0F0;font-size:13px}
.sa-t td.dd.fds{background:#FAFAFA}
.sa-t td.dd:hover{background:#E7EEFA}
.sa-t td.dd.on{background:#1D4E89;color:#fff}
.sa-t td.dd.busy{opacity:.4}
.sa-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sa-bar .in{margin:0;width:auto;padding:8px}
.sug{margin-top:6px;font-size:12px;background:#E7EEFA;color:#1D4E89;border-radius:8px;padding:7px 9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day .d{width:52px;flex-shrink:0;text-align:center}
.day .d b{display:block;font-size:18px}
.day .d span{font-size:11px;color:var(--ink3);text-transform:uppercase}
.day .c{flex:1;min-width:0;font-size:14px}
.day .c .x{font-size:12px;color:var(--ink3)}
.day .h{font-weight:700;white-space:nowrap;width:72px;text-align:right;flex-shrink:0}
.day .hs{white-space:nowrap;width:72px;text-align:right;flex-shrink:0;color:var(--ink2);font-weight:600}
.day-cab{display:flex;gap:12px;padding:0 0 4px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px}
.day-cab span{width:72px;text-align:right;white-space:nowrap;flex-shrink:0}.day-cab span:first-child{flex:1;text-align:left}
.tag.t-aud{background:#EFE3FA;color:#5B2A86}
.selbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.selbar select{margin:0;width:auto;flex:0 1 260px;padding:8px}
.selbar .info{font-size:13px;color:var(--ink2)}
.selbar .info b{color:var(--ink)}
td.ck,th.ck{width:34px;text-align:center!important;padding-left:4px!important;padding-right:4px!important}
td.ck input,th.ck input{width:18px;height:18px;cursor:pointer;accent-color:var(--red)}
tr.sel td{background:#FFF6F6}
@media(max-width:640px){table.resp td.ck{display:block;float:right;width:auto;padding:0}}
.plus{color:var(--red)}.minus{color:var(--ok)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;vertical-align:1px}
.t-ok{background:var(--ok-l);color:var(--ok)}
.t-wait{background:var(--warn-l);color:var(--warn)}
.t-no{background:var(--red-l);color:var(--red-d)}
.t-gray{background:#EEE;color:#666}

/* tabelas */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;color:var(--ink3);text-align:right;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th.l,td.l{text-align:left}
tr.click,th.click{cursor:pointer}
tr.click:hover td{background:#FAFAFA}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}

.pend{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.pend .a{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.opt input{margin-top:3px}
.opt.on{border-color:var(--red);background:#FFF8F8}
.opt b{display:block;font-size:14px}
.opt span{font-size:12px;color:var(--ink2);font-weight:400}
.opt div{font-weight:400}
.top-t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){
  .top-t{flex-basis:calc(100% - 46px)}
  .top-a{width:100%;justify-content:flex-end}
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tfoot{display:block}
  table.resp tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:8px 10px}
  table.resp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 0;white-space:normal}
  table.resp td.l{display:block;text-align:left;padding-bottom:6px}
  table.resp td[data-l]::before{content:attr(data-l);color:var(--ink3);font-size:12px;text-align:left}
  table.resp td:empty{display:none}
}
.expl{font-size:13px;color:var(--ink2);background:#F7F7F7;border-radius:8px;padding:10px 12px;margin-bottom:12px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0))}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:14px}}
.md-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x-btn{background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink3)}
.loading{padding:30px;text-align:center;color:var(--ink3)}

/* filtro de grupo / setor */
.filtro{margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.sub{margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip span{color:var(--ink3);font-weight:500;margin-left:2px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on span{color:#ccc}
.chips.sub .chip{font-size:12px;padding:4px 10px}
tr.grp td{background:#F4F4F4;text-align:left;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);padding:6px 8px;cursor:pointer;user-select:none}
tr.grp td:hover{background:#ECECEC}
tr.grp .seta{display:inline-block;width:14px;transition:transform .15s;color:var(--ink3)}
tr.grp.fechado .seta{transform:rotate(-90deg)}
.lote{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#FFF4D6;border:1px solid #F0D58A;border-radius:10px;padding:8px 10px;margin-bottom:10px;position:sticky;top:0;z-index:5}
.lote .in{margin:0;width:auto;flex:1 1 200px;padding:8px}
.grp-acoes{display:flex;gap:6px;justify-content:flex-end;margin:-2px 0 8px}
.lnk2{background:none;border:0;color:var(--ink2);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;padding:2px 4px}
/* telas largas: tabelas cabem sem rolagem lateral */
body.largo .top-in,body.largo .tabs-in,body.largo .wrap{max-width:1480px}
@media(min-width:900px){
  table.cmp{font-size:12.5px}
  table.cmp th{padding:6px 5px;font-size:10px;white-space:normal;vertical-align:bottom}
  table.cmp td{padding:7px 5px}
  table.cmp td.l{white-space:normal}
  table.cmp td.l:first-child{min-width:190px}
  table.cmp td.w{white-space:normal}
}
tr.grp td span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink3);margin-left:6px}
@media(max-width:640px){table.resp tr.grp{border:0;padding:8px 2px 2px;margin:10px 0 4px;background:none}table.resp tr.grp td{background:none;display:block}}

/* relatório impresso */
#print{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-size:11px}
  @page{size:A4;margin:12mm}
}
.rp h1{font-size:16px;margin:0}
.rp h3{font-size:12px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.rp .cab{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.rp .id{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.rp table{width:100%;border-collapse:collapse}
.rp table{font-size:10px}
.rp th,.rp td{border:1px solid #999;padding:3px 5px;text-align:right;vertical-align:top;white-space:normal;color:#000}
.rp th{background:#eee;font-weight:600;font-size:9px}
.rp td:nth-child(n){word-break:break-word}
.rp td:first-child{white-space:nowrap;word-break:normal}
.rp{padding-right:2px}
.rp td.l,.rp th.l{text-align:left}
.rp tr{break-inside:avoid}
.rp .ass{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:40px;text-align:center}
.rp .ass div{border-top:1px solid #000;padding-top:4px}
.rp .rod{margin-top:12px;color:#555;font-size:10px}
.rp .nota{font-size:10px;color:#333;margin:4px 0 0}
.rp .decl{margin-top:18px}
.rp .obs{margin-top:8px}
.rp .obs div{border-bottom:1px solid #999;height:20px}
.rp .ass span{font-size:9px;color:#444}
</style>
</head>
<body>

<!-- ═══ LOGIN / PRIMEIRO ACESSO ═══ -->
<div id="v-login" class="login hidden">
  <div class="brand"><div class="logo">i9</div><b>Horas i9</b><div class="sub">Horas extras e compensações · Engenharia</div></div>

  <div class="card" id="f-entrar">
    <h2>Entrar</h2>
    <label for="l-cod">Código de acesso</label>
    <input class="in" id="l-cod" inputmode="numeric" maxlength="7" autocomplete="username" placeholder="Ex.: 1042">
    <label for="l-pin">PIN (6 números)</label>
    <input class="in" id="l-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
    <button class="btn p w" id="b-entrar">Entrar</button>
    <div id="m-entrar"></div>
    <div class="switch">Primeira vez? <a id="go-cad">Tenho um convite</a></div>
    <div class="switch" style="margin-top:6px"><a id="go-man">Como funciona o app?</a></div>
  </div>

  <div class="card hidden" id="f-cad">
    <h2>Ativar meu acesso</h2>
    <div id="a-passo1">
      <p class="sub">Digite o convite que você recebeu do seu superior (ex.: K7PM-4QXT).</p>
      <label for="a-conv">Convite</label>
      <input class="in" id="a-conv" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" style="text-transform:uppercase;letter-spacing:2px">
      <button class="btn p w" id="b-conv">Continuar</button>
    </div>
    <div id="a-passo2" class="hidden">
      <div class="expl" id="a-quem"></div>
      <label for="a-tel">Celular (opcional)</label>
      <input class="in" id="a-tel" inputmode="tel" placeholder="(27) 9 0000-0000">
      <div class="row">
        <div><label for="c-pin">Crie um PIN (6 números)</label>
          <input class="in" id="c-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
        <div><label for="c-pin2">Repita o PIN</label>
          <input class="in" id="c-pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
      </div>
      <button class="btn p w" id="b-cad">Ativar</button>
    </div>
    <div id="a-fim" class="hidden" style="text-align:center"></div>
    <div id="m-cad"></div>
    <div class="switch"><a id="go-ent">Já tenho código de acesso</a></div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="v-app" class="hidden">
  <div class="top"><div class="top-in">
    <div class="logo">i9</div>
    <div class="top-t"><b id="u-nome">—</b><span id="u-papel">—</span></div>
    <div class="top-a">
      <input type="month" id="mes" aria-label="Mês">
      <button class="lnk" id="b-pin">PIN</button>
      <button class="lnk" id="b-sair">Sair</button>
    </div>
  </div></div>
  <div class="tabs"><div class="tabs-in" id="tabs"></div></div>
  <div class="wrap" id="main"></div>
</div>

<div id="modal"></div>
<div id="print"></div>

<script>
/* ════ CONFIGURAÇÃO ════
   Preencher com os dados do projeto Supabase "I9 Engenharia" (Settings → API).
   Use a chave PUBLISHABLE / anon — nunca a service_role aqui. */
const SUPABASE_URL = 'https://blinftijbpyqduenkcub.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsaW5mdGlqYnB5cWR1ZW5rY3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzU1MDQsImV4cCI6MjA5MjgxMTUwNH0.ODQC6tpe1RKFe78LB6GhinD74iIzWzLQwQbAkJ4BxNM';
const API = (window.HE_API || SUPABASE_URL + '/rest/v1');

/* ════ utilidades ════ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = m => { m = Math.round(m || 0); const s = m < 0 ? '−' : ''; m = Math.abs(m);
  return s + Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); };
const brl = v => (v < 0 ? '−' : '') + 'R$ ' + Math.abs(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const PAPEL = {colaborador:'Colaborador',supervisor:'Supervisor de campo',coordenador:'Coordenador',gc:'Gestor de Contrato',rh:'RH',admin:'Administrador'};
const LIDER = ['supervisor','coordenador','gc','admin'];
const DIA = ['dom','seg','ter','qua','qui','sex','sáb'];

/* ── grupos de empresa e setores ── */
const SETORES_ENG = ['Gestão de Engenharia','Automação','Elétrica','Mecânica','Planejamento','Projetos','SESMT','Almoxarifado'];
const SETORES_ADM = ['Diretoria','Administrativo','Comercial','Financeiro','RH / DP','Suprimentos','Logística / Frota','TI'];
const SETORES = [...SETORES_ENG, ...SETORES_ADM];
const GRUPOS = ['I9 MATRIZ','I9 FILIAL','FIO FORTE','TODOS'];
function grupo(emp){
  const e = (emp||'').toUpperCase();
  if (/FIO\s*FORTE|FIOFORTE/.test(e)) return 'FIO FORTE';
  if (/\bI9\b/.test(e)) return /\bRJ\b|FILIAL/.test(e) ? 'I9 FILIAL' : 'I9 MATRIZ';
  return 'OUTRAS';
}
const ehEng = p => !p.setor || SETORES_ENG.includes(p.setor);     // sem setor fica visível até ser classificado
const usaFiltro = () => S.eu && (S.eu.papel === 'admin' || S.eu.papel === 'rh');
function filtrar(lista){
  if (!usaFiltro()) return lista;
  return lista.filter(p => (S.f.g === 'TODOS' || grupo(p.empresa) === S.f.g)
    && !(S.f.g === 'I9 MATRIZ' && S.f.eng && !ehEng(p)));
}
function porSetor(lista){
  const m = new Map();
  for (const p of lista) { const k = p.setor || 'Sem setor'; if (!m.has(k)) m.set(k, []); m.get(k).push(p); }
  const ordem = k => k === 'Sem setor' ? 999 : (SETORES.indexOf(k) + 1 || 500);
  return [...m.entries()].sort((a,b) => ordem(a[0]) - ordem(b[0]));
}
function barraFiltro(base){
  if (!usaFiltro()) return '';
  const n = g => g === 'TODOS' ? base.length : base.filter(p => grupo(p.empresa) === g).length;
  const chip = (on, attr, txt) => `<button class="chip ${on?'on':''}" ${attr}>${txt}</button>`;
  const nEng = base.filter(p => grupo(p.empresa) === 'I9 MATRIZ' && ehEng(p)).length;
  return `<div class="filtro">
    <div class="chips">${GRUPOS.filter(g => g === 'TODOS' || n(g)).map(g => chip(S.f.g===g, `data-g="${g}"`,
      `${g==='TODOS'?'Todos':g} <span>${n(g)}</span>`)).join('')}</div>
    ${S.f.g==='I9 MATRIZ'?`<div class="chips sub">${chip(S.f.eng,'data-eng="1"',`Só Engenharia <span>${nEng}</span>`)}${chip(!S.f.eng,'data-eng="0"',`Todos os setores <span>${n('I9 MATRIZ')}</span>`)}</div>`:''}
  </div>`;
}
function ligarFiltro(redesenhar){
  document.querySelectorAll('.filtro [data-g]').forEach(b => b.onclick = () => { S.f.g = b.dataset.g; salvarFiltro(); redesenhar(); });
  document.querySelectorAll('.filtro [data-eng]').forEach(b => b.onclick = () => { S.f.eng = b.dataset.eng === '1'; salvarFiltro(); redesenhar(); });
}
/* líderes possíveis: qualquer pessoa com função de liderança, mesmo antes de ativar o acesso */
function lideresTodos(excluir){
  return (S.pessoas||[]).filter(p => p.status !== 'bloqueado' && LIDER.includes(p.papel) && p.id !== excluir)
    .sort((a,b) => a.nome.localeCompare(b.nome));
}
function opcoesSuperior(sel, excluir, vazio){
  return `<option value="">${vazio||'— sem superior —'}</option>` + lideresTodos(excluir).map(l =>
    `<option value="${l.id}" ${l.id===sel?'selected':''}>${esc(l.nome)} (${PAPEL[l.papel]}${l.status!=='ativo'?' · ainda sem acesso':''})</option>`).join('');
}
function salvarFiltro(){ store.set('he_filtro', JSON.stringify(S.f)); }
/* grupos de setor recolhíveis (estado lembrado por aparelho) */
let FECHADOS = new Set(); try { FECHADOS = new Set(JSON.parse(store.get('he_fechados')||'[]')); } catch(e){}
const salvarFechados = () => store.set('he_fechados', JSON.stringify([...FECHADOS]));
function cabGrupo(chave, cols, rotulo, resumo){
  const f = FECHADOS.has(chave);
  return `<tr class="grp ${f?'fechado':''}" data-grp="${esc(chave)}"><td colspan="${cols}"><span class="seta">▾</span>${esc(rotulo)}<span>${resumo}</span></td></tr>`;
}
const linhaDoGrupo = (chave, html) => html.replace('<tr ', `<tr data-de="${esc(chave)}" ${FECHADOS.has(chave)?'style="display:none" ':''}`);
function ligarGrupos(prefixo, chaves){
  document.querySelectorAll('tr[data-grp]').forEach(tr => tr.onclick = () => {
    const k = tr.dataset.grp, abrir = FECHADOS.has(k);
    abrir ? FECHADOS.delete(k) : FECHADOS.add(k); salvarFechados();
    tr.classList.toggle('fechado', !abrir);
    document.querySelectorAll(`tr[data-de="${CSS.escape(k)}"]`).forEach(l => l.style.display = abrir ? '' : 'none');
  });
  const todos = (fechar) => { chaves.forEach(k => fechar ? FECHADOS.add(k) : FECHADOS.delete(k)); salvarFechados();
    document.querySelectorAll('tr[data-grp]').forEach(tr => tr.classList.toggle('fechado', fechar));
    document.querySelectorAll('tr[data-de]').forEach(l => l.style.display = fechar ? 'none' : ''); };
  if ($(prefixo+'-rec')) $(prefixo+'-rec').onclick = () => todos(true);
  if ($(prefixo+'-exp')) $(prefixo+'-exp').onclick = () => todos(false);
}
const botoesGrupo = p => usaFiltro() ? `<div class="grp-acoes"><button class="lnk2" id="${p}-rec">Recolher todos</button><button class="lnk2" id="${p}-exp">Expandir todos</button></div>` : '';
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

async function rpc(fn, args = {}) {
  const h = {'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY};
  if (!SUPABASE_ANON_KEY.startsWith('sb_publishable_')) h.Authorization = 'Bearer ' + SUPABASE_ANON_KEY;
  let r;
  try { r = await fetch(API + '/rpc/' + fn, {method:'POST', headers:h, body:JSON.stringify(args)}); }
  catch(e) { throw new Error('Sem conexão. Verifique a internet e tente de novo.'); }
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : null;
  if (!r.ok) {
    if (data && data.code === '28000') { sair(true); }
    throw new Error((data && data.message) || 'Erro ' + r.status);
  }
  return data;
}
function msg(el, text, ok) { $(el).innerHTML = text ? `<div class="msg ${ok?'o':'e'}">${esc(text)}</div>` : ''; }
function busy(btn, on) { btn.disabled = on; }

/* ════ estado ════ */
const S = { token:null, eu:null, mes:null, tab:null, resumo:[], pend:[], ordem:'50_primeiro',
  sel:new Set(), grupoId:null, soSel:false, grupos:null, busca:'' };

function mesAtual(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function mesData(){ return S.mes + '-01'; }

/* ════ LOGIN ════ */
function telaLogin(){
  $('v-app').classList.add('hidden'); $('v-login').classList.remove('hidden');
  const ult = store.get('he_codigo'); if (ult) $('l-cod').value = ult;
}
$('go-cad').onclick = () => { $('f-entrar').classList.add('hidden'); $('f-cad').classList.remove('hidden'); msg('m-cad',''); };
$('go-ent').onclick = () => { $('f-cad').classList.add('hidden'); $('f-entrar').classList.remove('hidden'); };

$('b-entrar').onclick = async () => {
  const cod = $('l-cod').value.replace(/\D/g,''), pin = $('l-pin').value.trim();
  if (!cod) return msg('m-entrar','Informe seu código de acesso.');
  if (!/^\d{6}$/.test(pin)) return msg('m-entrar','O PIN tem 6 números.');
  const b = $('b-entrar'); busy(b,true); msg('m-entrar','');
  try {
    const r = await rpc('he_login', {p_codigo:cod, p_pin:pin});
    if (r.erro) return msg('m-entrar', r.erro);
    if (r.status === 'pendente') return msg('m-entrar','Seu acesso ainda aguarda aprovação.', true);
    S.token = r.token; store.set('he_token', r.token); store.set('he_codigo', cod);
    $('l-pin').value = '';
    await iniciar();
  } catch(e){ msg('m-entrar', e.message); }
  finally { busy(b,false); }
};
$('l-pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('b-entrar').click(); });

const PAP_CONV = {colaborador:'colaborador',supervisor:'supervisor de campo',coordenador:'coordenador',gc:'gestor de contrato',rh:'RH'};
$('b-conv').onclick = async () => {
  const c = $('a-conv').value.trim();
  if (c.replace(/[^A-Za-z0-9]/g,'').length !== 8) return msg('m-cad','O convite tem 8 letras/números.');
  const b = $('b-conv'); busy(b,true); msg('m-cad','');
  try {
    const r = await rpc('he_convite_info', {p_convite:c});
    if (r.erro) return msg('m-cad', r.erro);
    $('a-quem').innerHTML = `Olá, <b>${esc(r.nome)}</b>.<br>Convite de ${esc(r.convidado_por||'—')} como ${esc(PAP_CONV[r.papel]||r.papel)}.<br>Se este não é você, não continue.`;
    $('a-passo1').classList.add('hidden'); $('a-passo2').classList.remove('hidden');
  } catch(e){ msg('m-cad', e.message); }
  finally { busy(b,false); }
};
$('b-cad').onclick = async () => {
  const p1 = $('c-pin').value, p2 = $('c-pin2').value;
  if (!/^\d{6}$/.test(p1)) return msg('m-cad','O PIN precisa ter 6 números.');
  if (p1 !== p2) return msg('m-cad','Os dois PINs não são iguais.');
  const b = $('b-cad'); busy(b,true); msg('m-cad','');
  try {
    const r = await rpc('he_ativar', {p_convite:$('a-conv').value.trim(), p_pin:p1, p_telefone:$('a-tel').value.trim() || null});
    if (r.erro) return msg('m-cad', r.erro);
    store.set('he_codigo', String(r.codigo)); $('l-cod').value = r.codigo;
    $('a-passo2').classList.add('hidden'); $('a-fim').classList.remove('hidden');
    $('a-fim').innerHTML = `<p class="sub">Seu código de acesso é</p>
      <div style="font-size:44px;font-weight:700;letter-spacing:3px;margin:4px 0">${r.codigo}</div>
      <p class="sub">Anote. Para entrar, use este código e o PIN que você criou.</p>
      ${r.status==='ativo'?'<button class="btn p w" id="b-ir">Entrar agora</button>'
        :'<div class="msg o">Acesso ativado. Você poderá entrar assim que for aprovado.</div>'}`;
    if ($('b-ir')) $('b-ir').onclick = () => $('go-ent').click();
    $('c-pin').value = $('c-pin2').value = '';
  } catch(e){ msg('m-cad', e.message); }
  finally { busy(b,false); }
};

/* ════ APP ════ */
async function iniciar(){
  try { S.eu = await rpc('he_eu', {p_token:S.token}); }
  catch(e){ return telaLogin(); }
  S.ordem = S.eu.ordem_abatimento || '50_primeiro';
  try { S.f = JSON.parse(store.get('he_filtro')) || null; } catch(e){ S.f = null; }
  if (!S.f || !GRUPOS.includes(S.f.g)) S.f = S.eu.papel === 'admin' ? {g:'I9 MATRIZ', eng:true} : {g:'TODOS', eng:false};
  $('v-login').classList.add('hidden'); $('v-app').classList.remove('hidden');
  const pn = S.eu.nome.split(' ');
  $('u-nome').textContent = window.innerWidth < 640 && pn.length > 2 ? pn[0] + ' ' + pn[pn.length-1] : S.eu.nome;
  $('u-papel').textContent = PAPEL[S.eu.papel] + ' · código ' + S.eu.codigo + (S.eu.superior ? ' · superior: ' + S.eu.superior : '');
  S.mes = S.mes || mesAtual(); $('mes').value = S.mes;
  const tabs = [['minhas','Minhas horas']];
  if (LIDER.includes(S.eu.papel) || S.eu.papel === 'rh') tabs.push(['equipe', S.eu.papel==='rh'?'Pessoas':'Equipe']);
  if (LIDER.includes(S.eu.papel)) tabs.push(['sa','Sobreaviso']);
  if (S.eu.papel === 'rh' || S.eu.papel === 'admin') tabs.push(['rh','Fechamento RH']);
  if (S.eu.papel === 'admin' || S.eu.papel === 'rh') tabs.push(['cad','Cadastros']);
  tabs.push(['man','Manual']);
  S.tabs = tabs;
  S.tab = S.tab && tabs.some(t=>t[0]===S.tab) ? S.tab : (S.eu.papel==='colaborador' ? 'minhas' : tabs[1]?.[0] || 'minhas');
  await carregar();
}
function pintarAbas(){
  $('tabs').innerHTML = S.tabs.map(([k,t]) => {
    let n = '';
    if (k==='equipe' && S.pend.length) n = `<span class="n">${S.pend.length}</span>`;
    if (k==='cad' && S.nPendCad) n = `<span class="n">${S.nPendCad}</span>`;
    return `<button class="tab ${S.tab===k?'on':''}" data-t="${k}">${t}${n}</button>`;
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.t; carregar(); });
}
async function carregar(){
  $('main').innerHTML = '<div class="loading">Carregando…</div>';
  try {
    const [res, pend] = await Promise.all([
      rpc('he_resumo_mes', {p_token:S.token, p_mes:mesData()}),
      LIDER.includes(S.eu.papel) ? rpc('he_autorizacoes', {p_token:S.token, p_escopo:'pendentes', p_mes:mesData()}) : []
    ]);
    S.resumo = res; S.pend = pend;
    if (S.tab === 'equipe') S.grupos = await rpc('he_grupos', {p_token:S.token}).catch(() => null);  // null = banco ainda sem o 09
    if (S.eu.papel === 'admin') {
      const ps = await rpc('he_admin_pessoas', {p_token:S.token}); S.pessoas = ps;
      S.nPendCad = ps.filter(p=>p.status==='pendente').length;
    }
    pintarAbas();
    document.body.classList.toggle('largo', S.tab === 'rh' || S.tab === 'cad');
    if (S.tab === 'minhas') await vMinhas();
    else if (S.tab === 'equipe') vEquipe();
    else if (S.tab === 'rh') vRH();
    else if (S.tab === 'cad') await vCad();
    else if (S.tab === 'sa') await vSobreaviso();
    else if (S.tab === 'man') $('main').innerHTML = manualHTML(S.eu.papel);
  } catch(e){ $('main').innerHTML = `<div class="card"><div class="msg e">${esc(e.message)}</div></div>`; }
}
$('mes').onchange = () => { S.mes = $('mes').value || mesAtual(); carregar(); };
function sair(silencioso){
  if (S.token && !silencioso) rpc('he_sair', {p_token:S.token}).catch(()=>{});
  S.token = null; S.eu = null; store.del('he_token'); telaLogin();
}
$('b-sair').onclick = () => sair(false);

/* ── descrição de um dia para o colaborador (só horas) ── */
function linhasDia(d){
  const it = [];
  const f50 = d.he50*1.5, f75 = d.he75*1.75, f100 = d.he100*2;
  if (d.he50)  it.push({t:`Hora extra ${hm(d.he50)} (dia útil, 1ª e 2ª hora)`, v:f50, r:d.he50});
  if (d.he75)  it.push({t:`Hora extra ${hm(d.he75)} (${new Date(d.data+'T12:00').getDay()===6?'sábado':'após a 2ª hora'})`, v:f75, r:d.he75});
  if (d.he100) it.push({t:`Hora extra ${hm(d.he100)} (domingo/feriado)`, v:f100, r:d.he100});
  if (d.desconto && !d.abonado) it.push({t:`Horas a menos no dia (${hm(d.desconto)})`, v:-d.desconto});
  return it;
}
/* marcadores do dia: acionamento, descanso, sobreaviso, ponto incompleto */
function extrasDia(d){
  const x = [];
  if (d.acion_min) x.push(`<span class="tag t-sa">Acionamento de sobreaviso ${esc(d.acion_txt||'')} · ${hm(d.acion_min)} de HE</span>`);
  if (d.descanso_ate) x.push(`<span class="tag t-gray">Descanso de 11h até ${d.descanso_ate.slice(11,16)}</span>`);
  if (d.sa_noite) x.push(`<span class="tag t-sa">🌙 Sobreaviso ${hm(d.sa_min)}</span>`);
  if (d.incompleto) x.push(`<span class="tag t-inc">⚠ ${d.incompleto==='sem marcação'?'Sem marcação':'Ponto incompleto'}</span>`);
  if (d.aud_tol) x.push(`<span class="tag t-aud" title="Marcações dentro da tolerância do RH (até 5 min por marcação, 10 min no dia, almoço cumprido), mas o Quark apontou ${hm(d.aud_tol)} de HE.">⚠ Auditar Quark – erro de tolerância</span>`);
  return x.join(' ');
}
const diaRelevante = d => linhasDia(d).length || d.autorizacao || d.sa_noite || d.incompleto || d.acion_min || d.sugestao;
const cabDias = () => '<div class="day-cab"><span>Dia</span><span>HE feita</span><span>Vira folga</span></div>';
function diaHTML(d, extra){
  const it = linhasDia(d);
  return `<div class="day ${d.incompleto?'warn':''}"><div class="d"><b>${d.data.slice(8)}</b><span>${DIA[new Date(d.data+'T12:00').getDay()]}</span></div>
    <div class="c">${it.map(i=>`<div>${esc(i.t)}</div>`).join('')}
      <div class="x">${esc(d.batidas||'sem marcação')} ${tagAut(d.autorizacao)}${!d.autorizacao&&!d.aud_tol&&(d.he50+d.he75+d.he100-(d.acion_min||0))>0?' <span class="tag t-no">Sem autorização</span>':''} ${extrasDia(d)}</div>
      ${d.observacao?`<div class="x">${esc(d.observacao)}</div>`:''}${extra||''}</div>
    <div class="hs">${it.map(i=>`<div>${i.r?hm(i.r):'&nbsp;'}</div>`).join('')}</div>
    <div class="h">${it.map(i=>`<div class="${i.v>0?'plus':'minus'}">${i.v>0?'+':''}${hm(i.v)}</div>`).join('')}</div></div>`;
}
function tagAut(a){
  if (!a) return '';
  if (a.startsWith('autorizada')) return `<span class="tag t-ok">Autorizada</span>`;
  if (a.startsWith('solicitada')) return `<span class="tag t-wait">Aguardando</span>`;
  return '';
}

/* ════ MINHAS HORAS ════ */

          <div>${s.status==='autorizada'?'<span class="tag t-ok">Autorizada</span>':s.status==='negada'?'<span class="tag t-no">Negada</span>':s.status==='cancelada'?'<span class="tag t-gray">Cancelada</span>':`<span class="tag t-wait">Aguardando</span> <button class="btn s" data-cancel="${s.id}">Cancelar</button>`}</div>
        </div>`).join(''):'<p class="muted" style="margin-top:8px">Nenhum pedido neste mês.</p>'}
    </div>

      ${ev.length?cabDias()+ev.map(d=>diaHTML(d)).join(''):'<p class="muted">Nenhuma hora extra ou compensação neste mês.</p>'}
      <p class="sub" style="margin-top:10px">Os horários vêm do ponto eletrônico. Algo errado? Fale com seu superior.</p>
    </div>`;
  $('b-sol').onclick = () => formHE(null);
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    try { await rpc('he_cancelar', {p_token:S.token, p_id:+b.dataset.cancel}); carregar(); } catch(e){ alertar(e.message); }
  });
}

/* ── formulário de HE (pedido próprio ou autorização direta do líder) ── */
function formHE(pessoa){
  const hoje = new Date().toISOString().slice(0,10);
  modal(`<div class="md-h"><h2 style="margin:0">${pessoa?'Autorizar HE':'Solicitar hora extra'}</h2><button class="x-btn" data-close>×</button></div>
    ${pessoa?`<p class="sub">${esc(pessoa.nome)}</p>`:'<p class="sub">Seu superior imediato recebe o pedido para autorizar.</p>'}
    <label for="h-data">Data</label><input class="in" type="date" id="h-data" value="${hoje}">
    <div class="row"><div><label for="h-ini">Início previsto</label><input class="in" type="time" id="h-ini" value="17:30"></div>
      <div><label for="h-fim">Fim previsto</label><input class="in" type="time" id="h-fim" value="19:30"></div></div>
    <label for="h-mot">Motivo</label><textarea class="in" id="h-mot" rows="3" placeholder="Ex.: parada programada do cliente, nota 4560795"></textarea>
    <button class="btn p w" id="h-ok">${pessoa?'Autorizar':'Enviar pedido'}</button><div id="h-m"></div>`);
  $('h-ok').onclick = async () => {
    const a = {p_token:S.token, p_data:$('h-data').value, p_inicio:$('h-ini').value, p_fim:$('h-fim').value, p_motivo:$('h-mot').value.trim()};
    if (!a.p_data || !a.p_inicio || !a.p_fim) return msg('h-m','Preencha data e horários.');
    if (!a.p_motivo) return msg('h-m','Informe o motivo.');
    busy($('h-ok'),true);
    try {
      if (pessoa) await rpc('he_autorizar_direto', {...a, p_pessoa:pessoa.pessoa_id});
      else await rpc('he_solicitar', a);
      fecharModal(); carregar();
    } catch(e){ msg('h-m', e.message); busy($('h-ok'),false); }
  };
}

/* ════ EQUIPE ════ */
const mesmoConj = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
function vEquipe(){
  const base = S.resumo.filter(r => r.pessoa_id !== S.eu.id);
  const eq = filtrar(base);
  const naSel = r => S.sel.has(r.pessoa_id);
  const selEq = eq.filter(naSel);
  const alvo = selEq.length ? selEq : eq;                       // indicadores: seleção ou equipe toda
  const lista = S.soSel && selEq.length ? selEq : eq;           // tabela
  const g = (S.grupos||[]).find(x => x.id === S.grupoId) || null;
  if (!g) S.grupoId = null;
  const alterado = g && !mesmoConj(new Set(g.pessoas), S.sel);
  const linhaEq = r => `<tr class="click ${naSel(r)?'sel':''}" data-i="${eq.indexOf(r)}" data-n="${esc(r.nome.toLowerCase())}">
          <td class="ck"><input type="checkbox" data-ck="${r.pessoa_id}" ${naSel(r)?'checked':''} aria-label="Selecionar ${esc(r.nome)}"></td>
          <td class="l">${esc(r.nome)}<div class="sub">${PAPEL[r.papel]}${r.cargo?' · '+esc(r.cargo):''}${r.superior?' · '+esc(r.superior):''}</div></td>
          <td data-l="HE feitas">${hm(r.he50+r.he75+r.he100)}</td><td data-l="Folga gerada">${hm(r.normalizado)}</td><td data-l="Compensado">${hm(r.compensado)}</td>
          <td data-l="Saldo" class="${r.saldo>0?'plus':''}"><b>${hm(r.saldo)}</b></td>
          <td class="l">${r.dias_sem_aut?`<span class="tag t-no">${r.dias_sem_aut} sem autorização</span> `:''}${r.aud_dias?`<span class="tag t-aud">${r.aud_dias} auditar Quark</span> `:''}${r.intersticios?`<span class="tag t-wait">${r.intersticios} interstício</span> `:''}${r.solicitacoes_pendentes?`<span class="tag t-gray">${r.solicitacoes_pendentes} pedido</span> `:''}${r.incompletos?`<span class="tag t-inc">${r.incompletos} ponto incompleto</span> `:''}${r.acion_sugeridos?`<span class="tag t-sa">${r.acion_sugeridos} acionamento a confirmar</span> `:''}${r.sa_min?`<span class="tag t-sa">🌙 ${hm(r.sa_min)}</span>`:''}</td></tr>`;
  const corpo = usaFiltro()
    ? porSetor(lista).map(([k,ps]) => cabGrupo('eq:'+k, 7, k, `${ps.length} pessoas · folga gerada ${hm(ps.reduce((s,r)=>s+r.normalizado,0))} · a tirar ${hm(ps.reduce((s,r)=>s+r.saldo,0))}`) + ps.map(r => linhaDoGrupo('eq:'+k, linhaEq(r))).join('')).join('')
    : lista.map(linhaEq).join('');
  const tot = k => alvo.reduce((s,r)=>s+(r[k]||0),0);
  const heFeitas = alvo.reduce((s,r)=>s+r.he50+r.he75+r.he100,0);
  const semAut = tot('dias_sem_aut'), aud = tot('aud_dias');
  const selbar = `<div class="selbar">
      ${S.grupos && S.grupos.length?`<select class="in" id="g-sel" aria-label="Grupo"><option value="">${S.eu.papel==='rh'?'Todas as pessoas':'Toda a equipe'}</option>
        ${S.grupos.map(x=>`<option value="${x.id}" ${x.id===S.grupoId?'selected':''}>${esc(x.nome)} (${x.pessoas.length})</option>`).join('')}</select>`:''}
      ${selEq.length?`<span class="info">Indicadores de <b>${selEq.length}</b> de ${eq.length} pessoas${g?` · grupo <b>${esc(g.nome)}</b>${alterado?' (alterado)':''}`:''}</span>
        <label class="info" style="display:flex;gap:5px;align-items:center;margin:0"><input type="checkbox" id="g-so" ${S.soSel?'checked':''}> só os selecionados na tabela</label>
        ${S.grupos?(g?`${alterado?'<button class="btn p s" id="g-upd">Salvar alterações no grupo</button>':''}<button class="btn s" id="g-ren">Renomear</button><button class="btn s" id="g-new">Salvar como novo grupo</button><button class="btn no s" id="g-del">Excluir grupo</button>`
          :'<button class="btn p s" id="g-new">Salvar como grupo</button>'):''}
        <button class="lnk2" id="g-clr">Limpar seleção</button>`
      :`<span class="info">Marque pessoas na tabela para ver os indicadores só delas${S.grupos?' e salvar como grupo (ex.: um por contrato)':''}.</span>`}
    </div>`;
  $('main').innerHTML = `
    ${barraFiltro(base)}
    ${S.pend.length?`<div class="card"><h2>Pedidos para decidir (${S.pend.length})</h2>
      ${S.pend.map(p=>`<div class="pend"><b>${esc(p.nome)}</b>
        <div>${new Date(p.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})} · ${p.inicio.slice(0,5)}–${p.fim.slice(0,5)}</div>
        <div class="sub">${esc(p.motivo)} ${p.antecedencia_horas<0?'<span class="tag t-no">Pedido depois do início</span>':''}</div>
        <div class="a"><button class="btn ok s" data-dec="autorizada" data-id="${p.id}">Autorizar</button>
          <button class="btn no s" data-dec="negada" data-id="${p.id}">Negar</button></div></div>`).join('')}</div>`:''}
    ${selbar}
    <div class="kpis">
      <div class="st"><div class="l">Pessoas com HE no mês</div><div class="v">${alvo.filter(r=>r.normalizado>0).length}</div><div class="l">de ${alvo.length}${selEq.length?' selecionadas':''}</div></div>
      <div class="st"><div class="l">HE feitas (sem fator)</div><div class="v">${hm(heFeitas)}</div><div class="l">horas reais além da jornada</div></div>
      <div class="st"><div class="l">Folga gerada</div><div class="v">${hm(tot('normalizado'))}</div><div class="l">≈ ${(tot('normalizado')/528).toFixed(1).replace('.',',')} dias de 8h48</div></div>
      <div class="st"><div class="l">Folga ainda a tirar</div><div class="v plus">${hm(tot('saldo'))}</div></div>
      <div class="st"><div class="l">Dias com HE sem autorização</div><div class="v ${semAut?'plus':''}">${semAut}</div>${aud?`<div class="l">+ ${aud} dia${aud>1?'s':''} para auditar no Quark</div>`:''}</div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <h2 style="margin:0">${S.eu.papel==='rh'?'Pessoas':'Minha equipe'} no mês</h2>
      ${LIDER.includes(S.eu.papel)?'<button class="btn p s" id="b-conv-eq">+ Convidar pessoa</button>':''}</div>
      <p class="sub" style="margin-bottom:8px">Toque em uma pessoa para ver os dias${LIDER.includes(S.eu.papel)?' e autorizar HE':''}. Use as caixinhas para selecionar.</p>
      ${eq.length>12?`<input class="in" id="b-eq" placeholder="Buscar nome" style="margin-bottom:10px" value="${esc(S.busca)}">`:''}
      ${botoesGrupo('ge')}
      <div class="tw"><table class="resp">
        <thead><tr><th class="ck"><input type="checkbox" id="ck-all" title="Marcar/desmarcar todos os que aparecem" aria-label="Selecionar todos"></th><th class="l">Nome</th><th>HE feitas</th><th>Folga gerada</th><th>Compensado</th><th>Saldo</th><th class="l">Alertas</th></tr></thead>
        <tbody>${corpo}</tbody></table></div>
      ${eq.length?'':'<p class="muted">Ninguém da equipe aprovado ainda. As pessoas aparecem aqui quando o cadastro delas indicar você como superior.</p>'}
    </div>`;
  const redesenhar = () => { const y = scrollY; vEquipe(); scrollTo(0, y); };
  document.querySelectorAll('[data-dec]').forEach(b => b.onclick = async () => {
    try { await rpc('he_decidir', {p_token:S.token, p_id:+b.dataset.id, p_status:b.dataset.dec}); carregar(); } catch(e){ alertar(e.message); }
  });
  document.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = ev => { if (!ev.target.closest('td.ck')) detalhe(eq[+tr.dataset.i]); });
  document.querySelectorAll('td.ck').forEach(td => td.onclick = ev => { ev.stopPropagation(); if (ev.target.tagName !== 'INPUT') td.querySelector('input').click(); });
  document.querySelectorAll('[data-ck]').forEach(c => c.onchange = () => { c.checked ? S.sel.add(c.dataset.ck) : S.sel.delete(c.dataset.ck); redesenhar(); });
  const visiveis = () => [...document.querySelectorAll('tr[data-i]')].filter(tr => tr.style.display !== 'none').map(tr => tr.querySelector('[data-ck]').dataset.ck);
  const ckAll = $('ck-all'), vis = visiveis();
  ckAll.checked = vis.length > 0 && vis.every(id => S.sel.has(id));
  ckAll.indeterminate = !ckAll.checked && vis.some(id => S.sel.has(id));
  ckAll.onchange = () => { const v = visiveis(); v.forEach(id => ckAll.checked ? S.sel.add(id) : S.sel.delete(id)); redesenhar(); };
  if ($('g-sel')) $('g-sel').onchange = () => { const x = S.grupos.find(y => String(y.id) === $('g-sel').value);
    S.grupoId = x ? x.id : null; S.sel = new Set(x ? x.pessoas : []); S.soSel = !!x; redesenhar(); };
  if ($('g-so')) $('g-so').onchange = () => { S.soSel = $('g-so').checked; redesenhar(); };
  if ($('g-clr')) $('g-clr').onclick = () => { S.sel = new Set(); S.grupoId = null; S.soSel = false; redesenhar(); };
  if ($('g-new')) $('g-new').onclick = () => nomeGrupo(null, '');
  if ($('g-ren')) $('g-ren').onclick = () => nomeGrupo(g, g.nome);
  if ($('g-upd')) $('g-upd').onclick = () => salvarGrupo(g.id, g.nome);
  if ($('g-del')) $('g-del').onclick = async () => {
    if (!confirm(`Excluir o grupo "${g.nome}"? As pessoas não são afetadas.`)) return;
    try { await rpc('he_grupo_excluir', {p_token:S.token, p_id:g.id}); S.grupos = S.grupos.filter(x => x.id !== g.id);
      S.grupoId = null; S.sel = new Set(); S.soSel = false; redesenhar(); } catch(e){ alertar(e.message); } };
  if ($('b-conv-eq')) $('b-conv-eq').onclick = () => convidar();
  const buscar = () => { const q = S.busca.toLowerCase();
    document.querySelectorAll('tr[data-i]').forEach(tr => tr.style.display = tr.dataset.n.includes(q) ? '' : 'none');
    document.querySelectorAll('tr.grp').forEach(tr => tr.style.display = q ? 'none' : '');
    if (!q) document.querySelectorAll('tr[data-de]').forEach(l => l.style.display = FECHADOS.has(l.dataset.de) ? 'none' : ''); };
  if ($('b-eq')) { $('b-eq').oninput = () => { S.busca = $('b-eq').value; buscar(); }; if (S.busca) buscar(); }
  ligarFiltro(vEquipe);
  ligarGrupos('ge', porSetor(lista).map(([k]) => 'eq:'+k));
}
/* grupos salvos: nome (novo ou renomear) e gravação */
function nomeGrupo(g, atual){
  modal(`<div class="md-h"><h2 style="margin:0">${g?'Renomear grupo':'Salvar grupo'}</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">${S.sel.size} pessoa${S.sel.size>1?'s':''} selecionada${S.sel.size>1?'s':''}. Só você vê seus grupos.</p>
    <label for="gn">Nome do grupo</label><input class="in" id="gn" maxlength="60" value="${esc(atual)}" placeholder="Ex.: Contrato CESAN Norte">
    <button class="btn p w" id="gn-ok">Salvar</button><div id="gn-m"></div>`);
  $('gn').focus();
  $('gn-ok').onclick = () => salvarGrupo(g ? g.id : null, $('gn').value.trim(), 'gn-m', g ? g.pessoas : null);
  $('gn').onkeydown = e => { if (e.key === 'Enter') $('gn-ok').click(); };
}
async function salvarGrupo(id, nome, el, pessoas){
  if (!nome) return el ? msg(el, 'Dê um nome ao grupo.') : null;
  try {
    const nid = await rpc('he_grupo_salvar', {p_token:S.token, p_id:id, p_nome:nome, p_pessoas:pessoas || [...S.sel]});
    S.grupos = await rpc('he_grupos', {p_token:S.token}); S.grupoId = nid; S.soSel = true; if (pessoas) S.sel = new Set(pessoas);
    fecharModal(); vEquipe();
  } catch(e){ el ? msg(el, e.message) : alertar(e.message); }
}
async function detalhe(p){
  modal('<div class="loading">Carregando…</div>');
  try {
    const [dias, auts, acs] = await Promise.all([
      rpc('he_dias', {p_token:S.token, p_pessoa:p.pessoa_id, p_mes:mesData()}),
      rpc('he_autorizacoes', {p_token:S.token, p_escopo:'equipe', p_mes:mesData()}),
      rpc('he_acionamentos', {p_token:S.token, p_pessoa:p.pessoa_id, p_mes:mesData()})
    ]);
    const minhas = auts.filter(a => a.pessoa_id === p.pessoa_id);
    const podeAut = LIDER.includes(S.eu.papel);
    const ev = dias.filter(d => diaRelevante(d) || /interst/i.test(d.observacao||''));
    const fmtDH = t => t.slice(8,10)+'/'+t.slice(5,7)+' '+t.slice(11,16);
    modal(`<div class="md-h"><h2 style="margin:0">${esc(p.nome)}</h2><button class="x-btn" data-close>×</button></div>
      <p class="sub">HE feitas: <b>${hm(p.he50+p.he75+p.he100)}</b> · folga gerada ${hm(p.normalizado)} · compensado ${hm(p.compensado)} · saldo de folga <b>${hm(p.saldo)}</b></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
        ${podeAut?'<button class="btn p s" id="b-aut">+ Autorizar HE</button><button class="btn s" id="b-acn">+ Acionamento de sobreaviso</button>':''}
        <button class="btn s" id="b-imp">Imprimir relatório do mês</button></div>
      <h3 style="margin-top:10px">Dias com HE ou compensação</h3>
      ${dias.some(d=>d.aud_tol)?`<div class="note" style="background:#EFE3FA;color:#5B2A86">⚠ ${dias.filter(d=>d.aud_tol).length} dia(s) dentro da tolerância de ponto em que o Quark apontou HE (${hm(dias.reduce((s,d)=>s+(d.aud_tol||0),0))}). Peça ao RH para auditar no Quark. Até lá, essas horas seguem contando como estão no ponto.</div>`:''}
      ${ev.length?cabDias():''}${ev.map(d=>diaHTML(d, d.sugestao&&podeAut?`<div class="sug">🌙 Batida na noite de sobreaviso (${fmtDH(d.sugestao.split('|')[0])} a ${fmtDH(d.sugestao.split('|')[1])}). Foi acionamento?
          <button class="btn s" data-sug="${d.data}|${d.sugestao}">Registrar acionamento</button></div>`:'')).join('')||'<p class="muted">Nada neste mês.</p>'}
      ${acs.length?`<h3 style="margin-top:14px">Acionamentos de sobreaviso</h3>${acs.map(a=>`<div class="pend"><b>${fmtDH(a.inicio)} → ${fmtDH(a.fim)}</b>
        <span class="tag t-sa">noite de ${a.data.split('-').reverse().slice(0,2).join('/')}</span>
        <div class="sub">${esc(a.motivo||'sem motivo informado')}${a.registrado_por?' · registrado por '+esc(a.registrado_por):''}</div>
        ${podeAut?`<div class="a"><button class="btn no s" data-acx="${a.id}">Excluir</button></div>`:''}</div>`).join('')}`:''}
      <h3 style="margin-top:14px">Autorizações do mês</h3>
      ${minhas.map(a=>`<div class="pend"><b>${a.data.split('-').reverse().slice(0,2).join('/')} · ${a.inicio.slice(0,5)}–${a.fim.slice(0,5)}</b>
        <span class="tag ${a.status==='autorizada'?'t-ok':a.status==='negada'?'t-no':a.status==='solicitada'?'t-wait':'t-gray'}">${a.status}</span>
        <div class="sub">${esc(a.motivo)}${a.decisor?' · por '+esc(a.decisor):''}</div>
        ${podeAut&&a.status==='autorizada'?`<label>Atividade impactada pela compensação (se houver)</label>
          <div style="display:flex;gap:6px"><input class="in" data-imp="${a.id}" value="${esc(a.impacto||'')}" placeholder="Ex.: preventiva da EE Carapina adiada">
          <button class="btn s" data-imps="${a.id}">Salvar</button></div>`:(a.impacto?`<div class="sub">Impacto: ${esc(a.impacto)}</div>`:'')}
      </div>`).join('')||'<p class="muted">Nenhuma neste mês.</p>'}
      <div id="d-m"></div>`);
    if (podeAut) {
      $('b-aut').onclick = () => formHE(p);
      $('b-acn').onclick = () => formAcion(p);
      document.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => {
        const [noite, ini, fim] = b.dataset.sug.split('|'); formAcion(p, {noite, ini, fim}); });
      document.querySelectorAll('[data-acx]').forEach(b => b.onclick = async () => {
        if (!confirm('Excluir este acionamento? As horas voltam a ser calculadas como no ponto.')) return;
        try { await rpc('he_acionamento_excluir', {p_token:S.token, p_id:+b.dataset.acx}); carregar().then(()=>detalhe(p)); }
        catch(e){ msg('d-m', e.message); } });
    }
    $('b-imp').onclick = () => imprimir(p, dias, minhas);
    document.querySelectorAll('[data-imps]').forEach(b => b.onclick = async () => {
      const id = b.dataset.imps, v = document.querySelector(`[data-imp="${id}"]`).value;
      try { await rpc('he_registrar_impacto', {p_token:S.token, p_id:+id, p_impacto:v}); msg('d-m','Impacto salvo.',true); }
      catch(e){ msg('d-m', e.message); }
    });
  } catch(e){ modal(`<div class="msg e">${esc(e.message)}</div>`); }
}

/* ── acionamento de sobreaviso (líder) ── */
function formAcion(p, pre){
  pre = pre || {};
  const ontem = new Date(Date.now()-864e5).toISOString().slice(0,10);
  const noite = pre.noite || ontem;
  const prox = d => new Date(new Date(d+'T12:00').getTime()+864e5).toISOString().slice(0,10);
  modal(`<div class="md-h"><h2 style="margin:0">Acionamento de sobreaviso</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">${esc(p.nome)}</p>
    <div class="expl">O tempo do acionamento vira hora extra do dia da escala (somando às HE daquele dia) e para de contar como sobreaviso. No dia seguinte, a jornada fica abonada até 11h depois do fim do acionamento.</div>
    <label for="ac-noite">Noite de sobreaviso (dia da escala)</label><input class="in" type="date" id="ac-noite" value="${noite}">
    <div class="row"><div><label for="ac-ini">Início</label><input class="in" type="datetime-local" id="ac-ini" value="${pre.ini || prox(noite)+'T00:00'}"></div>
      <div><label for="ac-fim">Fim</label><input class="in" type="datetime-local" id="ac-fim" value="${pre.fim || prox(noite)+'T02:00'}"></div></div>
    <label for="ac-mot">Motivo</label><textarea class="in" id="ac-mot" rows="2" placeholder="Ex.: falha na bomba 2 da EE Carapina, OS 4560795"></textarea>
    <button class="btn p w" id="ac-ok">Registrar acionamento</button><div id="ac-m"></div>`);
  $('ac-ok').onclick = async () => {
    const ini = $('ac-ini').value, fim = $('ac-fim').value;
    if (!$('ac-noite').value || !ini || !fim) return msg('ac-m','Preencha a noite, o início e o fim.');
    busy($('ac-ok'), true);
    try {
      await rpc('he_acionamento_registrar', {p_token:S.token, p_pessoa:p.pessoa_id, p_noite:$('ac-noite').value,
        p_inicio:ini.replace('T',' '), p_fim:fim.replace('T',' '), p_motivo:$('ac-mot').value.trim()});
      await carregar(); detalhe((S.resumo.find(r=>r.pessoa_id===p.pessoa_id))||p);
    } catch(e){ msg('ac-m', e.message); busy($('ac-ok'), false); }
  };
}

/* ── relatório individual para impressão / PDF ──
   Valores em R$ só aparecem quando o banco devolve hora_base (RH e administrador). */
function imprimir(p, dias, auts){
  let mesTxt = new Date(S.mes+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  mesTxt = mesTxt.charAt(0).toUpperCase() + mesTxt.slice(1);
  const dt = s => s.split('-').reverse().join('/');
  const ev = dias.filter(d => d.he50||d.he75||d.he100||d.noturna||d.hn||(d.desconto&&!d.abonado)||d.sa_noite);
  const obsDia = d => [d.acion_min?`Acionamento de sobreaviso ${d.acion_txt} (${hm(d.acion_min)} de HE)`:'',
    d.sa_noite?`Sobreaviso ${hm(d.sa_min)}`:'', d.descanso_ate?`Descanso de 11h até ${d.descanso_ate.slice(11,16)}`:'', d.observacao||'']
    .filter(Boolean).join(' · ');
  const sa = p.sa_min || 0;
  const hb = p.hora_base != null ? +p.hora_base : null;
  const not = (p.noturna||0) + (p.hn||0);
  let fin = '';
  if (hb) {
    const r = rubricas(p, S.ordem);
    const v = {he50:r.he50/60*hb*1.5, he75:r.he75/60*hb*1.75, he100:r.he100/60*hb*2, not:not/60*hb*0.2, sa:sa/60*hb/3};
    const nomeOrd = {'50_primeiro':'abater primeiro as de 50%','100_primeiro':'abater primeiro as de 100%','proporcional':'abatimento proporcional'}[S.ordem];
    fin = `<h3>Valores a pagar em folha (hora base ${brl(hb)})</h3>
      <table><thead><tr><th class="l">Rubrica</th><th>Horas</th><th>Fator</th><th>Valor</th></tr></thead><tbody>
      <tr><td class="l">Horas extras 50% não compensadas</td><td>${hm(r.he50)}</td><td>1,50</td><td>${brl(v.he50)}</td></tr>
      <tr><td class="l">Horas extras 75% não compensadas</td><td>${hm(r.he75)}</td><td>1,75</td><td>${brl(v.he75)}</td></tr>
      <tr><td class="l">Horas extras 100% não compensadas</td><td>${hm(r.he100)}</td><td>2,00</td><td>${brl(v.he100)}</td></tr>
      <tr><td class="l">Adicional noturno</td><td>${hm(not)}</td><td>0,20</td><td>${brl(v.not)}</td></tr>
      ${sa?`<tr><td class="l">Sobreaviso</td><td>${hm(sa)}</td><td>1/3</td><td>${brl(v.sa)}</td></tr>`:''}
      <tr><th class="l">Total a pagar</th><th></th><th></th><th>${brl(v.he50+v.he75+v.he100+v.not+v.sa)}</th></tr>
      </tbody></table>
      <p class="nota">Critério de compensação: ${nomeOrd}.</p>`;
  }
  const mesCurto = new Date(S.mes+'-15').toLocaleDateString('pt-BR',{month:'2-digit',year:'numeric'});
  $('print').innerHTML = `<div class="rp">
    <div class="cab"><div><h1>Demonstrativo de horas extras e compensações</h1><div>i9 Engenharia e Tecnologia</div></div>
      <div style="text-align:right"><b style="font-size:14px">Competência ${esc(mesTxt)}</b><div>Fonte: registro eletrônico de ponto</div></div></div>
    <div class="id">
      <div><b>Colaborador:</b> ${esc(p.nome)}</div><div><b>Cargo:</b> ${esc(p.cargo||'—')}</div>
      <div><b>Empresa:</b> ${esc(p.empresa||'—')}</div><div><b>Superior imediato:</b> ${esc(p.superior||'—')}</div>
    </div>
    <h3>Resumo da competência</h3>
    <table><thead><tr><th>Horas extras 50%</th><th>Horas extras 75%</th><th>Horas extras 100%</th><th>Crédito de folga</th><th>Folga compensada</th><th>Saldo pago em folha</th><th>Adicional noturno (horas)</th>${sa?'<th>Sobreaviso (horas)</th>':''}</tr></thead>
      <tbody><tr><td>${hm(p.he50)}</td><td>${hm(p.he75)}</td><td>${hm(p.he100)}</td><td>${hm(p.normalizado)}</td>
        <td>${hm(p.compensado)}</td><td><b>${hm(p.saldo)}</b></td><td>${hm(not)}</td>${sa?`<td>${hm(sa)}</td>`:''}</tr></tbody></table>
    ${p.acion_min?`<p class="nota">Das horas extras, ${hm(p.acion_min)} foram de acionamento durante o sobreaviso.</p>`:''}
    <p class="nota">Cada hora extra gera crédito de folga já com o adicional legal: 1h a 50% = 1h30, a 75% = 1h45, a 100% = 2h.
      As folgas e ausências do mês são abatidas desse crédito. O crédito não compensado até o fim da competência é pago em folha,
      com os adicionais, e não é transferido para o mês seguinte.</p>
    ${fin}
    <h3>Detalhamento por dia</h3>
    ${ev.length?`<table><thead><tr><th class="l">Data</th><th class="l">Marcações</th><th>HE 50%</th><th>HE 75%</th><th>HE 100%</th><th>Noturno</th><th>Folga / ausência</th><th class="l">Observação</th></tr></thead><tbody>
      ${ev.map(d=>`<tr><td class="l">${dt(d.data)} ${DIA[new Date(d.data+'T12:00').getDay()]}</td><td class="l">${esc(d.batidas||'')}</td>
        <td>${d.he50?hm(d.he50):''}</td><td>${d.he75?hm(d.he75):''}</td><td>${d.he100?hm(d.he100):''}</td>
        <td>${(d.noturna+d.hn)?hm(d.noturna+d.hn):''}</td><td>${d.desconto&&!d.abonado?hm(d.desconto):''}</td>
        <td class="l">${esc(obsDia(d))}</td></tr>`).join('')}
    </tbody></table>`:'<p>Nenhuma hora extra ou compensação na competência.</p>'}
    ${auts.filter(a=>a.status==='autorizada').length?`<h3>Horas extras autorizadas</h3>
    <table><thead><tr><th class="l">Data</th><th class="l">Horário</th><th class="l">Motivo</th><th class="l">Autorizado por</th></tr></thead><tbody>
      ${auts.filter(a=>a.status==='autorizada').map(a=>`<tr><td class="l">${dt(a.data)}</td><td class="l">${a.inicio.slice(0,5)}–${a.fim.slice(0,5)}</td><td class="l">${esc(a.motivo)}</td>
        <td class="l">${esc(a.decisor||'')}</td></tr>`).join('')}
    </tbody></table>`:''}
    <p class="decl">Declaro ter recebido este demonstrativo e conferido as informações, extraídas do registro eletrônico de ponto da competência ${esc(mesCurto)}.</p>
    <div class="obs">Observações do colaborador:<div></div><div></div></div>
    <div class="ass"><div>Colaborador<br><span>data: ____/____/______</span></div><div>Superior imediato</div><div>Recursos Humanos</div></div>
    <div class="rod">Emitido em ${new Date().toLocaleString('pt-BR')}</div>
  </div>`;
  const tituloAntigo = document.title;
  document.title = `Demonstrativo de horas - ${p.nome} - ${S.mes}`;
  const limpar = () => { $('print').innerHTML = ''; document.title = tituloAntigo; window.removeEventListener('afterprint', limpar); };
  window.addEventListener('afterprint', limpar);
  setTimeout(() => window.print(), 50);
}

/* ════ ESCALA DE SOBREAVISO ════ */
async function vSobreaviso(){
  const marc = await rpc('he_sobreaviso_mes', {p_token:S.token, p_mes:mesData()});
  const on = new Set(marc.map(e => e.pessoa_id + '|' + e.data));
  const [ano, mes] = S.mes.split('-').map(Number), nd = new Date(ano, mes, 0).getDate();
  const dia = i => `${S.mes}-${String(i).padStart(2,'0')}`;
  const dow = i => new Date(ano, mes-1, i).getDay();
  const base = S.resumo;
  const comEscala = new Set(marc.map(e => e.pessoa_id));
  let lista = filtrar(base).filter(p => S.eu.papel === 'admin' || p.pessoa_id !== S.eu.id);  // a própria escala é marcada pelo superior
  if (S.saSo) lista = lista.filter(p => comEscala.has(p.pessoa_id));
  lista = [...lista].sort((a,b) => (comEscala.has(b.pessoa_id) - comEscala.has(a.pessoa_id)) || a.nome.localeCompare(b.nome));
  const noites = p => { let n = 0; for (let i=1;i<=nd;i++) if (on.has(p.pessoa_id+'|'+dia(i))) n++; return n; };
  $('main').innerHTML = `
    ${barraFiltro(base)}
    <div class="card"><h2>Escala de sobreaviso</h2>
      <div class="expl">Marque as <b>noites</b> em que cada pessoa fica de sobreaviso. A noite de um dia vai das 17:30 até as 07:30 do dia seguinte
        (ex.: marcar a segunda cobre de segunda 17:30 a terça 07:30). Fora do trabalho, essas horas valem 1/3 da hora base.
        Quando houver batida dentro da noite, o app sugere registrar o <b>acionamento</b> no detalhe da pessoa (aba Equipe).</div>
      <div class="sa-bar">
        <input class="in" id="sa-q" placeholder="Buscar nome" style="flex:1 1 180px">
        <label style="display:flex;gap:6px;align-items:center;font-size:13px;margin:0"><input type="checkbox" id="sa-so" ${S.saSo?'checked':''}> Só quem tem escala no mês</label>
      </div>
      <div class="sa-bar" id="sa-lote">
        <b id="sa-n" style="font-size:13px">Marque pessoas na lista para aplicar um período</b>
        <span style="font-size:13px">de</span><input class="in" type="date" id="sa-de" value="${dia(1)}">
        <span style="font-size:13px">até</span><input class="in" type="date" id="sa-ate" value="${dia(Math.min(5,nd))}">
        <button class="btn p s" id="sa-mk" disabled>Marcar noites</button><button class="btn s" id="sa-dm" disabled>Desmarcar</button>
      </div>
      <div class="sa-wrap"><table class="sa-t">
        <thead><tr><th class="nm"><input type="checkbox" id="sa-all" title="Selecionar todos da lista"> Nome</th>
          ${Array.from({length:nd},(_,k)=>k+1).map(i=>`<th class="${[0,6].includes(dow(i))?'fds':''}">${i}<br>${DIA[dow(i)][0].toUpperCase()}</th>`).join('')}</tr></thead>
        <tbody>${lista.map(p=>`<tr data-n="${esc(p.nome.toLowerCase())}"><td class="nm"><input type="checkbox" class="sa-sel" value="${p.pessoa_id}"> ${esc(p.nome)}
            <span class="sub" data-cnt="${p.pessoa_id}">${noites(p)?'· '+noites(p)+(noites(p)>1?' noites':' noite'):''}</span></td>
          ${Array.from({length:nd},(_,k)=>k+1).map(i=>{const k=p.pessoa_id+'|'+dia(i);return `<td class="dd ${on.has(k)?'on':''} ${[0,6].includes(dow(i))?'fds':''}" data-k="${k}" title="${esc(p.nome)} · noite de ${i}/${mes}">${on.has(k)?'🌙':''}</td>`;}).join('')}</tr>`).join('')
          || `<tr><td class="nm muted" style="padding:12px">Ninguém na lista.</td></tr>`}</tbody></table></div>
      <div id="sa-m"></div>
    </div>`;
  ligarFiltro(vSobreaviso);
  $('sa-so').onchange = () => { S.saSo = $('sa-so').checked; vSobreaviso(); };
  $('sa-q').oninput = () => { const q = $('sa-q').value.toLowerCase();
    document.querySelectorAll('.sa-t tbody tr[data-n]').forEach(tr => tr.style.display = tr.dataset.n.includes(q) ? '' : 'none'); };
  const sel = () => [...document.querySelectorAll('.sa-sel:checked')].map(i => i.value);
  const atualiza = () => { const n = sel().length;
    $('sa-n').textContent = n ? n + (n===1?' pessoa selecionada':' pessoas selecionadas') : 'Marque pessoas na lista para aplicar um período';
    $('sa-mk').disabled = $('sa-dm').disabled = !n; };
  document.querySelectorAll('.sa-sel').forEach(i => i.onchange = atualiza);
  $('sa-all').onchange = () => { document.querySelectorAll('.sa-t tbody tr[data-n]').forEach(tr => {
    if (tr.style.display !== 'none') tr.querySelector('.sa-sel').checked = $('sa-all').checked; }); atualiza(); };
  const lote = async marcar => {
    const ids = sel(), de = $('sa-de').value, ate = $('sa-ate').value;

/* ════ FECHAMENTO RH ════ */
const FAT = {he50:1.5, he75:1.75, he100:2.0};
const ORDENS = {
  '50_primeiro': ['he50','he75','he100'],
  '100_primeiro': ['he100','he75','he50']
};
// Divide o saldo não compensado nas rubricas, conforme a ordem de abatimento.
function rubricas(r, ordem){
  const out = {he50:r.he50, he75:r.he75, he100:r.he100};
  let resto = r.compensado;               // em minutos de hora normal
  if (ordem === 'proporcional') {
    const k = r.normalizado ? 1 - r.compensado / r.normalizado : 0;
    for (const f in out) out[f] = Math.round(out[f] * k);
    return out;
  }
  for (const f of ORDENS[ordem]) {
    const cap = out[f] * FAT[f], uso = Math.min(resto, cap);
    out[f] = Math.round(out[f] - uso / FAT[f]); resto -= uso;
  }
  return out;
}

      he50: p.he50/60*hb*1.5, he75: p.he75/60*hb*1.75, he100: p.he100/60*hb*2.0, not: not/60*hb*0.2,
      sa: (r.sa_min||0)/60*hb/3

      <button class="btn p w" id="n-ok">Adicionar</button><div id="n-m"></div>`);
    $('n-ok').onclick = async () => {
      try { const id = await rpc('he_admin_criar_pessoa', {p_token:S.token, p_nome:$('n-nome').value, p_empresa:$('n-emp').value});
        convidar({id, nome:$('n-nome').value.toUpperCase()}); S.pessoas = null; } catch(e){ msg('n-m', e.message); }
    };
  };
}
function editar(p, opSup, opPap, adm){
  modal(`<div class="md-h"><h2 style="margin:0">${esc(p.nome)}</h2><button class="x-btn" data-close>×</button></div>
    ${adm?`<label>Função</label><select class="in" id="e-pap" ${p.papel==='admin'?'disabled':''}>${p.papel==='admin'?'<option>Administrador</option>':opPap(p.papel)}</select>
    <label>Superior imediato</label><select class="in" id="e-sup">${opSup(p.superior_id, p.id)}</select>
    <label>Setor${p.cargo?' <span class="sub">('+esc(p.cargo)+')</span>':''}</label><select class="in" id="e-set"><option value="">— sem setor —</option>
      <optgroup label="Engenharia">${SETORES_ENG.map(x=>`<option ${x===p.setor?'selected':''}>${x}</option>`).join('')}</optgroup>
      <optgroup label="Outras áreas">${SETORES_ADM.map(x=>`<option ${x===p.setor?'selected':''}>${x}</option>`).join('')}</optgroup></select>`:''}
    ${adm?`<label>Celular (WhatsApp)</label><input class="in" id="e-tel" inputmode="tel" value="${esc(p.telefone||'')}" placeholder="(27) 99999-9999">`:''}
    <div class="row"><div><label>Matrícula</label><input class="in" id="e-mat" value="${esc(p.matricula||'')}"></div>
      <div><label>Hora base (R$)</label><input class="in" id="e-hb" inputmode="decimal" value="${p.hora_base??''}" placeholder="25,00"></div></div>
    <button class="btn p w" id="e-ok">Salvar</button>
    ${adm&&p.status==='sem_acesso'?'<button class="btn ok w" id="e-conv">Gerar convite para esta pessoa</button>':''}
    ${adm&&p.papel!=='admin'?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      ${p.status!=='sem_acesso'?'<button class="btn s" data-ac="resetar">Resetar PIN</button>':''}
      ${p.status==='bloqueado'?'<button class="btn s" data-ac="desbloquear">Desbloquear</button>':'<button class="btn no s" data-ac="bloquear">Bloquear acesso</button>'}</div>`:''}
    <div id="e-m"></div>`);
  if ($('e-conv')) $('e-conv').onclick = () => convidar(p);
  $('e-ok').onclick = async () => {
    const hb = $('e-hb').value.trim().replace(',', '.');
    try { await rpc('he_admin_editar', {p_token:S.token, p_pessoa:p.id,
        p_papel: adm && $('e-pap') && p.papel!=='admin' ? $('e-pap').value : null,
        p_superior: adm ? ($('e-sup').value || null) : p.superior_id,
        p_matricula: $('e-mat').value.trim() || null, p_hora_base: hb ? +hb : null,
        ...(adm ? {p_setor: $('e-set').value || null, p_telefone: $('e-tel').value.trim()} : {})});
      fecharModal(); S.pessoas = null; carregar(); } catch(e){ msg('e-m', e.message); }
  };
  document.querySelectorAll('[data-ac]').forEach(b => b.onclick = async () => {
    if (!confirm('Confirmar: ' + b.textContent + '?')) return;
    try { await rpc('he_admin_acesso', {p_token:S.token, p_pessoa:p.id, p_acao:b.dataset.ac}); fecharModal(); S.pessoas = null; carregar(); }
    catch(e){ msg('e-m', e.message); }
  });
}

/* ════ CONVITES ════ */
const NIVEL = {colaborador:0,supervisor:1,coordenador:2,gc:3,rh:3,admin:9};
function papeisConvite(){
  const todos = ['colaborador','supervisor','coordenador','gc','rh'];
  return S.eu.papel === 'admin' ? todos : todos.filter(k => k !== 'rh' && NIVEL[k] < NIVEL[S.eu.papel]);
}
function linkApp(){ return location.href.split('#')[0].split('?')[0]; }
function textoConvite(r){
  return `Olá, ${r.nome.split(' ')[0]}! Seu convite para o app Horas i9 é ${r.convite}. ` +
    `Abra ${linkApp()} e toque em "Tenho um convite". Depois, você entra com o código ${r.codigo} e o PIN que criar.`;
}
/* número de WhatsApp da pessoa (DDI 55; quem tem só 9 dígitos ganha o DDD 27) */
function foneWa(tel){
  let d = String(tel||'').replace(/\D/g,'').replace(/^0+/,'');
  if (d.startsWith('55') && d.length >= 12) d = d.slice(2);
  if (d.length === 9) d = '27' + d;
  return d.length === 10 || d.length === 11 ? '55' + d : '';
}
function linkWa(r){
  const p = (S.pessoas||[]).find(x => x.id === r.pessoa_id);
  return `https://wa.me/${foneWa(p && p.telefone)}?text=${encodeURIComponent(textoConvite(r))}`;
}
function mostrarConvites(lista){
  modal(`<div class="md-h"><h2 style="margin:0">Convites gerados</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">Envie cada convite só para a própria pessoa. Vale por 30 dias e só pode ser usado uma vez.</p>
    ${lista.map((r,i)=>`<div class="pend"><b>${esc(r.nome)}</b>
      <div style="font-size:22px;font-weight:700;letter-spacing:2px;margin:4px 0">${esc(r.convite)}</div>
      <div class="sub">Código de acesso: ${r.codigo}${(()=>{const p=(S.pessoas||[]).find(x=>x.id===r.pessoa_id);return p&&p.telefone?' · '+esc(p.telefone):' · sem telefone cadastrado (escolha o contato no WhatsApp)';})()}</div>
      <div class="a"><a class="btn ok s" target="_blank" rel="noopener" href="${linkWa(r)}">Enviar por WhatsApp</a>
        <button class="btn s" data-cp="${i}">Copiar mensagem</button></div></div>`).join('')
      || '<p class="muted">Nenhum convite gerado (a pessoa já tem acesso?).</p>'}
    <div id="cv-m"></div>`);
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(textoConvite(lista[+b.dataset.cp])); msg('cv-m','Mensagem copiada.',true); }
    catch(e){ msg('cv-m','Não foi possível copiar. Use o botão do WhatsApp.'); }
  });
}
function convidar(pre){
  const pap = papeisConvite();
  const adm = S.eu.papel === 'admin';
  modal(`<div class="md-h"><h2 style="margin:0">Convidar pessoa</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">${adm?'O convite do administrador já libera o acesso.':'Você será o superior imediato. O acesso é liberado depois da aprovação do administrador.'}</p>
    ${pre?`<div class="expl"><b>${esc(pre.nome)}</b></div>`:`<label for="cv-q">Nome (mínimo 3 letras)</label>
      <input class="in" id="cv-q" autocomplete="off" placeholder="Buscar quem ainda não tem acesso"><div id="cv-r" style="margin-top:8px"></div>`}
    <label for="cv-p">Função</label>
    <select class="in" id="cv-p">${pap.map(k=>`<option value="${k}" ${pre&&pre.papel===k?'selected':''}>${PAPEL[k]}</option>`).join('')}</select>
    ${adm?`<label for="cv-s">Superior imediato</label><select class="in" id="cv-s">${opcoesSuperior(pre&&pre.superior_id, pre&&pre.id, '— definir depois —')}</select>`:''}
    <button class="btn p w" id="cv-ok" ${pre?'':'disabled'}>Gerar convite</button><div id="cv-m2"></div>`);
  let escolhido = pre ? pre.id : null, t;
  if (!pre) $('cv-q').oninput = () => { clearTimeout(t); t = setTimeout(async () => {
    const q = $('cv-q').value.trim();
    if (q.length < 3) { $('cv-r').innerHTML = ''; return; }
    try {
      const r = await rpc('he_busca_sem_acesso', {p_token:S.token, p_q:q});
      $('cv-r').innerHTML = r.length ? r.map(x=>`<label class="opt" style="margin-bottom:6px"><input type="radio" name="cvp" value="${x.id}">
        <div><b>${esc(x.nome)}</b><span>${esc(x.empresa||'')}${x.convite_pendente?' · já tem convite em aberto (gerar de novo substitui)':''}</span></div></label>`).join('')
        : '<p class="muted">Ninguém sem acesso com esse nome.</p>';
      document.querySelectorAll('input[name=cvp]').forEach(i => i.onchange = () => { escolhido = i.value; $('cv-ok').disabled = false; });
    } catch(e){ msg('cv-m2', e.message); }
  }, 250); };
  $('cv-ok').onclick = async () => {
    if (!escolhido) return;
    try {
      const r = await rpc('he_convidar', {p_token:S.token, p_pessoas:[escolhido], p_papel:$('cv-p').value,
        p_superior: adm ? ($('cv-s').value || null) : null});
      mostrarConvites(r); S.pessoas = null;
    } catch(e){ msg('cv-m2', e.message); }
  };
}
function convitesLote(){
  const sem = (S.pessoas||[]).filter(p => p.status==='sem_acesso' && p.no_quark);
  const emp = [...new Set(sem.map(p=>p.empresa||''))];
  modal(`<div class="md-h"><h2 style="margin:0">Convites em lote</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">Gera um convite para cada colaborador que ainda não tem acesso e baixa uma planilha (CSV) com nome, código e convite, para entregar aos supervisores.</p>
    <label>Empresa</label><select class="in" id="lt-e"><option value="">Todas</option>${emp.map(e=>`<option>${esc(e)}</option>`).join('')}</select>
    <label><input type="checkbox" id="lt-n" checked> Pular quem já tem convite em aberto</label>
    <label>Superior imediato de todos do lote</label><select class="in" id="lt-s">${opcoesSuperior(null, null, '— manter o que já está definido em cada pessoa —')}</select>
    <label><input type="checkbox" id="lt-f"> Só quem tem celular cadastrado</label>
    <div class="expl" style="margin-top:10px">Dica: para cada pessoa já ficar ligada ao superior certo, o caminho mais simples é cada líder convidar a própria equipe pelo botão "+ Convidar pessoa" na aba Equipe. Use o lote para quem ficar de fora.</div>
    <p class="sub" id="lt-c" style="margin-top:8px"></p>
    <button class="btn p w" id="lt-ok">Gerar e baixar CSV</button><div id="lt-m"></div>`);
  const alvo = () => sem.filter(p => (!$('lt-e').value || p.empresa===$('lt-e').value) && (!$('lt-n').checked || !p.convite_pendente)
    && (!$('lt-f').checked || foneWa(p.telefone)));
  const conta = () => $('lt-c').textContent = alvo().length + ' pessoa(s) vão receber convite. Os convites valem 30 dias.';
  $('lt-e').onchange = conta; $('lt-n').onchange = conta; $('lt-f').onchange = conta; conta();
  $('lt-ok').onclick = async () => {
    const ids = alvo().map(p=>p.id); if (!ids.length) return msg('lt-m','Ninguém para convidar.');
    busy($('lt-ok'),true);
    try {
      // cada pessoa mantém a função já definida (líder continua líder)
      const porPapel = {};
      for (const p of alvo()) (porPapel[p.papel && p.papel !== 'admin' ? p.papel : 'colaborador'] ||= []).push(p.id);
      let r = [];
      for (const [pap, lista] of Object.entries(porPapel))
        r = r.concat(await rpc('he_convidar', {p_token:S.token, p_pessoas:lista, p_papel:pap, p_superior:$('lt-s').value || null}));
      const tel = id => { const p = (S.pessoas||[]).find(x=>x.id===id); return p && p.telefone || ''; };
      const csv = '﻿' + [['Nome','Celular','Código de acesso','Convite','Link WhatsApp','Mensagem'], ...r.map(x=>[x.nome, tel(x.pessoa_id), x.codigo, x.convite, linkWa(x), textoConvite(x)])]
        .map(l => l.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
      a.download = `convites_horas_i9_${new Date().toISOString().slice(0,10)}.csv`; a.click();
      mostrarConvites(r); S.pessoas = null;
    } catch(e){ msg('lt-m', e.message); busy($('lt-ok'),false); }
  };
}

/* ════ PIN ════ */
$('b-pin').onclick = () => {
  modal(`<div class="md-h"><h2 style="margin:0">Trocar PIN</h2><button class="x-btn" data-close>×</button></div>
    <label>PIN atual</label><input class="in" id="p-a" type="password" inputmode="numeric" maxlength="6">

    <button class="btn p w" id="p-ok">Trocar</button><div id="p-m"></div>`);
  $('p-ok').onclick = async () => {
    try { await rpc('he_trocar_pin', {p_token:S.token, p_pin_atual:$('p-a').value, p_pin_novo:$('p-n').value}); msg('p-m','PIN alterado.',true); }
    catch(e){ msg('p-m', e.message); }
  };
};

/* ════ modal ════ */
function modal(html){
  $('modal').innerHTML = `<div class="ov"><div class="md" role="dialog" aria-modal="true">${html}</div></div>`;
  $('modal').querySelector('.ov').onclick = e => { if (e.target.classList.contains('ov')) fecharModal(); };
  $('modal').querySelectorAll('[data-close]').forEach(b => b.onclick = fecharModal);
}
function fecharModal(){ $('modal').innerHTML = ''; }
function alertar(t){ modal(`<div class="md-h"><h2 style="margin:0">Atenção</h2><button class="x-btn" data-close>×</button></div><div class="msg e">${esc(t)}</div>`); }

/* ════ início ════ */
S.token = store.get('he_token');
if (S.token) iniciar(); else telaLogin();
