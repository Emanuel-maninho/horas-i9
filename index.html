/* ════ ESCALA DE SOBREAVISO ════ */
/* ════ IMPORTAÇÃO DA ESCALA DE SOBREAVISO/PLANTÃO (PDF) ════
   Lê o PDF com pdf.js usando as coordenadas x/y de cada item de texto — o arquivo
   é impresso do Excel e tem texto selecionável, não precisa de OCR.
   Conferido contra os PDFs S44 e S45: mesmo resultado do protótipo em Python,
   zero divergência em tipo, regionais e funções. */
const PDFJS_VER = '3.11.174';
let pdfjsPronto = null;
function carregarPdfJs(){
  if (pdfjsPronto) return pdfjsPronto;
  pdfjsPronto = new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.min.js`;
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.worker.min.js`;
      ok(window.pdfjsLib);
    };
    s.onerror = () => erro(new Error('Não consegui carregar o leitor de PDF. Confira a conexão.'));
    document.head.appendChild(s);
  });
  return pdfjsPronto;
}

const ORDEM_COL = ['EQUIPE','SEG','SAB','DOM','CONTATO'];
const RE_PERIODO = /DE\s+(\d{2}\/\d{2}\/\d{4})\s+A\s+(\d{2}\/\d{2}\/\d{4})/;

function agrupaLinhas(itens, tol = 1.5){
  // top = −y, para que "menor top" signifique "mais acima" (o pdf.js conta do rodapé)
  const ws = itens.filter(i => String(i.t).trim())
                  .map(i => ({t:String(i.t).trim(), x:i.x, top:-i.y}))
                  .sort((a,b) => a.top - b.top || a.x - b.x);
  const out = [];
  for (const w of ws) {
    const u = out[out.length-1];
    if (u && Math.abs(w.top - u.top) <= tol) { u.ws.push(w); u.top = Math.min(u.top, w.top); }
    else out.push({top:w.top, ws:[w]});
  }
  out.forEach(l => { l.ws.sort((a,b) => a.x - b.x); l.txt = l.ws.map(w => w.t).join(' '); });
  return out;
}
function colunasEsc(hdr){
  const anc = {};
  for (const w of hdr.ws) { const t = normNome(w.t);
    if (t.startsWith('EQUIPE') && anc.EQUIPE === undefined) anc.EQUIPE = w.x;
    else if (t.startsWith('SEGUNDA') && anc.SEG === undefined) anc.SEG = w.x;
    else if (t.startsWith('SABADO') && anc.SAB === undefined) anc.SAB = w.x;
    else if (t.startsWith('DOMINGO') && anc.DOM === undefined) anc.DOM = w.x;
    else if (t.startsWith('CONTATO') && anc.CONTATO === undefined) anc.CONTATO = w.x; }
  const txt = normNome(hdr.txt), tp = {};
  for (const [k,rot] of [['SAB','SABADO'],['DOM','DOMINGO']]) {
    const m = txt.match(new RegExp(rot + '\\s*-\\s*(PLANTAO|SOBREAVISO)'));
    tp[k] = m ? m[1] : 'SOBREAVISO';
  }
  return {anc, tp};
}
function qualColuna(x, anc){
  const ks = ORDEM_COL.filter(k => anc[k] !== undefined);
  for (let i = 0; i < ks.length; i++) {
    const lo = i === 0 ? -1e9 : (anc[ks[i-1]] + anc[ks[i]]) / 2;
    const hi = i === ks.length-1 ? 1e9 : (anc[ks[i]] + anc[ks[i+1]]) / 2;
    if (x >= lo && x < hi) return ks[i];
  }
  return null;
}
function limpaCelula(parts){
  let txt = (parts || []).join(' ').trim();
  const marc = /\(\s*SOBREAVISO\s*\)/i.test(txt);
  txt = txt.replace(/\(\s*SOBREAVISO\s*\)/ig, ' ');
  return {nome: normNome(txt.split(/\s+/).filter(t => t && t !== '-').join(' ')), marc};
}

function parseEscala(paginas){
  const erros = []; let periodo = null; const blocos = [];
  for (const pg of paginas) {
    const ls = agrupaLinhas(pg.itens);
    for (const l of ls) { const m = normNome(l.txt).match(RE_PERIODO); if (m && !periodo) periodo = [m[1], m[2]]; }
    const hidx = ls.map((l,i) => ({l,i}))
      .filter(({l}) => normNome(l.txt).includes('EQUIPE') && normNome(l.txt).includes('CONTATO'))
      .map(({i}) => i);
    const titulo = i => {
      for (let j = i-1; j >= 0; j--) { const t = normNome(ls[j].txt);
        if (RE_PERIODO.test(t) || t.includes('ESCALA DE SOBREAVISO')) break;
        if (t) return {j, nome:t}; }
      return {j:null, nome:null};
    };
    hidx.forEach((i,n) => {
      const {nome:regional} = titulo(i);
      let fim = ls.length;
      if (n+1 < hidx.length) { const t = titulo(hidx[n+1]); fim = t.j !== null ? t.j : hidx[n+1]; }
      blocos.push({regional, hdr:ls[i], corpo:ls.slice(i+1, fim)});
    });
  }
  if (!periodo) return {erros:['Não achei o período no cabeçalho ("DE dd/mm/aaaa A dd/mm/aaaa"). Confira se é o PDF certo.']};
  const [di, df] = periodo;
  const pd = s => new Date(+s.slice(6,10), +s.slice(3,5)-1, +s.slice(0,2));
  const ini = pd(di), fim = pd(df);
  const nd = Math.round((fim - ini) / 86400000) + 1;
  if (nd !== 7) erros.push(`O período do cabeçalho (${di} a ${df}) tem ${nd} dias, não 7.`);
  if (ini.getDay() !== 1) erros.push(`O período começa em ${di}, que não é uma segunda-feira.`);
  if (fim.getDay() !== 0) erros.push(`O período termina em ${df}, que não é um domingo.`);

  const saida = [];
  for (const b of blocos) {
    const {anc, tp} = colunasEsc(b.hdr);
    const rows = [], labels = [];
    for (const l of b.corpo) {
      const cels = {};
      for (const w of l.ws) { const k = qualColuna(w.x, anc); if (k) (cels[k] = cels[k] || []).push(w.t); }
      if (cels.EQUIPE) labels.push({top:l.top, nome:normNome(cels.EQUIPE.join(' '))});
      if (cels.SEG || cels.SAB || cels.DOM) rows.push({top:l.top, cels});
    }
    const limpos = [];
    for (const r of rows) {
      const cel = {};
      for (const k of ['SEG','SAB','DOM']) cel[k] = limpaCelula(r.cels[k]);
      if (!cel.SEG.nome && !cel.SAB.nome && !cel.DOM.nome) {   // linha só com o marcador
        const u = limpos[limpos.length-1];
        if (u) for (const k of ['SEG','SAB','DOM']) if (cel[k].marc) u.cel[k].marc = true;
        continue;
      }
      limpos.push({top:r.top, cel});
    }
    for (const r of limpos) {           // a função vem da célula mesclada de EQUIPE
      r.func = '';
      for (let i = 0; i < labels.length; i++) {
        const lo = i === 0 ? -1e9 : (labels[i-1].top + labels[i].top) / 2;
        const hi = i === labels.length-1 ? 1e9 : (labels[i].top + labels[i+1].top) / 2;
        if (r.top >= lo && r.top < hi) { r.func = labels[i].nome; break; }
      }
    }
    saida.push({regional:b.regional, tipos:tp, linhas:limpos});
  }

  const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const por = new Map();
  for (const r of saida) for (const l of r.linhas) {
    for (const [k, offs] of [['SEG',[0,1,2,3,4]], ['SAB',[5]], ['DOM',[6]]]) {
      const {nome, marc} = l.cel[k];
      if (!nome) continue;
      let tipo = k === 'SEG' ? 'SOBREAVISO' : r.tipos[k];
      if (marc) tipo = 'SOBREAVISO';                 // "(SOBREAVISO)" vence o cabeçalho
      for (const o of offs) {
        const dt = new Date(ini.getTime()); dt.setDate(dt.getDate() + o);
        const ch = nome + '|' + iso(dt);
        const it = por.get(ch) || {nome, data:iso(dt), tipos:new Set(), regionais:new Set(), funcoes:new Set()};
        it.tipos.add(tipo);
        if (r.regional) it.regionais.add(r.regional);
        if (l.func) it.funcoes.add(l.func);
        por.set(ch, it);
      }
    }
  }
  const registros = [...por.values()].map(it => ({
    nome: it.nome, data: it.data,
    tipo: it.tipos.has('PLANTAO') ? 'PLANTAO' : 'SOBREAVISO',   // PLANTÃO vence no conflito
    conflito: it.tipos.size > 1,
    regionais: [...it.regionais].sort(), funcoes: [...it.funcoes].sort(),
  })).sort((a,b) => a.data.localeCompare(b.data) || a.nome.localeCompare(b.nome));
  return {ini:iso(ini), fim:iso(fim), blocos:saida, registros, erros};
}

/* candidatos parecidos, por sobreposição de palavras do nome */
function parecidos(nome, lista){
  const A = new Set(normNome(nome).split(' ').filter(p => p.length > 2));
  return lista.map(p => {
    const B = new Set(normNome(p.nome).split(' ').filter(x => x.length > 2));
    let c = 0; A.forEach(x => { if (B.has(x)) c++; });
    return {p, s: c / Math.max(1, Math.max(A.size, B.size))};
  }).filter(x => x.s >= 0.5).sort((a,b) => b.s - a.s).slice(0, 5).map(x => x.p);
}

async function importarEscala(arquivo){
  modal(`<div class="md-h"><h2 style="margin:0">Importar escala</h2><button class="x-btn" data-close>×</button></div>
         <div class="loading">Lendo o PDF…</div>`);
  let R, nomes;
  try {
    const [pdfjsLib, lista] = await Promise.all([carregarPdfJs(), rpc('he_nomes', {p_token:S.token})]);
    nomes = lista || [];
    const buf = await arquivo.arrayBuffer();
    const doc = await pdfjsLib.getDocument({data: new Uint8Array(buf)}).promise;
    const paginas = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const tc = await (await doc.getPage(p)).getTextContent();
      paginas.push({itens: tc.items.map(i => ({t:i.str, x:i.transform[4], y:i.transform[5]}))});
    }
    R = parseEscala(paginas);
  } catch(e){ return alertar('Não consegui ler o PDF: ' + e.message); }

  if (!R.registros) return alertar(R.erros.join(' '));

  const porNome = new Map(nomes.map(p => [normNome(p.nome), p]));
  const pessoas = [...new Set(R.registros.map(r => r.nome))].sort().map(n => {
    const achou = porNome.get(n);
    return {nome:n, id: achou?.id || null, achou: achou?.nome || null, sug: achou ? [] : parecidos(n, nomes)};
  });
  S.escala = {R, pessoas, arquivo: arquivo.name, nomes};
  telaEscala();
}

function telaEscala(){

    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; });
  const mapa = new Map(R.registros.map(r => [r.nome + '|' + r.data, r]));
  const conflitos = R.registros.filter(r => r.conflito);
  const fmt = d => d.slice(8,10) + '/' + d.slice(5,7);

           <option value="">— pular —</option>
           ${p.sug.map(s => `<option value="${s.id}">${esc(s.nome)} (parecido)</option>`).join('')}
           ${p.sug.length ? '<option disabled>──── todos os cadastrados ────</option>' : ''}

    ${conflitos.length ? `<div class="msg e" style="background:#fff8e1;color:#7a5900;border-color:#f0b429">

       Vou gravar como <b>PLANTÃO</b>. Confira:
       ${conflitos.map(c => `<div>• ${fmt(c.data)} — ${esc(c.nome)} (${c.regionais.map(esc).join(' + ')})</div>`).join('')}</div>` : ''}
    <div class="sa-wrap"><table class="sa-t">
      <thead><tr><th class="nm">Pessoa</th>${dias.map(d =>
        `<th>${fmt(d)}<br>${DIA[new Date(d+'T00:00:00').getDay()][0].toUpperCase()}</th>`).join('')}</tr></thead>
      <tbody>${pessoas.map(p => `<tr${p.id ? '' : ' style="background:#ffebee"'}>

          ${p.achou && p.achou !== p.nome ? `<div class="sub">casou com ${esc(p.achou)}</div>` : ''}</td>

/* ════ FECHAMENTO RH ════ */
const fatores = () => ({he50:fat50(), he75:1.75, he100:2.0});
const ORDENS = {
  '50_primeiro': ['he50','he75','he100'],
  '100_primeiro': ['he100','he75','he50']
};
// Divide o saldo não compensado nas rubricas, conforme a ordem de abatimento.
function rubricas(r, ordem){
  const FAT = fatores();
  const out = {he50:r.he50, he75:r.he75, he100:r.he100};
  let resto = r.compensado;               // em minutos de hora normal
  if (ordem === 'proporcional') {
    const k = r.normalizado ? 1 - r.compensado / r.normalizado : 0;
    for (const f in out) out[f] = Math.round(out[f] * k);
    return out;
  }
  for (const f of ORDENS[ordem]) {
    const cap = out[f] * FAT[f], uso = Math.min(resto, cap);
    out[f] = Math.round(out[f] - uso / FAT[f]); resto -= uso;
  }
  return out;
}
function vRH(){
  const base = S.resumo.filter(r => r.normalizado > 0 || r.hn > 0 || r.noturna > 0 || r.sa_min > 0);
  const rows = filtrar(base);
  const calc = rows.map(r => {
    const p = rubricas(r, S.ordem), hb = r.hora_base, hbsa = r.hora_base_sa;
    const not = (r.noturna + r.hn), notR = notRef(not);   /* notR: hora noturna reduzida, art. 73, §1 */
    /* duas bases, como a folha: HE/noturno pela hora_base (com periculosidade),
       sobreaviso pela hora_base_sa (salário/220, sem periculosidade — Súmula 132, II do TST).
       O noturno incide sobre a REFERÊNCIA (52min30 = 1h), não sobre a hora do ponto. */
    const val = hb ? {
      he50: p.he50/60*hb*fat50(), he75: p.he75/60*hb*1.75, he100: p.he100/60*hb*2.0, not: notR/60*hb*0.2,
      sa: (r.sa_min||0)/60*(hbsa||0)/3
    } : null;
    /* _24: horas dos dias em que o líder NÃO autorizou a HE. Elas continuam
       somadas acima de propósito — o painel espelha o ponto e a negativa é
       documento, não desconto automático. Isto aqui é só o aviso para o DP
       conferir contra a folha: valor bruto pelos fatores, sem abater compensação. */
    const negMin = (r.neg_he50||0) + (r.neg_he75||0) + (r.neg_he100||0);
    const negR = hb ? (r.neg_he50||0)/60*hb*fat50() + (r.neg_he75||0)/60*hb*1.75 + (r.neg_he100||0)/60*hb*2.0 : null;
    return {...r, p, not, notR, val, negMin, negR, total: val ? val.he50+val.he75+val.he100+val.not+val.sa : null};
  });
  const sum = (f) => calc.reduce((s,c)=>s+(f(c)||0),0);
  const semHB = calc.filter(c => !c.hora_base).length;
  const semSA = calc.filter(c => c.sa_min && c.hora_base && !c.hora_base_sa).length;
  const op = (k,t,d) => `<label class="opt ${S.ordem===k?'on':''}"><input type="radio" name="ord" value="${k}" ${S.ordem===k?'checked':''}><div><b>${t}</b><span>${d}</span></div></label>`;
  const linhaRH = c => `<tr class="click" data-r="${calc.indexOf(c)}">
          <td class="l">${esc(c.nome)}<div class="sub">${esc(c.cargo||c.empresa||'')}</div></td>
          <td data-l="HE ${pct50()}">${hm(c.he50)}</td><td data-l="HE 75%">${hm(c.he75)}</td><td data-l="HE 100%">${hm(c.he100)}</td><td data-l="Gerado">${hm(c.normalizado)}${c.acion_min?`<div class="sub">acion. ${hm(c.acion_min)}</div>`:''}</td><td data-l="Compensado" class="minus">${hm(c.compensado)}</td>
          <td data-l="Pagar ${pct50()}"><b>${hm(c.p.he50)}</b></td><td data-l="Pagar 75%"><b>${hm(c.p.he75)}</b></td><td data-l="Pagar 100%"><b>${hm(c.p.he100)}</b></td><td data-l="Noturno">${hm(c.not)}${c.not?`<div class="sub">ref. ${hm(c.notR)}</div>`:''}</td><td data-l="Sobreaviso">${c.sa_min?hm(c.sa_min):'—'}</td>
          <td data-l="Total"><b>${c.total!=null?brl(c.total):'—'}</b><div class="sub">${c.hora_base?'hora '+brl(+c.hora_base):'<span class="tag t-wait">cadastrar hora base</span>'}${c.sa_min&&c.hora_base?(c.hora_base_sa?'<br>sobreaviso '+brl(+c.hora_base_sa):'<br><span class="tag t-wait">hora base do sobreaviso</span>'):''}</div></td></tr>`;
  const corpoRH = usaFiltro()
    ? porSetor(calc).map(([k,cs]) => cabGrupo('rh:'+k, 12, k, `${cs.length} pessoas · saldo ${hm(cs.reduce((s,c)=>s+c.saldo,0))} · ${brl(cs.reduce((s,c)=>s+(c.total||0),0))}`) + cs.map(c => linhaDoGrupo('rh:'+k, linhaRH(c))).join('')).join('')
    : calc.map(linhaRH).join('');
  $('main').innerHTML = `
    ${barraFiltro(base)}
    <div class="card"><h2>Ordem de abatimento das compensações</h2>
      <div class="expl">Quando a pessoa compensa parte das horas, é preciso definir quais faixas de HE foram quitadas primeiro.
        <b>O valor total pago é o mesmo em qualquer opção</b>, porque cada faixa carrega o próprio fator (${pct50()} = ${fmtF(fat50())} · 75% = 1,75 · 100% = 2,0).
        O que muda é como as horas aparecem nas rubricas do holerite. Confirme com a contabilidade se alguma regra da convenção depende da <i>quantidade</i> de horas por faixa.</div>
      ${op('50_primeiro',`Abater primeiro as de ${pct50()} (padrão)`,`Favorece o colaborador na leitura do holerite: sobram as faixas mais altas. Pode aparecer HE a 100% sem nenhuma a ${pct50()}.`)}
      ${op('100_primeiro','Abater primeiro as de 100%',`Sobram as faixas mais baixas. Holerite mais "natural" (quem tem 100% também tem ${pct50()}).`)}
      ${op('proporcional','Abater proporcionalmente','Cada faixa é reduzida na mesma proporção. Mantém a composição original do mês.')}
      <div id="o-m"></div>
    </div>
    <div class="kpis">
      <div class="st"><div class="l">Pessoas com HE / noturno</div><div class="v">${calc.length}</div></div>
      <div class="st"><div class="l">Folga gerada (com fator)</div><div class="v">${hm(sum(c=>c.normalizado))}</div></div>
      <div class="st"><div class="l">Compensado</div><div class="v minus">${hm(sum(c=>c.compensado))}</div></div>
      <div class="st"><div class="l">Saldo a pagar (h normais)</div><div class="v plus">${hm(sum(c=>c.saldo))}</div></div>
      <div class="st"><div class="l">Total a pagar</div><div class="v">${brl(sum(c=>c.total))}</div><div class="l">${semHB?semHB+' sem hora base cadastrada':semSA?semSA+' sem hora base do sobreaviso':'HE + adicional noturno + sobreaviso'}</div></div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <h2 style="margin:0">Fechamento de ${new Date(S.mes+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}${usaFiltro()&&S.f.g!=='TODOS'?' · '+S.f.g+(S.f.g==='I9 MATRIZ'&&S.f.eng?' · Engenharia':''):''}</h2>
      <button class="btn s" id="b-csv">Exportar CSV</button></div>
      ${botoesGrupo('gr')}
      <div class="tw"><table class="resp cmp">
        <thead><tr><th class="l">Nome</th><th>HE ${pct50()}</th><th>HE 75%</th><th>HE 100%</th><th>Folga gerada</th><th>Compen&shy;sado</th>
          <th>Pagar ${pct50()}</th><th>Pagar 75%</th><th>Pagar 100%</th><th>Noturno</th><th>Sobre&shy;aviso</th><th>Total R$</th></tr></thead>
        <tbody>${corpoRH}</tbody>
        <tfoot><tr><td class="l">Total</td><td>${hm(sum(c=>c.he50))}</td><td>${hm(sum(c=>c.he75))}</td><td>${hm(sum(c=>c.he100))}</td>
          <td>${hm(sum(c=>c.normalizado))}</td><td>${hm(sum(c=>c.compensado))}</td>
          <td>${hm(sum(c=>c.p.he50))}</td><td>${hm(sum(c=>c.p.he75))}</td><td>${hm(sum(c=>c.p.he100))}</td><td>${hm(sum(c=>c.not))}<div class="sub">ref. ${hm(sum(c=>c.notR))}</div></td><td>${hm(sum(c=>c.sa_min||0))}</td>

      ${calc.some(c=>c.negMin)?`<div class="note" style="background:#FBE4E4;color:#8A1C1C;margin-top:10px">

        <b>já incluído nos totais acima</b>, porque o painel espelha o ponto e a negativa do líder é documento, não desconto automático.

        <div style="margin-top:6px">${calc.filter(c=>c.negMin).map(c=>`${esc(c.nome)} <b>${hm(c.negMin)}</b>`).join(' · ')}</div></div>`:''}
      <p class="sub" style="margin-top:8px">Clique em uma pessoa para ver os dias e imprimir o relatório individual.

      'Sobreaviso (h)','Hora base','Hora base sobreaviso','Valor HE50','Valor HE75','Valor HE100','Adic. noturno','Valor sobreaviso (1/3)','Total',
      'Dias com HE não autorizada','HE não autorizada (h)','HE não autorizada (R$)'];
    const n = v => (v/60).toFixed(2).replace('.',','), r2 = v => v==null?'':v.toFixed(2).replace('.',',');
    const L = calc.map(c => [c.nome, c.empresa||'', grupo(c.empresa), c.setor||'', n(c.he50), n(c.he75), n(c.he100), n(c.normalizado), n(c.compensado),
      n(c.p.he50), n(c.p.he75), n(c.p.he100), n(c.not), n(c.notR), n(c.acion_he50||0), n(c.acion_he75||0), n(c.acion_he100||0), n(c.acion_not||0),
      n(c.sa_min||0), c.hora_base?r2(+c.hora_base):'', c.hora_base_sa?r2(+c.hora_base_sa):'',
      r2(c.val?.he50), r2(c.val?.he75), r2(c.val?.he100), r2(c.val?.not), r2(c.val?.sa), r2(c.total),
      c.dias_negados||0, n(c.negMin||0), r2(c.negR)]);
    const csv = '﻿' + [h, ...L].map(l => l.map(x => `"${String(x).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const suf = usaFiltro() && S.f.g !== 'TODOS' ? '_' + S.f.g.replace(/\s/g,'') + (S.f.g==='I9 MATRIZ'&&S.f.eng?'_ENG':'') : '';
    a.download = `fechamento_he_${S.mes}${suf}_${S.ordem}.csv`; a.click();
  };
}

/* ════ PENDÊNCIAS DE PONTO (etapa B) ════
   O log vive em he_alerta_ponto, alimentado pela rotina diária depois do sync.
   Aqui é só a leitura: pendências abertas do time + histórico com filtros. */
const TIPO_PEND = {
  SEM_ENTRADA:             {rot:'Sem entrada',            ex:'Tem jornada prevista e nenhuma batida, mas há observação no Quark.'},
  BATIDA_INCOMPLETA:       {rot:'Batida incompleta',      ex:'Falta o par de alguma batida, ou há menos batidas do que a jornada pede.'},
  FALTA_SEM_JUSTIFICATIVA: {rot:'Falta sem justificativa', ex:'Jornada prevista, nenhuma batida e nenhuma observação ou abono.'},
  HE_NAO_AUTORIZADA:       {rot:'HE não autorizada',      ex:'O Quark apurou hora extra e ninguém decidiu nada aqui — nem autorizou, nem não autorizou.'},
};
const ST_PEND = {ABERTO:'em aberto', RESOLVIDO:'resolvida', EXPIRADO:'expirada'};

/* ════════════════════════════════════════════════════════════════════════
   AUDITORIA DE PONTO — fotos e locais da primeira e da última batida
   ────────────────────────────────────────────────────────────────────────
   Só entram ENTRADA e SAÍDA. O almoço fica de fora porque varia de verdade
   e encheria a fila de alarme falso.

   O robô (auditar_fotos.py) mede TAMANHO E POSIÇÃO DO ROSTO (detector YuNet)
   e LUZ da imagem. A nota serve para ORDENAR a fila — quem decide é quem está
   olhando. Por isso nenhum status muda sozinho e todo cartão tem os dois botões.

   TRAVA QUE NÃO SE MEXE: se o detector não achar rosto, a foto NÃO é acusada
   por isso. Detector de rosto erra mais em pele escura, e o fim desta fila é
   uma advertência — então a falha dele tem que cair sempre do lado de não
   apontar ninguém. Ver a migração _17.

   O QUE ISSO CUSTOU, E COMO FICOU (22/11/2026): sem rosto detectado, foto de
   tela/mesa passava batido. Em 2.367 fotos o detector falhou em 14 — mas só 4
   eram mesmo sem pessoa; as outras 10 tinham gente, contra a luz ou no escuro.
   Marcar "sem pessoa" pela falha do detector erraria 71% das vezes, sempre no
   mesmo tipo de foto. Então o robô só diz CONFERIR_PESSOA ("não achei rosto,
   olhe isto"), que entra na fila e NÃO é impresso no relatório. Quem afirma o
   desvio é quem revisa, e isso vai para motivos_rev. Ver a migração _18.

   Marcar NOTIFICADO faz a imagem parar de expirar em 30 dias: vira prova do
   processo. É o único jeito de guardar a foto além desse prazo.
   ════════════════════════════════════════════════════════════════════════ */
const MOTIVO = {
  ROSTO_COLADO:    ['Rosto ocupando o quadro', 'O rosto toma 40% ou mais da foto: não dá para ver onde a pessoa está.'],
  ROSTO_CORTADO:   ['Rosto cortado',           'O rosto sai pela borda de baixo — falta o queixo.'],
  FUNDO_ESCURO:    ['Fundo escuro',            'Foto à noite: o rosto até aparece, mas o ambiente atrás some.'],
  ESCURA:          ['Escura',                  'Luz baixa demais para identificar pessoa ou local.'],
  ESTOURADA:       ['Estourada',               'Luz alta demais, a imagem perdeu o desenho.'],
  BORRADA:         ['Borrada',                 'Sem foco: movimento ou lente suja.'],
  BAIXO_CONTRASTE: ['Sem contraste',           'Imagem quase chapada, pouco detalhe.'],
  SEM_IMAGEM:      ['Foto não abriu',          'A batida existe, mas o Quark não devolveu a imagem.'],
  /* aviso da máquina, nunca acusação — por isso fica fora do relatório (REL_OCULTA) */
  CONFERIR_PESSOA: ['Conferir se tem pessoa',   'O detector não achou rosto aqui. Pode ser foto de tela, mesa ou chão — mas também pode ser alguém contra a luz: em 14 fotos assim, 10 tinham pessoa. Olhe a imagem e decida.'],
  /* afirmado por quem revisa, olhando a foto. Este SAI no relatório. */
  SEM_PESSOA:      ['Sem pessoa na imagem',     'Quem revisou olhou a foto e afirmou que não há pessoa nela.'],
};
/* Motivos da máquina que NÃO são impressos no relatório do RH: são pedidos de
   conferência, não conclusões. Imprimir um palpite num anexo de advertência é
   o erro que a migração _18 existe para evitar. */
const REL_OCULTA = new Set(['CONFERIR_PESSOA']);
/* Junta o que a máquina mediu (menos os palpites) com o que a pessoa afirmou. */
const motivosDe = (i, pdf) => [
  ...(i.motivos || []).filter(m => !(pdf && REL_OCULTA.has(m))),
  ...(i.motivos_rev || []),
];
/* O LOCAL DA BATIDA, e quando nao ha, a razao — nunca em branco.
   Medido em 23/11/2026 nas 2.367 fotos: 2.109 (89%) tem endereco. Das 258 que
   nao tem, 229 nao possuem linha de local naquela hora e 29 possuem a linha com
   o campo vazio no proprio Quark. Nessas 29 nao ha nada melhor a mostrar:
   localidade, estado e cerca tambem vem NULL — conferido, zero fotos ganhariam
   ao menos cidade/UF. Campo em branco num anexo de advertencia parece falha de
   coleta; dizer qual dos dois casos e' o que se sabe de fato. */
const localDe = i => i.endereco ? {txt: i.endereco, falta: false}
  : i.tem_local ? {txt: 'o Quark registrou a batida sem endereço', falta: true}
                : {txt: 'sem registro de local para esta batida', falta: true};
const isoD = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const brD  = s => !s ? '' : String(s).slice(8, 10) + '/' + String(s).slice(5, 7);
const hhmm = s => !s ? '' : String(s).slice(0, 5);

async function vAuditoria(){
  const hoje = new Date(), sete = new Date(hoje.getTime() - 6 * 864e5);
  const f = S.aud_f = S.aud_f || {de: isoD(sete), ate: isoD(hoje), status: 'PENDENTE',
                                  so: true, pessoa: ''};

  /* A lista de nomes é buscada uma vez por sessão e guardada: ela não muda
     durante a revisão e são ~250 linhas. */
  const [lista, r, nomes] = await Promise.all([
    rpc('he_fotos', {p_token: S.token, p_de: f.de || null, p_ate: f.ate || null,
                     p_status: f.status, p_so_sinal: f.so,
                     p_pessoa: f.pessoa || null, p_limite: 60}),
    rpc('he_fotos_resumo', {p_token: S.token, p_de: f.de || null, p_ate: f.ate || null}),
    S.aud_nomes ? Promise.resolve(S.aud_nomes) : rpc('he_nomes', {p_token: S.token}),
  ]);
  S.aud_nomes = nomes || [];
  const its = lista || [];
  /* guardados por id para o diálogo de notificação: a observação para
     pré-preencher na edição, e os motivos para saber se ela é obrigatória. */
  S.aud_obs = {}; S.aud_mot = {}; S.aud_rev = {};
  its.forEach(i => { S.aud_obs[i.id] = i.observacao || '';
                     S.aud_mot[i.id] = i.motivos || [];
                     S.aud_rev[i.id] = i.motivos_rev || []; });
  const st = (rot, v, pe) => `<div class="st"><div class="l">${rot}</div><div class="v">${v}</div>` +
                             (pe ? `<div class="l">${pe}</div>` : '') + `</div>`;
  const sel = (id, val, ops) => `<select class="in aud-f" id="${id}">${ops.map(([v, r2]) =>
    `<option value="${v}"${String(val) === String(v) ? ' selected' : ''}>${esc(r2)}</option>`).join('')}</select>`;

  $('main').innerHTML = `
    <div class="card">
      <h2>Auditoria de ponto — foto e local da batida</h2>
      <div class="expl">Entra a <b>primeira e a última batida</b> de cada dia; o almoço fica de fora porque
        varia de verdade. A sinalização olha <b>o tamanho e a posição do rosto</b> e <b>a luz do fundo</b>:
        rosto ocupando o quadro, rosto cortado na borda, foto noturna sem ambiente, escura ou borrada.
        Parede lisa atrás <b>não</b> é motivo. Quando o detector não acha rosto ele <b>não acusa</b>:
        só pede <i>conferir se tem pessoa</i>, porque foto contra a luz também engana o detector.
        Quem decide é você. Marcar <b>Notificar</b> guarda a imagem como prova e tira ela do
        apagamento de 30 dias. Para montar um <b>dossiê de uma pessoa só</b>, escolha o nome no
        filtro e gere o relatório.</div>
      <div class="sa-bar">
        ${sel('a-st', f.status, [['PENDENTE','Para revisar'],['OK','Revisadas e liberadas'],
                                 ['NOTIFICADO','Notificadas ao RH'],['TODOS','Todas']])}
        <span style="font-size:13px">de</span><input class="in aud-f" type="date" id="a-de" value="${f.de}">
        <span style="font-size:13px">até</span><input class="in aud-f" type="date" id="a-ate" value="${f.ate}">
        <label style="display:flex;gap:6px;align-items:center;font-size:13px">
          <input type="checkbox" class="aud-f" id="a-so"${f.so ? ' checked' : ''}> só as sinalizadas</label>
        ${sel('a-pes', f.pessoa, [['', 'Todos os colaboradores'],
              ...S.aud_nomes.map(n => [n.id, n.nome])])}
        <button class="btn s" id="a-rel">${f.pessoa
          ? 'Dossiê de ' + esc((S.aud_nomes.find(n => n.id === f.pessoa) || {}).nome || '')
          : 'Relatório de suspeita de desvios'}</button>
      </div>
      <div class="kpis">
        ${st('Batidas no período', r.total, (r.de ? brD(r.de) : '') + ' a ' + (r.ate ? brD(r.ate) : ''))}
        ${st('Sinalizadas', r.sinalizadas, r.total ? Math.round(100 * r.sinalizadas / r.total) + '% das batidas' : '')}
        ${st('Esperando revisão', r.pendentes, r.pendentes ? 'olhar e decidir' : 'nada na fila')}
        ${st('Notificadas ao RH', r.notificadas, 'imagem guardada como prova')}
      </div>
    </div>

    ${!its.length ? `<div class="card"><div class="msg o">Nada para mostrar com esses filtros.</div></div>` : `
    <div class="card">
      <div class="sub">${its.length} foto${its.length > 1 ? 's' : ''}${its.length === 60
        ? ' — as 60 de maior nota; estreite o período para ver o resto' : ''}</div>
      ${!f.so ? `<div class="note" style="background:#FFF4E0;color:#7A4B00;margin-top:8px">
        Mostrando <b>todas as batidas</b> do período, inclusive as que o robô
        <b>não</b> apontou — por isso aparece foto boa aqui. Marque
        <b>“só as sinalizadas”</b> para voltar a ver apenas a fila de revisão.</div>` : ''}
      <div class="fgrid" style="margin-top:12px">${its.map(fotoCard).join('')}</div>
    </div>`}
    <div id="a-msg"></div>`;

  document.querySelectorAll('.aud-f').forEach(el => el.onchange = () => {
    S.aud_f = {de: $('a-de').value, ate: $('a-ate').value,
               status: $('a-st').value, so: $('a-so').checked,
               pessoa: $('a-pes').value};
    carregar();
  });
  /* A janela PRECISA abrir dentro do gesto do clique. Abrir depois do await
     da RPC faz o Chrome tratar como pop-up e bloquear — testado, bloqueia. */
  $('a-rel').onclick = () => relatorioDesvios(S.aud_f, window.open('', '_blank'));
  ligarCartoes();
}

function fotoCard(i){
  const cls = i.status === 'OK' ? ' rev-ok' : i.status === 'NOTIFICADO' ? ' rev-not' : '';
  const img = i.thumb64
    ? `<img class="fthumb" src="data:image/jpeg;base64,${i.thumb64}" alt="${esc(i.nome)} — ${i.momento === 'ENTRADA' ? 'entrada' : 'saída'} de ${brD(i.data)} às ${hhmm(i.hora)}" data-id="${i.id}">`
    : `<div class="fthumb vazia">o Quark não devolveu a imagem</div>`;
  const loc = localDe(i);
  return `<div class="fcard${cls}" id="fc-${i.id}">
    ${img}
    <div class="fmeta">
      <b>${esc(i.nome)}</b>
      <div class="q">${brD(i.data)} · ${i.momento === 'ENTRADA' ? 'entrada' : 'saída'} ${hhmm(i.hora)}${i.setor ? ' · ' + esc(i.setor) : ''}</div>
      <div class="q${loc.falta ? ' sloc' : ''}" title="${esc(loc.txt)}">${
        esc(loc.txt.slice(0, 46))}${loc.txt.length > 46 ? '…' : ''}</div>
      <div class="fmot">${motivosDe(i).map(m => {
        const [rot, q] = MOTIVO[m] || [m, ''];
        /* o palpite da máquina é cinza; desvio medido ou afirmado é vermelho */
        const cls = REL_OCULTA.has(m) ? 't-gray' : 't-no';
        return `<span class="tag ${cls}" title="${esc(q)}">${esc(rot)}</span>`; }).join('')}</div>
      <div class="fobs">${i.observacao ? '<i>' + esc(i.observacao) + '</i>' : ''}</div>
      ${i.ja_notificado > 0 && i.status !== 'NOTIFICADO'
        ? `<div class="q" style="margin-top:5px"><b>já tem ${i.ja_notificado} notificação${i.ja_notificado > 1 ? 'ões' : ''}</b></div>` : ''}
      ${i.status !== 'PENDENTE'
        ? `<div class="q" style="margin-top:5px">${i.status === 'OK' ? 'liberada' : 'notificada'} por ${esc(i.revisado_por || '—')}</div>` : ''}
    </div>
    <div class="fa">${audBotoes(i.id, i.status)}</div>
  </div>`;
}

const audBotoes = (id, st) => st === 'PENDENTE'
  ? `<button class="btn sec" data-mk="OK" data-id="${id}">Está boa</button>
     <button class="btn" data-mk="NOTIFICADO" data-id="${id}">Notificar</button>`
  : st === 'NOTIFICADO'
  ? `<button class="btn sec" data-mk="NOTIFICADO" data-id="${id}">Editar observação</button>
     <button class="btn sec" data-mk="PENDENTE" data-id="${id}">Voltar para a fila</button>`
  : `<button class="btn sec" data-mk="PENDENTE" data-id="${id}">Voltar para a fila</button>`;

/* ────────────────────────────────────────────────────────────────────────
   A observação é o que o RH lê. No relatório ela aparece na coluna "O que
   foi observado", embaixo dos motivos automáticos.

   Ela é OBRIGATÓRIA quando o robô não apontou nada: nesse caso quem decidiu
   foi a pessoa, e uma linha de processo disciplinar sem motivo escrito não
   se sustenta se o colaborador contestar. Quando já há motivo automático a
   observação é opcional — serve para completar o que a máquina não vê
   ("bateu o ponto dentro do carro", "não é o local do contrato").
   ──────────────────────────────────────────────────────────────────────── */
function pedirObs(id, temMotivo){
  const atual = (S.aud_obs && S.aud_obs[id]) || '';
  const aviso = atual ? '' :
    '\nA imagem deixa de ser apagada em 30 dias e passa a ficar guardada como prova.\n';
  const exige = temMotivo ? '(opcional)' : '(obrigatória: o robô não apontou nada nesta foto)';
  const t = prompt('O que foi observado nesta batida? ' + exige + '\n' + aviso +
                   '\nEsse texto vai no relatório que o RH anexa ao processo.', atual);
  if (t === null) return null;                     // cancelou
  const txt = t.trim();
  if (!txt && !temMotivo) {
    alert('Sem motivo automático, a observação é obrigatória — senão o relatório\n' +
          'sai com a linha em branco justamente onde precisa do porquê.');
    return pedirObs(id, temMotivo);
  }
  return txt;
}

/* A pergunta "esta foto não mostra pessoa?" só aparece onde ela faz sentido:
   quando o robô avisou CONFERIR_PESSOA (não achou rosto), ou quando já havia
   sido marcada assim antes. São 12 fotos em 2.367 — perguntar isso em toda
   notificação seria um clique a mais em 100% dos casos para resolver 0,5%.
   Nas demais, a observação escrita dá conta. */
function pedirSemPessoa(id){
  const mot = (S.aud_mot && S.aud_mot[id]) || [];
  const jaTem = ((S.aud_rev && S.aud_rev[id]) || []).includes('SEM_PESSOA');
  if (!mot.includes('CONFERIR_PESSOA') && !jaTem) return null;   // null = não mexe
  return confirm('Esta foto NÃO mostra a pessoa (é tela, mesa, chão, objeto)?\n\n' +
                 'OK  = sim, registrar "Sem pessoa na imagem" no relatório\n' +
                 'Cancelar = tem gente na foto (contra a luz, escura, de longe)')
    ? ['SEM_PESSOA'] : [];
}

function ligarCartoes(){
  document.querySelectorAll('.fthumb[data-id]').forEach(el => el.onclick = () => lupa(el));
  document.querySelectorAll('[data-mk]').forEach(b => b.onclick = async () => {
    const id = +b.dataset.id, st = b.dataset.mk;
    let obs, rev;
    if (st === 'NOTIFICADO') {
      rev = pedirSemPessoa(id);
      obs = pedirObs(id, !!(S.aud_mot && (S.aud_mot[id] || []).length) ||
                         !!(rev && rev.length));
      if (obs === null) return;
    }
    busy(b, true);
    try {
      const p = {p_token: S.token, p_id: id, p_status: st};
      if (st === 'NOTIFICADO') { p.p_obs = obs; if (rev) p.p_motivos_rev = rev; }
      const r = await rpc('he_foto_marcar', p);
      if (st === 'NOTIFICADO') {
        S.aud_obs = S.aud_obs || {}; S.aud_obs[id] = obs;
        if (rev) { S.aud_rev = S.aud_rev || {}; S.aud_rev[id] = rev; }
      }
      msg('a-msg', (st === 'OK' ? 'Liberada.' : st === 'NOTIFICADO'
            ? 'Notificada — a imagem fica guardada e não expira.' : 'De volta para a fila.')
          + ' Por ' + r.revisado_por + '.', true);
      const c = $('fc-' + id);
      c.className = 'fcard' + (st === 'OK' ? ' rev-ok' : st === 'NOTIFICADO' ? ' rev-not' : '');
      const cx = c.querySelector('.fobs');
      if (cx) cx.innerHTML = (st === 'NOTIFICADO' && obs) ? '<i>' + esc(obs) + '</i>' : '';
      const cm = c.querySelector('.fmot');
      if (cm) cm.innerHTML = motivosDe({motivos: (S.aud_mot || {})[id] || [],
                                        motivos_rev: (S.aud_rev || {})[id] || []}).map(m => {
        const [rot, q] = MOTIVO[m] || [m, ''];
        return `<span class="tag ${REL_OCULTA.has(m) ? 't-gray' : 't-no'}" title="${esc(q)}">${esc(rot)}</span>`;
      }).join('');
      c.querySelector('.fa').innerHTML = audBotoes(id, st);
      ligarCartoes();
    } catch(e) { msg('a-msg', e.message); busy(b, false); }
  });
}

function lupa(el){
  const d = document.createElement('div');
  d.className = 'flupa';
  d.innerHTML = `<div><img src="${el.src}" alt=""><div class="cap">${esc(el.alt)}</div></div>`;
  d.onclick = () => d.remove();
  document.body.appendChild(d);
}

/* Relatório de suspeita de desvios — só o que foi NOTIFICADO, para anexar ao
   processo. Abre em aba própria, pronto para imprimir ou salvar em PDF. */
async function relatorioDesvios(f, w){
  if (!w) return msg('a-msg',
    'O navegador bloqueou a janela. Libere os pop-ups deste endereço e clique de novo.');
  w.document.write('<!doctype html><meta charset="utf-8"><title>Montando…</title>'
    + '<p style="font:14px system-ui;margin:40px">Montando o relatório…</p>');
  msg('a-msg', 'Montando o relatório…', true);
  let its;
  try {
    its = await rpc('he_fotos', {p_token: S.token, p_de: f.de || null, p_ate: f.ate || null,
                                 p_status: 'NOTIFICADO', p_so_sinal: false,
                                 p_pessoa: f.pessoa || null, p_limite: 200});
  } catch(e) { w.close(); return msg('a-msg', e.message); }
  if (!its || !its.length) { w.close(); return msg('a-msg', f.pessoa
    ? 'Essa pessoa não tem nenhuma batida notificada no período escolhido. Amplie as datas ou tire o filtro de nome.'
    : 'Nenhuma batida notificada nesse período. Marque "Notificar" nas que forem desvio e gere o relatório depois.'); }

  const porP = new Map();
  its.forEach(i => { const g = porP.get(i.pessoa_id) || {nome: i.nome, setor: i.setor, itens: []};
                     g.itens.push(i); porP.set(i.pessoa_id, g); });
  const agora = new Date().toLocaleString('pt-BR');
  /* dossiê de uma pessoa só: o nome vem do próprio resultado, não do <select>,
     para o cabeçalho nunca discordar do que está impresso abaixo. */
  const alvo = f.pessoa && porP.size === 1 ? [...porP.values()][0].nome : '';
  const corpo = [...porP.values()].sort((a, b) => a.nome.localeCompare(b.nome)).map(g => `
    <section>

const fmtD = s => s ? new Date(s).toLocaleDateString('pt-BR') : '';

/* ════ RH — BENEFÍCIOS EXTRAS (lanche, janta, VT extra) ════
   Porte fiel da macro Atualizar_Beneficios_v2.bas, que é a regra validada pelo RH.
   Conferido contra outubro/2026 (6.530 dias): zero divergência em lanche, janta,
   regime do dia e VERIFICAR. A única diferença proposital é o casamento de nomes
   normalizando acento — a macro usa UCase puro e por isso perdia o VT de quem tem
   cedilha/acento no nome (Gildemar MENDONÇA, Alexandre MAGALHÃES, Jorge JOSÉ).
   O ponto vem do he_rh_ponto_mes, onde 100% Diurna = Extras 100% − H.N. */
const TP_SEM = 0, TP_ADM = 1, TP_TURNO = 2;
const normNome = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
                        .replace(/\s+/g, ' ').trim().toUpperCase();
const diaNum = d => Math.round(Date.parse(d + 'T00:00:00Z') / 86400000);
const dow = d => new Date(d + 'T00:00:00').getDay();          // 0=dom, 6=sáb
const hmm = m => m < 0 ? '' : String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

function paramsBen(cfg){
  const n = (k, p) => { const v = parseFloat(cfg?.[k]); return isNaN(v) ? p : v; };
  return {
    valorRef:     n('valor_refeicao', 35.95),
    minTurno:     n('min_turno_min', 630),       // 10h30
    iniTurnoAte:  n('ini_turno_ate_min', 390),   // começa até 06:30
    fimTurnoApos: n('fim_turno_apos_min', 1140), // termina depois das 19:00
    janela:       n('janela_escala_dias', 7),
    feriadoPagaVT: String(cfg?.feriado_escala_paga_vt) === 'true',
  };
}

function tipoJornada(jor, P){
  const ms = [...String(jor || '').matchAll(/(\d{1,2}):(\d{2})/g)].map(m => +m[1] * 60 + +m[2]);
  if (ms.length < 2) return {tipo: TP_SEM, ini: -1, fim: -1};
  const ini = ms[0], fim = ms[ms.length - 1];
  let span = fim - ini; if (span <= 0) span += 1440;           // vira a meia-noite
  const turno = fim <= ini || span >= P.minTurno || ini <= P.iniTurnoAte || fim > P.fimTurnoApos;
  return {tipo: turno ? TP_TURNO : TP_ADM, ini, fim};
}
const paresBat = b => String(b || '').split(/\s+/).filter(Boolean)
  .map(p => { const t = [...p.matchAll(/(\d{1,2}):(\d{2})/g)].map(m => +m[1] * 60 + +m[2]);
              return t.length === 2 ? t : null; }).filter(Boolean);
const trabMin = b => paresBat(b).reduce((s, [e, x]) => s + (x - e < 0 ? x - e + 1440 : x - e), 0);
function batidaTurno(d, P){
  if (d.trab >= P.minTurno) return true;
  const seq = paresBat(d.b).flat();
  return seq.some((v, i) => i > 0 && v < seq[i - 1]);          // virou a meia-noite
}

/* Apura um mês inteiro. Entra o array do he_rh_ponto_mes, sai uma linha por pessoa+dia. */
function apurarBeneficios(dias, P){
  const porPessoa = new Map();
  dias.forEach(d => { if (!porPessoa.has(d.i)) porPessoa.set(d.i, []); porPessoa.get(d.i).push(d); });
  const saida = [];
  for (const [, ls] of porPessoa) {
    const D = ls.map(x => {
      const t = tipoJornada(x.j, P);
      return {...x, trab: trabMin(x.b), tipo: t.tipo, jini: t.ini, jfim: t.fim, nd: diaNum(x.d)};
    }).sort((a, b) => a.nd - b.nd);

    D.forEach((d, i) => {
      const tot = d.h52 + d.h75 + d.h100;                      // HE do dia, em minutos
      const JOR = normNome(d.j), OBS = normNome(d.o);

      let lanche = 0, janta = 0;
      if (tot > 240) janta = P.valorRef;                       // > 4:00
      else if (tot > 120) lanche = P.valorRef / 2;             // 2:01 a 4:00

      const ehFds = dow(d.d) === 0 || dow(d.d) === 6;
      const ehFolga = JOR.includes('FOLGA') || JOR.includes('FERIADO');
      const ehFer = OBS.includes('FERIADO') || JOR.includes('FERIADO');
      let vt = (ehFds || ehFolga || ehFer) && d.trab > 0 && d.mob ? 1 : 0;

      // dia de TURNO mais próximo dentro da janela (para trás ou para frente)
      let ref = '', melhor = 1e9;
      D.forEach((o, j) => { if (j !== i && o.tipo === TP_TURNO) {
        const dist = Math.abs(o.nd - d.nd);
        if (dist <= P.janela && dist < melhor) { melhor = dist; ref = o.d.slice(8, 10) + '/' + o.d.slice(5, 7); }
      }});
      const batT = batidaTurno(d, P);
      let regime = '', motivo = '', verificar = false, bloq = false;

      if (d.tipo === TP_TURNO) {
        regime = 'ESCALA';
        motivo = 'Turno ' + hmm(d.jini) + '-' + hmm(d.jfim) + (d.jfim <= d.jini ? ' (noturno)' : '');
        if (ehFds && d.trab > 0) {
          bloq = vt === 1; vt = 0;
          motivo += ': ' + (dow(d.d) === 6 ? 'sábado' : 'domingo') + ' é dia normal da escala — VT extra não conta';
        } else if (ehFer && d.trab > 0 && !P.feriadoPagaVT) {
          bloq = vt === 1; vt = 0;
          motivo += ': feriado dentro da escala — VT extra não conta';
        }
        if (lanche + janta > 0) motivo += ' | HE real além do turno: ' + hmm(tot);
      } else if (d.tipo === TP_SEM && !ehFolga && d.trab > 0 && batT && ref) {
        regime = 'ESCALA (inferida)'; bloq = vt === 1; vt = 0;
        motivo = 'Sem jornada no Quark; batidas de turno e escala em ' + ref + ' — tratado como dia da escala';
      } else if (ref) {
        if (ehFolga || d.tipo === TP_SEM) {
          regime = 'FOLGA DA ESCALA';
          if (d.trab > 0 && (lanche + janta + vt) > 0) { verificar = true;
            motivo = 'VERIFICAR: folga trabalhada por colaborador em escala (turno em ' + ref +
                     ') — confirme se não foi troca de plantão'; }
        } else {
          regime = 'ADM';
          if (batT && (lanche + janta) > 0) { verificar = true;
            motivo = 'VERIFICAR: jornada ADM no Quark, mas batidas de turno (' + hmm(d.trab) +
                     ') e escala em ' + ref + ' — confirme se a HE não é turno não lançado no Quark'; }
        }
      } else {
        regime = d.tipo === TP_ADM ? 'ADM' : ehFolga ? 'FOLGA' : 'SEM JORNADA';
      }
      if (ehFer && vt === 1 && !motivo) motivo = 'Feriado trabalhado — VT extra';

      saida.push({...d, heTot: tot, lanche, janta, vt, regime, motivo, verificar, bloq});
    });
  }
  return saida;
}

/* CSV no mesmo layout da aba "Benefícios A PAGAR" da planilha do RH */
function exportarBen(pessoas, mesExt){
  const h = ['COLABORADOR', 'CPF', 'R$ EXTRA LANCHE (2:01 ATE 4:00)', 'R$ EXTRA JANTA (4:01 +)',
             'R$ REFEIÇÃO EXTRA (SAB, DOM, FOLGA E FERIADO)', 'QTD VT EXTRA (SAB, DOM, FOLGA E FERIADO)',
             'TOTAL VT', 'TOTAL DE VR EXTRA', 'Total Benefícios'];
  const r2 = v => (v || 0).toFixed(2).replace('.', ',');
  const L = pessoas.map(p => [p.nome, p.cpf || '', r2(p.lanche), r2(p.janta), r2(0),
                              p.vt, r2(p.vtRs), r2(p.lanche + p.janta), r2(p.total)]);
  const csv = '﻿' + [h, ...L].map(l => l.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `beneficios_extras_${S.mes}.csv`; a.click();
}

/* ════ AVISOS AOS SUPERIORES ════
   Junta, por superior imediato, os colaboradores com pendências e monta a mensagem de WhatsApp. Sem valores em R$. */
const nomeBonito = n => String(n||'').toLowerCase().replace(/(^|\s)(\S)/g, (m,a,b) => a + b.toUpperCase()).replace(/\s(D[aeo]s?|E)\s/g, m => m.toLowerCase());
async function vAvisos(){
  if (!S.pessoas) S.pessoas = await rpc('he_admin_pessoas', {p_token:S.token});
  let det;
  try { det = await rpc('he_avisos_detalhe', {p_token:S.token, p_mes:mesData()}); }
  catch(e){ $('main').innerHTML = `<div class="card"><div class="msg e">Falta atualizar o banco: rode o arquivo 12_avisos.sql no Supabase. (${esc(e.message)})</div></div>`; return; }
  S.av = S.av || {inc:true, top:true, n:5, semaut:false, aud:false, sup:'', enviados:new Set()};
  const A = S.av;
  const D = new Map(det.map(d => [d.pessoa_id, d]));
  const ate = det.find(d => d.ate)?.ate;
  /* ponto incompleto: só dias já fechados. O dia de hoje ainda está em curso (as pessoas ainda vão bater). */
  const isoLocal = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const hojeISO = isoLocal(new Date()), ontemISO = isoLocal(new Date(Date.now()-864e5));
  const ddmm = iso => iso.slice(8,10)+'/'+iso.slice(5,7);
  const corteInc = ate && ate < hojeISO ? ate : ontemISO;          // último dia fechado considerado
  const anoMes = S.mes.slice(0,4);
  const diasFechados = txt => {                                    // tira do texto os dias depois do corte (ex.: "27/10, 28/10 (sem marcação)")
    if (typeof txt !== 'string') return txt;
    return txt.split(/,\s*(?=\d{2}\/\d{2})/).filter(parte => {
      const m = parte.trim().match(/^(\d{2})\/(\d{2})/);
      return !m || `${anoMes}-${m[2]}-${m[1]}` <= corteInc;
    }).join(', ');
  };
  const P = new Map(S.pessoas.map(p => [p.id, p]));
  const base = S.resumo.filter(r => r.pessoa_id !== S.eu.id);
  const gente = filtrar(base);
  const grupos = new Map();
  for (const r of gente) { const k = (P.get(r.pessoa_id)||{}).superior_id || '__sem';
    if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(r); }
  const mesTxt = new Date(S.mes+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const blocos = [];
  for (const [k, eq] of grupos) {
    if (A.sup && A.sup !== k) continue;
    const det_ = r => D.get(r.pessoa_id) || {};
    const incTxt = r => diasFechados(det_(r).incompletos);
    const inc = A.inc ? eq.filter(r => incTxt(r)) : [];
    const top = A.top ? eq.filter(r => r.he50+r.he75+r.he100 > 0).sort((a,b) => (b.he50+b.he75+b.he100) - (a.he50+a.he75+a.he100)).slice(0, A.n) : [];
    const sa = A.semaut ? eq.filter(r => det_(r).sem_aut) : [];
    const au = A.aud ? eq.filter(r => det_(r).auditar) : [];
    if (!inc.length && !top.length && !sa.length && !au.length) continue;
    const sup = P.get(k);
    const partes = [];
    if (inc.length) partes.push(`⚠️ *Ponto incompleto no Quark* até ${ddmm(corteInc)} (pedir a justificativa e acertar com o RH):\n` + inc.map(r => `• ${nomeBonito(r.nome)}: ${incTxt(r)}`).join('\n'));
    if (top.length) partes.push(`⏱️ *Top ${top.length} em horas extras no mês* (horas feitas, sem fator):\n` + top.map((r,i) => `${i+1}. ${nomeBonito(r.nome)}: ${hm(r.he50+r.he75+r.he100)}`).join('\n'));
    if (sa.length) partes.push(`❗ *HE sem autorização no app*:\n` + sa.map(r => `• ${nomeBonito(r.nome)}: ${det_(r).sem_aut}`).join('\n'));
    if (au.length) partes.push(`🔎 *Para auditar no Quark* (dentro da tolerância, mas com HE apontada):\n` + au.map(r => `• ${nomeBonito(r.nome)}: ${det_(r).auditar}`).join('\n'));
    const texto = `Olá, ${sup ? nomeBonito(sup.nome.split(' ')[0]) : ''}! Resumo de horas da sua equipe em ${mesTxt}${ate ? ` (ponto importado até ${ate.slice(8,10)}/${ate.slice(5,7)})` : ''}.\n\n`
      + partes.join('\n\n') + `\n\nDetalhes no Horas i9: ${linkApp()}`;
    blocos.push({k, sup, eq, texto, n:{inc:inc.length, top:top.length, sa:sa.length, au:au.length}});
  }
  blocos.sort((a,b) => (a.k==='__sem') - (b.k==='__sem') || (a.sup?.nome||'').localeCompare(b.sup?.nome||''));
  const supsOpc = [...grupos.keys()].map(k => [k, k==='__sem' ? '— sem superior —' : (P.get(k)||{}).nome || '?']).sort((a,b) => a[1].localeCompare(b[1]));
  const chip = (on, id, txt) => `<button class="chip ${on?'on':''}" id="${id}">${txt}</button>`;
  $('main').innerHTML = `
    ${barraFiltro(base)}
    <div class="card">
      <h2 style="margin:0 0 4px">Avisos aos superiores</h2>
      <p class="sub" style="margin-bottom:10px">Monta uma mensagem para cada superior imediato com o bloco da equipe dele. Revise o texto e envie pelo WhatsApp. Valores em R$ nunca entram.</p>
      <div class="chips" style="margin-bottom:8px">
        ${chip(A.inc,'av-inc','Ponto incompleto')}
        ${chip(A.top,'av-top','Top em horas extras')}
        ${chip(A.semaut,'av-sa','HE sem autorização')}
        ${chip(A.aud,'av-aud','Auditar Quark')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${A.top?`<label class="sub" style="margin:0">Quantos no top <select class="in" id="av-n" style="width:auto;margin:0 0 0 4px;padding:6px">${[3,5,10].map(n=>`<option ${n===A.n?'selected':''}>${n}</option>`).join('')}</select></label>`:''}
        <select class="in" id="av-sup" style="flex:0 1 320px;margin:0"><option value="">Todos os superiores</option>
          ${supsOpc.map(([k,n])=>`<option value="${k}" ${A.sup===k?'selected':''}>${esc(n)}</option>`).join('')}</select>
        ${blocos.length>1?'<button class="btn s" id="av-all">Copiar todas as mensagens</button>':''}
      </div>
    </div>
    ${blocos.length ? blocos.map((b,i) => {
      const fone = b.sup ? foneWa(b.sup.telefone) : '';
      const resumo = [b.n.inc&&`${b.n.inc} com ponto incompleto`, b.n.top&&`top ${b.n.top} HE`, b.n.sa&&`${b.n.sa} com HE sem autorização`, b.n.au&&`${b.n.au} para auditar`].filter(Boolean).join(' · ');
      return `<div class="card av ${A.enviados.has(b.k)?'enviado':''}">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
          <div><b>${b.sup?esc(b.sup.nome):'Pessoas sem superior cadastrado'}</b>
            <div class="sub">${b.sup?PAPEL[b.sup.papel]+' · ':''}${b.eq.length} na equipe · ${resumo}${A.enviados.has(b.k)?' · <b style="color:var(--ok,#1B7F3B)">enviado ✓</b>':''}</div></div>
          <div style="display:flex;gap:6px">
            ${b.sup?(fone?`<a class="btn p s" data-wa="${i}" target="_blank" rel="noopener">Enviar no WhatsApp</a>`:'<span class="tag t-gray">sem telefone no cadastro</span>'):'<span class="tag t-wait">defina o superior em Cadastros</span>'}
            <button class="btn s" data-cp="${i}">Copiar</button></div></div>
        <textarea class="in" data-tx="${i}" rows="${Math.min(18, b.texto.split('\n').length + 1)}" style="margin-top:10px;font-size:13px;white-space:pre-wrap">${esc(b.texto)}</textarea>
      </div>`; }).join('') : '<div class="card"><p class="muted">Nada para avisar com esses filtros neste mês.</p></div>'}`;
  const tx = i => document.querySelector(`[data-tx="${i}"]`).value;
  const copiar = async (t, b) => { try { await navigator.clipboard.writeText(t); b.textContent = 'Copiado ✓'; setTimeout(() => b.textContent = 'Copiar', 1500); }
    catch(e){ alertar('Não consegui copiar. Selecione o texto e use Ctrl+C.'); } };
  document.querySelectorAll('[data-wa]').forEach(a => { const b = blocos[+a.dataset.wa];
    a.onmousedown = a.ontouchstart = () => a.href = `https://wa.me/${foneWa(b.sup.telefone)}?text=${encodeURIComponent(tx(a.dataset.wa))}`;
    a.href = `https://wa.me/${foneWa(b.sup.telefone)}?text=${encodeURIComponent(b.texto)}`;
    a.onclick = () => { a.href = `https://wa.me/${foneWa(b.sup.telefone)}?text=${encodeURIComponent(tx(a.dataset.wa))}`; A.enviados.add(b.k);
      setTimeout(() => a.closest('.av').classList.add('enviado'), 300); }; });
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => copiar(tx(b.dataset.cp), b));
  if ($('av-all')) $('av-all').onclick = () => copiar(blocos.map((b,i) => `*${b.sup?b.sup.nome:'Sem superior'}*\n${tx(i)}`).join('\n\n———\n\n'), $('av-all'));
  const tog = (id, k) => $(id).onclick = () => { A[k] = !A[k]; vAvisos(); };
  tog('av-inc','inc'); tog('av-top','top'); tog('av-sa','semaut'); tog('av-aud','aud');
  if ($('av-n')) $('av-n').onchange = () => { A.n = +$('av-n').value; vAvisos(); };
  $('av-sup').onchange = () => { A.sup = $('av-sup').value; vAvisos(); };
  ligarFiltro(vAvisos);
}
function editar(p, opSup, opPap, adm){
  modal(`<div class="md-h"><h2 style="margin:0">${esc(p.nome)}</h2><button class="x-btn" data-close>×</button></div>
    ${adm?`<label>Função</label><select class="in" id="e-pap" ${p.papel==='admin'?'disabled':''}>${p.papel==='admin'?'<option>Administrador</option>':opPap(p.papel)}</select>
    <label>Superior imediato</label><select class="in" id="e-sup">${opSup(p.superior_id, p.id)}</select>
    <label>Setor${p.cargo?' <span class="sub">('+esc(p.cargo)+')</span>':''}</label><select class="in" id="e-set"><option value="">— sem setor —</option>
      <optgroup label="Engenharia">${SETORES_ENG.map(x=>`<option ${x===p.setor?'selected':''}>${x}</option>`).join('')}</optgroup>
      <optgroup label="Outras áreas">${SETORES_ADM.map(x=>`<option ${x===p.setor?'selected':''}>${x}</option>`).join('')}</optgroup></select>`:''}
    ${adm&&p.papel!=='admin'?`<label class="gopt" style="margin-top:12px"><input type="checkbox" id="e-rh" ${p.acesso_rh?'checked':''}><div><b>Acesso de RH / DP</b><div class="sub">Libera Fechamento RH, Benefícios extras, Avisos e Cadastros, e deixa a pessoa ver todo mundo. Não muda a função no organograma nem quem ela autoriza.</div></div></label>`:''}
    ${adm?`<label>Celular (WhatsApp)</label><input class="in" id="e-tel" inputmode="tel" value="${esc(p.telefone||'')}" placeholder="(27) 99999-9999">`:''}
    <div class="row"><div><label>Matrícula</label><input class="in" id="e-mat" value="${esc(p.matricula||'')}"></div>
      <div><label>Hora base (R$)</label><input class="in" id="e-hb" inputmode="decimal" value="${p.hora_base??''}" placeholder="25,00"></div></div>
    <div><label>Hora base do sobreaviso (R$)</label><input class="in" id="e-hbsa" inputmode="decimal" value="${p.hora_base_sa??''}" placeholder="18,00">
      <div class="sub" style="margin:-6px 0 10px">Salário ÷ 220, <b>sem</b> o adicional de periculosidade (Súmula 132, II do TST). O painel aplica o 1/3 em cima disso. A hora base de cima, com periculosidade e insalubridade, continua valendo para hora extra, adicional noturno e acionamento.</div></div>
    <button class="btn p w" id="e-ok">Salvar</button>
    ${adm&&p.status==='sem_acesso'?'<button class="btn ok w" id="e-conv">Gerar convite para esta pessoa</button>':''}
    ${adm&&p.papel!=='admin'?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      ${p.status!=='sem_acesso'?'<button class="btn s" data-ac="resetar">Resetar PIN</button>':''}
      ${p.status==='bloqueado'?'<button class="btn s" data-ac="desbloquear">Desbloquear</button>':'<button class="btn no s" data-ac="bloquear">Bloquear acesso</button>'}</div>`:''}
    <div id="e-m"></div>`);
  if ($('e-conv')) $('e-conv').onclick = () => convidar(p);
  $('e-ok').onclick = async () => {
    const hb = $('e-hb').value.trim().replace(',', '.');
    const hbsa = $('e-hbsa').value.trim().replace(',', '.');
    try { await rpc('he_admin_editar', {p_token:S.token, p_pessoa:p.id,
        p_papel: adm && $('e-pap') && p.papel!=='admin' ? $('e-pap').value : null,
        p_superior: adm ? ($('e-sup').value || null) : p.superior_id,
        p_matricula: $('e-mat').value.trim() || null, p_hora_base: hb ? +hb : null,
        /* 0 apaga; nulo mantém o que está lá (ver comentário na migração _23) */
        p_hora_base_sa: hbsa ? +hbsa : (p.hora_base_sa != null ? 0 : null),
        ...(adm ? {p_setor: $('e-set').value || null, p_telefone: $('e-tel').value.trim()} : {})});
      if ($('e-rh') && $('e-rh').checked !== !!p.acesso_rh)
        await rpc('he_admin_acesso', {p_token:S.token, p_pessoa:p.id, p_acao:$('e-rh').checked?'rh_on':'rh_off'});
      fecharModal(); S.pessoas = null; carregar(); } catch(e){ msg('e-m', e.message); }

  document.querySelectorAll('[data-ac]').forEach(b => b.onclick = async () => {

    catch(e){ msg('e-m', e.message); }
  });
}

/* ════ CONVITES ════ */
const NIVEL = {colaborador:0,supervisor:1,coordenador:2,gc:3,admin:9};
function papeisConvite(){
  const todos = ['colaborador','supervisor','coordenador','gc'];
  return S.eu.papel === 'admin' ? todos : todos.filter(k => k !== 'rh' && NIVEL[k] < NIVEL[S.eu.papel]);
}
function linkApp(){ return location.href.split('#')[0].split('?')[0]; }
function textoConvite(r){
  return `Olá, ${r.nome.split(' ')[0]}! Seu convite para o app Horas i9 é ${r.convite}. ` +
    `Abra ${linkApp()} e toque em "Tenho um convite". Depois, você entra com o código ${r.codigo} e o PIN que criar.`;
}
/* número de WhatsApp da pessoa (DDI 55; quem tem só 9 dígitos ganha o DDD 27) */
function foneWa(tel){
  let d = String(tel||'').replace(/\D/g,'').replace(/^0+/,'');
  if (d.startsWith('55') && d.length >= 12) d = d.slice(2);
  if (d.length === 9) d = '27' + d;
  return d.length === 10 || d.length === 11 ? '55' + d : '';
}
function linkWa(r){
  const p = (S.pessoas||[]).find(x => x.id === r.pessoa_id);
  return `https://wa.me/${foneWa(p && p.telefone)}?text=${encodeURIComponent(textoConvite(r))}`;
}
function mostrarConvites(lista){
  modal(`<div class="md-h"><h2 style="margin:0">Convites gerados</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">Envie cada convite só para a própria pessoa. Vale por 30 dias e só pode ser usado uma vez.</p>
    ${lista.map((r,i)=>`<div class="pend"><b>${esc(r.nome)}</b>
      <div style="font-size:22px;font-weight:700;letter-spacing:2px;margin:4px 0">${esc(r.convite)}</div>
      <div class="sub">Código de acesso: ${r.codigo}${(()=>{const p=(S.pessoas||[]).find(x=>x.id===r.pessoa_id);return p&&p.telefone?' · '+esc(p.telefone):' · sem telefone cadastrado (escolha o contato no WhatsApp)';})()}</div>
      <div class="a"><a class="btn ok s" target="_blank" rel="noopener" href="${linkWa(r)}">Enviar por WhatsApp</a>
        <button class="btn s" data-cp="${i}">Copiar mensagem</button></div></div>`).join('')
      || '<p class="muted">Nenhum convite gerado (a pessoa já tem acesso?).</p>'}
    <div id="cv-m"></div>`);
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(textoConvite(lista[+b.dataset.cp])); msg('cv-m','Mensagem copiada.',true); }
    catch(e){ msg('cv-m','Não foi possível copiar. Use o botão do WhatsApp.'); }
  });
}
function convidar(pre){
  const pap = papeisConvite();
  const adm = S.eu.papel === 'admin';
  modal(`<div class="md-h"><h2 style="margin:0">Convidar pessoa</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">${adm?'O convite do administrador já libera o acesso.':'Você será o superior imediato. O acesso é liberado depois da aprovação do administrador.'}</p>
    ${pre?`<div class="expl"><b>${esc(pre.nome)}</b></div>`:`<label for="cv-q">Nome (mínimo 3 letras)</label>
      <input class="in" id="cv-q" autocomplete="off" placeholder="Buscar quem ainda não tem acesso"><div id="cv-r" style="margin-top:8px"></div>`}
    <label for="cv-p">Função</label>
    <select class="in" id="cv-p">${pap.map(k=>`<option value="${k}" ${pre&&pre.papel===k?'selected':''}>${PAPEL[k]}</option>`).join('')}</select>
    ${adm?`<label for="cv-s">Superior imediato</label><select class="in" id="cv-s">${opcoesSuperior(pre&&pre.superior_id, pre&&pre.id, '— definir depois —')}</select>`:''}
    <button class="btn p w" id="cv-ok" ${pre?'':'disabled'}>Gerar convite</button><div id="cv-m2"></div>`);
  let escolhido = pre ? pre.id : null, t;
  if (!pre) $('cv-q').oninput = () => { clearTimeout(t); t = setTimeout(async () => {
    const q = $('cv-q').value.trim();
    if (q.length < 3) { $('cv-r').innerHTML = ''; return; }
    try {
      const r = await rpc('he_busca_sem_acesso', {p_token:S.token, p_q:q});
      $('cv-r').innerHTML = r.length ? r.map(x=>`<label class="opt" style="margin-bottom:6px"><input type="radio" name="cvp" value="${x.id}">
        <div><b>${esc(x.nome)}</b><span>${esc(x.empresa||'')}${x.convite_pendente?' · já tem convite em aberto (gerar de novo substitui)':''}</span></div></label>`).join('')
        : '<p class="muted">Ninguém sem acesso com esse nome.</p>';
      document.querySelectorAll('input[name=cvp]').forEach(i => i.onchange = () => { escolhido = i.value; $('cv-ok').disabled = false; });
    } catch(e){ msg('cv-m2', e.message); }
  }, 250); };
  $('cv-ok').onclick = async () => {
    if (!escolhido) return;
    try {
      const r = await rpc('he_convidar', {p_token:S.token, p_pessoas:[escolhido], p_papel:$('cv-p').value,
        p_superior: adm ? ($('cv-s').value || null) : null});
      mostrarConvites(r); S.pessoas = null;
    } catch(e){ msg('cv-m2', e.message); }
  };
}
function convitesLote(){
  const sem = (S.pessoas||[]).filter(p => p.status==='sem_acesso' && p.no_quark);
  const emp = [...new Set(sem.map(p=>p.empresa||''))];
  modal(`<div class="md-h"><h2 style="margin:0">Convites em lote</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">Gera um convite para cada colaborador que ainda não tem acesso e baixa uma planilha (CSV) com nome, código e convite, para entregar aos supervisores.</p>
    <label>Empresa</label><select class="in" id="lt-e"><option value="">Todas</option>${emp.map(e=>`<option>${esc(e)}</option>`).join('')}</select>
    <label><input type="checkbox" id="lt-n" checked> Pular quem já tem convite em aberto</label>
    <label>Superior imediato de todos do lote</label><select class="in" id="lt-s">${opcoesSuperior(null, null, '— manter o que já está definido em cada pessoa —')}</select>
    <label><input type="checkbox" id="lt-f"> Só quem tem celular cadastrado</label>
    <div class="expl" style="margin-top:10px">Dica: para cada pessoa já ficar ligada ao superior certo, o caminho mais simples é cada líder convidar a própria equipe pelo botão "+ Convidar pessoa" na aba Equipe. Use o lote para quem ficar de fora.</div>
    <p class="sub" id="lt-c" style="margin-top:8px"></p>
    <button class="btn p w" id="lt-ok">Gerar e baixar CSV</button><div id="lt-m"></div>`);
  const alvo = () => sem.filter(p => (!$('lt-e').value || p.empresa===$('lt-e').value) && (!$('lt-n').checked || !p.convite_pendente)
    && (!$('lt-f').checked || foneWa(p.telefone)));
  const conta = () => $('lt-c').textContent = alvo().length + ' pessoa(s) vão receber convite. Os convites valem 30 dias.';
  $('lt-e').onchange = conta; $('lt-n').onchange = conta; $('lt-f').onchange = conta; conta();
  $('lt-ok').onclick = async () => {
    const ids = alvo().map(p=>p.id); if (!ids.length) return msg('lt-m','Ninguém para convidar.');
    busy($('lt-ok'),true);
    try {
      // cada pessoa mantém a função já definida (líder continua líder)
      const porPapel = {};
      for (const p of alvo()) (porPapel[p.papel && p.papel !== 'admin' ? p.papel : 'colaborador'] ||= []).push(p.id);
      let r = [];
      for (const [pap, lista] of Object.entries(porPapel))
        r = r.concat(await rpc('he_convidar', {p_token:S.token, p_pessoas:lista, p_papel:pap, p_superior:$('lt-s').value || null}));
      const tel = id => { const p = (S.pessoas||[]).find(x=>x.id===id); return p && p.telefone || ''; };
      const csv = '﻿' + [['Nome','Celular','Código de acesso','Convite','Link WhatsApp','Mensagem'], ...r.map(x=>[x.nome, tel(x.pessoa_id), x.codigo, x.convite, linkWa(x), textoConvite(x)])]
        .map(l => l.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
      a.download = `convites_horas_i9_${new Date().toISOString().slice(0,10)}.csv`; a.click();
      mostrarConvites(r); S.pessoas = null;
    } catch(e){ msg('lt-m', e.message); busy($('lt-ok'),false); }
  };
}

/* ════ modal ════ */
function modal(html){
  $('modal').innerHTML = `<div class="ov"><div class="md" role="dialog" aria-modal="true">${html}</div></div>`;
  $('modal').querySelector('.ov').onclick = e => { if (e.target.classList.contains('ov')) fecharModal(); };
  $('modal').querySelectorAll('[data-close]').forEach(b => b.onclick = fecharModal);
}
function fecharModal(){ $('modal').innerHTML = ''; }
function alertar(t){ modal(`<div class="md-h"><h2 style="margin:0">Atenção</h2><button class="x-btn" data-close>×</button></div><div class="msg e">${esc(t)}</div>`); }
