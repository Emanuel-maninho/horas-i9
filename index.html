<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F1F1F">
<title>Horas i9</title>
<style>
:root{
  --red:#C00000;--red-d:#8E0000;--red-l:#FBE9E9;
  --ink:#1A1A1A;--ink2:#4A4A4A;--ink3:#8A8A8A;
  --line:#E3E3E3;--bg:#F4F4F4;--card:#FFFFFF;--dark:#1F1F1F;
  --ok:#2E7D32;--ok-l:#E8F3E8;--warn:#9A6200;--warn-l:#FFF4DC;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.45}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0))}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* topo */
.top{background:var(--dark);color:#fff;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.top-t{flex:1;min-width:0}
.top-t b{display:block;font-size:15px}
.top-t span{font-size:12px;color:#BDBDBD}
.top-a{display:flex;gap:6px;align-items:center}
.top input[type=month]{background:#2D2D2D;border:1px solid #444;color:#fff;border-radius:8px;padding:6px 8px;font-size:13px}
.lnk{background:none;border:1px solid #555;color:#EEE;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}

/* abas */
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs-in{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--red);border-bottom-color:var(--red);font-weight:700}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;margin-left:5px}

.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:16px;margin-bottom:10px}
h3{font-size:14px;margin-bottom:8px;color:var(--ink2)}
.sub{font-size:13px;color:var(--ink3)}
.muted{color:var(--ink3)}

/* formulários */
label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.in{width:100%;border:1px solid #CFCFCF;border-radius:8px;padding:10px 12px;background:#fff;font-size:16px}
.in:focus{outline:2px solid var(--red);outline-offset:0;border-color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #CFCFCF;background:#fff;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:14px}
.btn.p{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.p:active{background:var(--red-d)}
.btn.w{width:100%;margin-top:14px}
.btn.s{padding:6px 10px;font-size:13px}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.no{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:8px}
.msg.e{background:var(--red-l);color:var(--red-d)}
.msg.o{background:var(--ok-l);color:var(--ok)}

/* login */
.login{max-width:420px;margin:32px auto;padding:0 16px}
.login .brand{text-align:center;margin-bottom:18px}
.login .brand .logo{margin:0 auto 10px;width:52px;height:52px;font-size:22px;color:#fff}
.login .brand b{font-size:19px}
.switch{text-align:center;margin-top:14px;font-size:14px}
.switch a{color:var(--red);font-weight:700;cursor:pointer}

/* saldo */
.saldo{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-bottom:14px}
.big{background:var(--dark);color:#fff;border-radius:var(--r);padding:16px}
.big .v{font-size:40px;font-weight:700;line-height:1.1}
.big .l{font-size:13px;color:#CFCFCF}
.big.zero{background:var(--ok)}
.st{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.st .v{font-size:24px;font-weight:700}
.st .l{font-size:12px;color:var(--ink3)}
@media(max-width:640px){.saldo{grid-template-columns:1fr 1fr}.big{grid-column:1/-1}.row{grid-template-columns:1fr}}
.note{background:var(--warn-l);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}

/* listas */
.day{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.day:last-child{border-bottom:0}
.day .d{width:52px;flex-shrink:0;text-align:center}
.day .d b{display:block;font-size:18px}
.day .d span{font-size:11px;color:var(--ink3);text-transform:uppercase}
.day .c{flex:1;min-width:0;font-size:14px}
.day .c .x{font-size:12px;color:var(--ink3)}
.day .h{font-weight:700;white-space:nowrap}
.plus{color:var(--red)}.minus{color:var(--ok)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;vertical-align:1px}
.t-ok{background:var(--ok-l);color:var(--ok)}
.t-wait{background:var(--warn-l);color:var(--warn)}
.t-no{background:var(--red-l);color:var(--red-d)}
.t-gray{background:#EEE;color:#666}

/* tabelas */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;color:var(--ink3);text-align:right;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th.l,td.l{text-align:left}
tr.click,th.click{cursor:pointer}
tr.click:hover td{background:#FAFAFA}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}

.pend{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.pend .a{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.opt input{margin-top:3px}
.opt.on{border-color:var(--red);background:#FFF8F8}
.opt b{display:block;font-size:14px}
.opt span{font-size:12px;color:var(--ink2);font-weight:400}
.opt div{font-weight:400}
.top-t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){
  .top-t{flex-basis:calc(100% - 46px)}
  .top-a{width:100%;justify-content:flex-end}
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tfoot{display:block}
  table.resp tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:8px 10px}
  table.resp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 0;white-space:normal}
  table.resp td.l{display:block;text-align:left;padding-bottom:6px}
  table.resp td[data-l]::before{content:attr(data-l);color:var(--ink3);font-size:12px;text-align:left}
  table.resp td:empty{display:none}
}
.expl{font-size:13px;color:var(--ink2);background:#F7F7F7;border-radius:8px;padding:10px 12px;margin-bottom:12px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0))}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:14px}}
.md-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x-btn{background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink3)}
.loading{padding:30px;text-align:center;color:var(--ink3)}

/* filtro de grupo / setor */
.filtro{margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.sub{margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip span{color:var(--ink3);font-weight:500;margin-left:2px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on span{color:#ccc}
.chips.sub .chip{font-size:12px;padding:4px 10px}
tr.grp td{background:#F4F4F4;text-align:left;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);padding:6px 8px;cursor:pointer;user-select:none}
tr.grp td:hover{background:#ECECEC}
tr.grp .seta{display:inline-block;width:14px;transition:transform .15s;color:var(--ink3)}
tr.grp.fechado .seta{transform:rotate(-90deg)}
.grp-acoes{display:flex;gap:6px;justify-content:flex-end;margin:-2px 0 8px}
.lnk2{background:none;border:0;color:var(--ink2);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;padding:2px 4px}
/* telas largas: tabelas cabem sem rolagem lateral */
body.largo .top-in,body.largo .tabs-in,body.largo .wrap{max-width:1480px}
@media(min-width:900px){
  table.cmp{font-size:12.5px}
  table.cmp th{padding:6px 5px;font-size:10px;white-space:normal;vertical-align:bottom}
  table.cmp td{padding:7px 5px}
  table.cmp td.l{white-space:normal}
  table.cmp td.l:first-child{min-width:190px}
  table.cmp td.w{white-space:normal}
}
tr.grp td span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink3);margin-left:6px}
@media(max-width:640px){table.resp tr.grp{border:0;padding:8px 2px 2px;margin:10px 0 4px;background:none}table.resp tr.grp td{background:none;display:block}}

/* relatório impresso */
#print{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-size:11px}
  @page{size:A4;margin:12mm}
}
.rp h1{font-size:16px;margin:0}
.rp h3{font-size:12px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.rp .cab{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.rp .id{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.rp table{width:100%;border-collapse:collapse}
.rp table{font-size:10px}
.rp th,.rp td{border:1px solid #999;padding:3px 5px;text-align:right;vertical-align:top;white-space:normal;color:#000}
.rp th{background:#eee;font-weight:600;font-size:9px}
.rp td:nth-child(n){word-break:break-word}
.rp td:first-child{white-space:nowrap;word-break:normal}
.rp{padding-right:2px}
.rp td.l,.rp th.l{text-align:left}
.rp tr{break-inside:avoid}
.rp .ass{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:40px;text-align:center}
.rp .ass div{border-top:1px solid #000;padding-top:4px}
.rp .rod{margin-top:12px;color:#555;font-size:10px}
.rp .nota{font-size:10px;color:#333;margin:4px 0 0}
.rp .decl{margin-top:18px}
.rp .obs{margin-top:8px}
.rp .obs div{border-bottom:1px solid #999;height:20px}
.rp .ass span{font-size:9px;color:#444}
</style>
</head>
<body>

<!-- ═══ LOGIN / PRIMEIRO ACESSO ═══ -->
<div id="v-login" class="login hidden">

          <input class="in" id="c-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
        <div><label for="c-pin2">Repita o PIN</label>

</div>

<!-- ═══ APP ═══ -->
<div id="v-app" class="hidden">
  <div class="top"><div class="top-in">
    <div class="logo">i9</div>
    <div class="top-t"><b id="u-nome">—</b><span id="u-papel">—</span></div>
    <div class="top-a">
      <input type="month" id="mes" aria-label="Mês">
      <button class="lnk" id="b-pin">PIN</button>
      <button class="lnk" id="b-sair">Sair</button>
    </div>
  </div></div>
  <div class="tabs"><div class="tabs-in" id="tabs"></div></div>
  <div class="wrap" id="main"></div>
</div>

<div id="modal"></div>
<div id="print"></div>

<script>
/* ════ CONFIGURAÇÃO ════
   Preencher com os dados do projeto Supabase "I9 Engenharia" (Settings → API).
   Use a chave PUBLISHABLE / anon — nunca a service_role aqui. */
const SUPABASE_URL = 'https://blinftijbpyqduenkcub.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsaW5mdGlqYnB5cWR1ZW5rY3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzU1MDQsImV4cCI6MjA5MjgxMTUwNH0.ODQC6tpe1RKFe78LB6GhinD74iIzWzLQwQbAkJ4BxNM';
const API = (window.HE_API || SUPABASE_URL + '/rest/v1');

/* ════ utilidades ════ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = m => { m = Math.round(m || 0); const s = m < 0 ? '−' : ''; m = Math.abs(m);
  return s + Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); };
const brl = v => (v < 0 ? '−' : '') + 'R$ ' + Math.abs(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const PAPEL = {colaborador:'Colaborador',supervisor:'Supervisor de campo',coordenador:'Coordenador',gc:'Gestor de Contrato',rh:'RH',admin:'Administrador'};
const LIDER = ['supervisor','coordenador','gc','admin'];
const DIA = ['dom','seg','ter','qua','qui','sex','sáb'];

/* ── grupos de empresa e setores ── */
const SETORES_ENG = ['Gestão de Engenharia','Automação','Elétrica','Mecânica','Planejamento','Projetos','SESMT','Almoxarifado'];
const SETORES_ADM = ['Diretoria','Administrativo','Comercial','Financeiro','RH / DP','Suprimentos','Logística / Frota','TI'];
const SETORES = [...SETORES_ENG, ...SETORES_ADM];
const GRUPOS = ['I9 MATRIZ','I9 FILIAL','FIO FORTE','TODOS'];
function grupo(emp){
  const e = (emp||'').toUpperCase();
  if (/FIO\s*FORTE|FIOFORTE/.test(e)) return 'FIO FORTE';
  if (/\bI9\b/.test(e)) return /\bRJ\b|FILIAL/.test(e) ? 'I9 FILIAL' : 'I9 MATRIZ';
  return 'OUTRAS';
}
const ehEng = p => !p.setor || SETORES_ENG.includes(p.setor);     // sem setor fica visível até ser classificado
const usaFiltro = () => S.eu && (S.eu.papel === 'admin' || S.eu.papel === 'rh');
function filtrar(lista){
  if (!usaFiltro()) return lista;
  return lista.filter(p => (S.f.g === 'TODOS' || grupo(p.empresa) === S.f.g)
    && !(S.f.g === 'I9 MATRIZ' && S.f.eng && !ehEng(p)));
}
function porSetor(lista){
  const m = new Map();
  for (const p of lista) { const k = p.setor || 'Sem setor'; if (!m.has(k)) m.set(k, []); m.get(k).push(p); }
  const ordem = k => k === 'Sem setor' ? 999 : (SETORES.indexOf(k) + 1 || 500);
  return [...m.entries()].sort((a,b) => ordem(a[0]) - ordem(b[0]));
}
function barraFiltro(base){
  if (!usaFiltro()) return '';
  const n = g => g === 'TODOS' ? base.length : base.filter(p => grupo(p.empresa) === g).length;
  const chip = (on, attr, txt) => `<button class="chip ${on?'on':''}" ${attr}>${txt}</button>`;
  const nEng = base.filter(p => grupo(p.empresa) === 'I9 MATRIZ' && ehEng(p)).length;
  return `<div class="filtro">
    <div class="chips">${GRUPOS.filter(g => g === 'TODOS' || n(g)).map(g => chip(S.f.g===g, `data-g="${g}"`,
      `${g==='TODOS'?'Todos':g} <span>${n(g)}</span>`)).join('')}</div>
    ${S.f.g==='I9 MATRIZ'?`<div class="chips sub">${chip(S.f.eng,'data-eng="1"',`Só Engenharia <span>${nEng}</span>`)}${chip(!S.f.eng,'data-eng="0"',`Todos os setores <span>${n('I9 MATRIZ')}</span>`)}</div>`:''}
  </div>`;
}
function ligarFiltro(redesenhar){
  document.querySelectorAll('.filtro [data-g]').forEach(b => b.onclick = () => { S.f.g = b.dataset.g; salvarFiltro(); redesenhar(); });
  document.querySelectorAll('.filtro [data-eng]').forEach(b => b.onclick = () => { S.f.eng = b.dataset.eng === '1'; salvarFiltro(); redesenhar(); });
}
function salvarFiltro(){ store.set('he_filtro', JSON.stringify(S.f)); }
/* grupos de setor recolhíveis (estado lembrado por aparelho) */
let FECHADOS = new Set(); try { FECHADOS = new Set(JSON.parse(store.get('he_fechados')||'[]')); } catch(e){}
const salvarFechados = () => store.set('he_fechados', JSON.stringify([...FECHADOS]));
function cabGrupo(chave, cols, rotulo, resumo){
  const f = FECHADOS.has(chave);
  return `<tr class="grp ${f?'fechado':''}" data-grp="${esc(chave)}"><td colspan="${cols}"><span class="seta">▾</span>${esc(rotulo)}<span>${resumo}</span></td></tr>`;
}
const linhaDoGrupo = (chave, html) => html.replace('<tr ', `<tr data-de="${esc(chave)}" ${FECHADOS.has(chave)?'style="display:none" ':''}`);
function ligarGrupos(prefixo, chaves){
  document.querySelectorAll('tr[data-grp]').forEach(tr => tr.onclick = () => {
    const k = tr.dataset.grp, abrir = FECHADOS.has(k);
    abrir ? FECHADOS.delete(k) : FECHADOS.add(k); salvarFechados();
    tr.classList.toggle('fechado', !abrir);
    document.querySelectorAll(`tr[data-de="${CSS.escape(k)}"]`).forEach(l => l.style.display = abrir ? '' : 'none');
  });
  const todos = (fechar) => { chaves.forEach(k => fechar ? FECHADOS.add(k) : FECHADOS.delete(k)); salvarFechados();
    document.querySelectorAll('tr[data-grp]').forEach(tr => tr.classList.toggle('fechado', fechar));
    document.querySelectorAll('tr[data-de]').forEach(l => l.style.display = fechar ? 'none' : ''); };
  if ($(prefixo+'-rec')) $(prefixo+'-rec').onclick = () => todos(true);
  if ($(prefixo+'-exp')) $(prefixo+'-exp').onclick = () => todos(false);
}

  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

async function rpc(fn, args = {}) {
  const h = {'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY};
  if (!SUPABASE_ANON_KEY.startsWith('sb_publishable_')) h.Authorization = 'Bearer ' + SUPABASE_ANON_KEY;
  let r;
  try { r = await fetch(API + '/rpc/' + fn, {method:'POST', headers:h, body:JSON.stringify(args)}); }
  catch(e) { throw new Error('Sem conexão. Verifique a internet e tente de novo.'); }
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : null;
  if (!r.ok) {
    if (data && data.code === '28000') { sair(true); }
    throw new Error((data && data.message) || 'Erro ' + r.status);
  }
  return data;
}
function msg(el, text, ok) { $(el).innerHTML = text ? `<div class="msg ${ok?'o':'e'}">${esc(text)}</div>` : ''; }

async function iniciar(){
  try { S.eu = await rpc('he_eu', {p_token:S.token}); }
  catch(e){ return telaLogin(); }
  S.ordem = S.eu.ordem_abatimento || '50_primeiro';
  try { S.f = JSON.parse(store.get('he_filtro')) || null; } catch(e){ S.f = null; }
  if (!S.f || !GRUPOS.includes(S.f.g)) S.f = S.eu.papel === 'admin' ? {g:'I9 MATRIZ', eng:true} : {g:'TODOS', eng:false};
  $('v-login').classList.add('hidden'); $('v-app').classList.remove('hidden');
  const pn = S.eu.nome.split(' ');
  $('u-nome').textContent = window.innerWidth < 640 && pn.length > 2 ? pn[0] + ' ' + pn[pn.length-1] : S.eu.nome;
  $('u-papel').textContent = PAPEL[S.eu.papel] + ' · código ' + S.eu.codigo + (S.eu.superior ? ' · superior: ' + S.eu.superior : '');
  S.mes = S.mes || mesAtual(); $('mes').value = S.mes;
  const tabs = [['minhas','Minhas horas']];
  if (LIDER.includes(S.eu.papel) || S.eu.papel === 'rh') tabs.push(['equipe', S.eu.papel==='rh'?'Pessoas':'Equipe']);
  if (S.eu.papel === 'rh' || S.eu.papel === 'admin') tabs.push(['rh','Fechamento RH']);
  if (S.eu.papel === 'admin' || S.eu.papel === 'rh') tabs.push(['cad','Cadastros']);
  S.tabs = tabs;
  S.tab = S.tab && tabs.some(t=>t[0]===S.tab) ? S.tab : (S.eu.papel==='colaborador' ? 'minhas' : tabs[1]?.[0] || 'minhas');
  await carregar();
}
function pintarAbas(){
  $('tabs').innerHTML = S.tabs.map(([k,t]) => {
    let n = '';
    if (k==='equipe' && S.pend.length) n = `<span class="n">${S.pend.length}</span>`;
    if (k==='cad' && S.nPendCad) n = `<span class="n">${S.nPendCad}</span>`;
    return `<button class="tab ${S.tab===k?'on':''}" data-t="${k}">${t}${n}</button>`;
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.t; carregar(); });
}
async function carregar(){
  $('main').innerHTML = '<div class="loading">Carregando…</div>';
  try {
    const [res, pend] = await Promise.all([
      rpc('he_resumo_mes', {p_token:S.token, p_mes:mesData()}),
      LIDER.includes(S.eu.papel) ? rpc('he_autorizacoes', {p_token:S.token, p_escopo:'pendentes', p_mes:mesData()}) : []
    ]);
    S.resumo = res; S.pend = pend;
    if (S.eu.papel === 'admin') {
      const ps = await rpc('he_admin_pessoas', {p_token:S.token}); S.pessoas = ps;
      S.nPendCad = ps.filter(p=>p.status==='pendente').length;
    }
    pintarAbas();
    document.body.classList.toggle('largo', S.tab === 'rh' || S.tab === 'cad');
    if (S.tab === 'minhas') await vMinhas();
    else if (S.tab === 'equipe') vEquipe();
    else if (S.tab === 'rh') vRH();
    else if (S.tab === 'cad') await vCad();
  } catch(e){ $('main').innerHTML = `<div class="card"><div class="msg e">${esc(e.message)}</div></div>`; }
}

}

/* ── descrição de um dia para o colaborador (só horas) ── */
function linhasDia(d){
  const it = [];
  const f50 = d.he50*1.5, f75 = d.he75*1.75, f100 = d.he100*2;
  if (d.he50)  it.push({t:`Hora extra ${hm(d.he50)} (dia útil, 1ª e 2ª hora)`, v:f50});
  if (d.he75)  it.push({t:`Hora extra ${hm(d.he75)} (${new Date(d.data+'T12:00').getDay()===6?'sábado':'após a 2ª hora'})`, v:f75});
  if (d.he100) it.push({t:`Hora extra ${hm(d.he100)} (domingo/feriado)`, v:f100});
  if (d.desconto && !d.abonado) it.push({t:`Horas a menos no dia (${hm(d.desconto)})`, v:-d.desconto});
  return it;
}
function tagAut(a){
  if (!a) return '';
  if (a.startsWith('autorizada')) return `<span class="tag t-ok">Autorizada</span>`;
  if (a.startsWith('solicitada')) return `<span class="tag t-wait">Aguardando</span>`;
  return '';
}

/* ════ FECHAMENTO RH ════ */
const FAT = {he50:1.5, he75:1.75, he100:2.0};
const ORDENS = {
  '50_primeiro': ['he50','he75','he100'],
  '100_primeiro': ['he100','he75','he50']
};
// Divide o saldo não compensado nas rubricas, conforme a ordem de abatimento.
function rubricas(r, ordem){
  const out = {he50:r.he50, he75:r.he75, he100:r.he100};
  let resto = r.compensado;               // em minutos de hora normal
  if (ordem === 'proporcional') {
    const k = r.normalizado ? 1 - r.compensado / r.normalizado : 0;
    for (const f in out) out[f] = Math.round(out[f] * k);
    return out;
  }
  for (const f of ORDENS[ordem]) {
    const cap = out[f] * FAT[f], uso = Math.min(resto, cap);
    out[f] = Math.round(out[f] - uso / FAT[f]); resto -= uso;
  }
  return out;
}

      he50: p.he50/60*hb*1.5, he75: p.he75/60*hb*1.75, he100: p.he100/60*hb*2.0, not: not/60*hb*0.2
    } : null;
    return {...r, p, not, val, total: val ? val.he50+val.he75+val.he100+val.not : null};

  const linhaRH = c => `<tr class="click" data-r="${calc.indexOf(c)}">

      <div class="st"><div class="l">No ponto (Quark)</div><div class="v">${ps.filter(p=>p.no_quark).length}</div></div>
      <div class="st"><div class="l">Com acesso ativo</div><div class="v">${cont('ativo')}</div></div>
      <div class="st"><div class="l">Sem acesso ainda</div><div class="v">${cont('sem_acesso')}</div></div>
      <div class="st"><div class="l">Sem hora base (RH)</div><div class="v">${ps.filter(p=>p.no_quark&&!p.hora_base).length}</div></div>
      <div class="st"><div class="l">Ativos sem superior</div><div class="v ${ps.filter(p=>p.status==='ativo'&&p.papel==='colaborador'&&!p.superior_id).length?'plus':''}">${ps.filter(p=>p.status==='ativo'&&p.papel==='colaborador'&&!p.superior_id).length}</div><div class="l">nenhum líder vê essas pessoas</div></div>
    </div>
    <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h2 style="margin:0">Pessoas</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${adm?'<button class="btn p s" id="b-conv-ad">+ Convidar</button><button class="btn s" id="b-lote">Convites em lote</button><button class="btn s" id="b-nova">+ Pessoa fora do ponto</button>':''}</div></div>
      ${barraFiltro(baseCad)}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <input class="in" id="busca" placeholder="Buscar nome" style="flex:2 1 220px;margin:0">
        <select class="in" id="f-set" style="flex:1 1 180px;margin:0"><option value="">Todos os setores (${filtrados.length})</option>
          ${setoresPresentes.map(k=>`<option ${S.fSet===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div>
      <div class="tw"><table class="cmp"><thead><tr><th class="l click" data-ord="nome" title="Ordenar por nome">Nome${seta('nome')}</th><th class="l click" data-ord="setor" title="Ordenar por setor">Setor${seta('setor')}</th><th class="l">Função</th><th class="l">Superior</th><th class="l">Acesso</th><th>Hora base</th><th></th></tr></thead>
        <tbody id="t-pes">${ativos.map(p=>`<tr data-n="${esc(p.nome.toLowerCase())}">
          <td class="l">${esc(p.nome)}<div class="sub">código ${p.codigo} · ${esc(p.cargo||p.empresa||'')}${p.matricula?' · mat. '+esc(p.matricula):''}</div></td>
          <td class="l">${p.setor?esc(p.setor):'<span class="tag t-wait">classificar</span>'}</td>
          <td class="l w">${p.status==='ativo'?PAPEL[p.papel]:'—'}</td><td class="l w">${esc(p.superior||'—')}</td>
          <td class="l"><span class="tag ${p.status==='ativo'?'t-ok':p.status==='bloqueado'?'t-no':p.convite_pendente?'t-wait':'t-gray'}">${p.status==='sem_acesso'?(p.convite_pendente?'convite enviado':'sem acesso'):p.status}</span></td>
          <td>${p.hora_base?brl(+p.hora_base):'—'}</td>
          <td><button class="btn s" data-ed="${p.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>
    </div>`;
  document.querySelectorAll('.pend[data-p]').forEach(el => {
    const id = el.dataset.p;
    el.querySelector('[data-apr]').onclick = async () => {
      try { await rpc('he_admin_aprovar', {p_token:S.token, p_pessoa:id, p_papel:el.querySelector('[data-papel]').value, p_superior:el.querySelector('[data-sup]').value || null});
        S.pessoas = null; carregar(); } catch(e){ alertar(e.message); }
    };
    el.querySelector('[data-rej]').onclick = async () => {
      if (!confirm('Recusar este cadastro? A pessoa poderá se cadastrar de novo.')) return;
      try { await rpc('he_admin_acesso', {p_token:S.token, p_pessoa:id, p_acao:'rejeitar'}); S.pessoas = null; carregar(); } catch(e){ alertar(e.message); }
    };
  });
  $('busca').oninput = () => { const q = $('busca').value.toLowerCase();
    document.querySelectorAll('#t-pes tr').forEach(tr => tr.style.display = tr.dataset.n.includes(q) ? '' : 'none'); };
  document.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => editar(ps.find(p=>p.id===b.dataset.ed), opSup, opPap, adm));
  ligarFiltro(vCad);
  $('f-set').onchange = () => { S.fSet = $('f-set').value; vCad(); };
  document.querySelectorAll('th[data-ord]').forEach(th => th.onclick = () => { S.ordCad = th.dataset.ord; vCad(); });
  if ($('b-aprt')) $('b-aprt').onclick = async () => {
    if (!confirm('Aprovar todos os pendentes com a função e o superior indicados no convite?')) return;
    try { const n = await rpc('he_admin_aprovar_todos', {p_token:S.token}); S.pessoas = null; carregar(); } catch(e){ alertar(e.message); }
  };
  if (adm) { $('b-conv-ad').onclick = () => convidar(); $('b-lote').onclick = () => convitesLote(); }
  if (adm) $('b-nova').onclick = () => {
    modal(`<div class="md-h"><h2 style="margin:0">Pessoa fora do ponto</h2><button class="x-btn" data-close>×</button></div>
      <p class="sub">Para quem precisa de acesso mas não aparece no Quark (ex.: RH, coordenação).</p>
      <label>Nome completo</label><input class="in" id="n-nome"><label>Empresa</label><input class="in" id="n-emp" value="I9 ENGENHARIA E TECNOLOGIA LTDA">
      <button class="btn p w" id="n-ok">Adicionar</button><div id="n-m"></div>`);
    $('n-ok').onclick = async () => {
      try { const id = await rpc('he_admin_criar_pessoa', {p_token:S.token, p_nome:$('n-nome').value, p_empresa:$('n-emp').value});
        convidar({id, nome:$('n-nome').value.toUpperCase()}); S.pessoas = null; } catch(e){ msg('n-m', e.message); }
    };
  };
}
function editar(p, opSup, opPap, adm){
  modal(`<div class="md-h"><h2 style="margin:0">${esc(p.nome)}</h2><button class="x-btn" data-close>×</button></div>
    ${adm?`<label>Função</label><select class="in" id="e-pap" ${p.papel==='admin'?'disabled':''}>${p.papel==='admin'?'<option>Administrador</option>':opPap(p.papel)}</select>
    <label>Superior imediato</label><select class="in" id="e-sup">${opSup(p.superior_id)}</select>
    <label>Setor${p.cargo?' <span class="sub">('+esc(p.cargo)+')</span>':''}</label><select class="in" id="e-set"><option value="">— sem setor —</option>
      <optgroup label="Engenharia">${SETORES_ENG.map(x=>`<option ${x===p.setor?'selected':''}>${x}</option>`).join('')}</optgroup>
      <optgroup label="Outras áreas">${SETORES_ADM.map(x=>`<option ${x===p.setor?'selected':''}>${x}</option>`).join('')}</optgroup></select>`:''}
    <div class="row"><div><label>Matrícula</label><input class="in" id="e-mat" value="${esc(p.matricula||'')}"></div>
      <div><label>Hora base (R$)</label><input class="in" id="e-hb" inputmode="decimal" value="${p.hora_base??''}" placeholder="25,00"></div></div>
    <button class="btn p w" id="e-ok">Salvar</button>
    ${adm&&p.status==='sem_acesso'?'<button class="btn ok w" id="e-conv">Gerar convite para esta pessoa</button>':''}
    ${adm&&p.papel!=='admin'?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      ${p.status!=='sem_acesso'?'<button class="btn s" data-ac="resetar">Resetar PIN</button>':''}
      ${p.status==='bloqueado'?'<button class="btn s" data-ac="desbloquear">Desbloquear</button>':'<button class="btn no s" data-ac="bloquear">Bloquear acesso</button>'}</div>`:''}
    <div id="e-m"></div>`);
  if ($('e-conv')) $('e-conv').onclick = () => convidar(p);
  $('e-ok').onclick = async () => {
    const hb = $('e-hb').value.trim().replace(',', '.');
    try { await rpc('he_admin_editar', {p_token:S.token, p_pessoa:p.id,
        p_papel: adm && $('e-pap') && p.papel!=='admin' ? $('e-pap').value : null,
        p_superior: adm ? ($('e-sup').value || null) : p.superior_id,
        p_matricula: $('e-mat').value.trim() || null, p_hora_base: hb ? +hb : null,
        ...(adm ? {p_setor: $('e-set').value || null} : {})});
      fecharModal(); S.pessoas = null; carregar(); } catch(e){ msg('e-m', e.message); }
  };
  document.querySelectorAll('[data-ac]').forEach(b => b.onclick = async () => {
    if (!confirm('Confirmar: ' + b.textContent + '?')) return;
    try { await rpc('he_admin_acesso', {p_token:S.token, p_pessoa:p.id, p_acao:b.dataset.ac}); fecharModal(); S.pessoas = null; carregar(); }
    catch(e){ msg('e-m', e.message); }
  });
}

/* ════ CONVITES ════ */
const NIVEL = {colaborador:0,supervisor:1,coordenador:2,gc:3,rh:3,admin:9};
function papeisConvite(){
  const todos = ['colaborador','supervisor','coordenador','gc','rh'];
  return S.eu.papel === 'admin' ? todos : todos.filter(k => k !== 'rh' && NIVEL[k] < NIVEL[S.eu.papel]);
}
function linkApp(){ return location.href.split('#')[0].split('?')[0]; }
function textoConvite(r){
  return `Olá, ${r.nome.split(' ')[0]}! Seu convite para o app Horas i9 é ${r.convite}. ` +
    `Abra ${linkApp()} e toque em "Tenho um convite". Depois, você entra com o código ${r.codigo} e o PIN que criar.`;
}
function mostrarConvites(lista){
  modal(`<div class="md-h"><h2 style="margin:0">Convites gerados</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">Envie cada convite só para a própria pessoa. Vale por 30 dias e só pode ser usado uma vez.</p>
    ${lista.map((r,i)=>`<div class="pend"><b>${esc(r.nome)}</b>
      <div style="font-size:22px;font-weight:700;letter-spacing:2px;margin:4px 0">${esc(r.convite)}</div>
      <div class="sub">Código de acesso: ${r.codigo}</div>
      <div class="a"><a class="btn ok s" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(textoConvite(r))}">Enviar por WhatsApp</a>
        <button class="btn s" data-cp="${i}">Copiar mensagem</button></div></div>`).join('')
      || '<p class="muted">Nenhum convite gerado (a pessoa já tem acesso?).</p>'}
    <div id="cv-m"></div>`);
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(textoConvite(lista[+b.dataset.cp])); msg('cv-m','Mensagem copiada.',true); }
    catch(e){ msg('cv-m','Não foi possível copiar. Use o botão do WhatsApp.'); }
  });
}
function convidar(pre){
  const pap = papeisConvite();
  const adm = S.eu.papel === 'admin';
  modal(`<div class="md-h"><h2 style="margin:0">Convidar pessoa</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">${adm?'O convite do administrador já libera o acesso.':'Você será o superior imediato. O acesso é liberado depois da aprovação do administrador.'}</p>
    ${pre?`<div class="expl"><b>${esc(pre.nome)}</b></div>`:`<label for="cv-q">Nome (mínimo 3 letras)</label>
      <input class="in" id="cv-q" autocomplete="off" placeholder="Buscar quem ainda não tem acesso"><div id="cv-r" style="margin-top:8px"></div>`}
    <label for="cv-p">Função</label>
    <select class="in" id="cv-p">${pap.map(k=>`<option value="${k}">${PAPEL[k]}</option>`).join('')}</select>
    ${adm?`<label for="cv-s">Superior imediato</label><select class="in" id="cv-s"><option value="">— definir depois —</option>${
      (S.pessoas||[]).filter(p=>p.status==='ativo'&&LIDER.includes(p.papel)).map(l=>`<option value="${l.id}">${esc(l.nome)} (${PAPEL[l.papel]})</option>`).join('')}</select>`:''}
    <button class="btn p w" id="cv-ok" ${pre?'':'disabled'}>Gerar convite</button><div id="cv-m2"></div>`);
  let escolhido = pre ? pre.id : null, t;
  if (!pre) $('cv-q').oninput = () => { clearTimeout(t); t = setTimeout(async () => {
    const q = $('cv-q').value.trim();
    if (q.length < 3) { $('cv-r').innerHTML = ''; return; }
    try {
      const r = await rpc('he_busca_sem_acesso', {p_token:S.token, p_q:q});
      $('cv-r').innerHTML = r.length ? r.map(x=>`<label class="opt" style="margin-bottom:6px"><input type="radio" name="cvp" value="${x.id}">
        <div><b>${esc(x.nome)}</b><span>${esc(x.empresa||'')}${x.convite_pendente?' · já tem convite em aberto (gerar de novo substitui)':''}</span></div></label>`).join('')
        : '<p class="muted">Ninguém sem acesso com esse nome.</p>';
      document.querySelectorAll('input[name=cvp]').forEach(i => i.onchange = () => { escolhido = i.value; $('cv-ok').disabled = false; });
    } catch(e){ msg('cv-m2', e.message); }
  }, 250); };
  $('cv-ok').onclick = async () => {
    if (!escolhido) return;
    try {
      const r = await rpc('he_convidar', {p_token:S.token, p_pessoas:[escolhido], p_papel:$('cv-p').value,
        p_superior: adm ? ($('cv-s').value || null) : null});
      S.pessoas = null; mostrarConvites(r);
    } catch(e){ msg('cv-m2', e.message); }
  };
}
function convitesLote(){
  const sem = (S.pessoas||[]).filter(p => p.status==='sem_acesso' && p.no_quark);
  const emp = [...new Set(sem.map(p=>p.empresa||''))];
  modal(`<div class="md-h"><h2 style="margin:0">Convites em lote</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">Gera um convite para cada colaborador que ainda não tem acesso e baixa uma planilha (CSV) com nome, código e convite, para entregar aos supervisores.</p>
    <label>Empresa</label><select class="in" id="lt-e"><option value="">Todas</option>${emp.map(e=>`<option>${esc(e)}</option>`).join('')}</select>
    <label><input type="checkbox" id="lt-n" checked> Pular quem já tem convite em aberto</label>
    <label>Superior imediato de todos do lote</label><select class="in" id="lt-s"><option value="">— definir depois, pessoa por pessoa —</option>${
      (S.pessoas||[]).filter(p=>p.status==='ativo'&&LIDER.includes(p.papel)).map(l=>`<option value="${l.id}">${esc(l.nome)} (${PAPEL[l.papel]})</option>`).join('')}</select>
    <div class="expl" style="margin-top:10px">Dica: para cada pessoa já ficar ligada ao superior certo, o caminho mais simples é cada líder convidar a própria equipe pelo botão "+ Convidar pessoa" na aba Equipe. Use o lote para quem ficar de fora.</div>
    <p class="sub" id="lt-c" style="margin-top:8px"></p>
    <button class="btn p w" id="lt-ok">Gerar e baixar CSV</button><div id="lt-m"></div>`);
  const alvo = () => sem.filter(p => (!$('lt-e').value || p.empresa===$('lt-e').value) && (!$('lt-n').checked || !p.convite_pendente));
  const conta = () => $('lt-c').textContent = alvo().length + ' pessoa(s) vão receber convite. Os convites valem 30 dias.';
  $('lt-e').onchange = conta; $('lt-n').onchange = conta; conta();
  $('lt-ok').onclick = async () => {
    const ids = alvo().map(p=>p.id); if (!ids.length) return msg('lt-m','Ninguém para convidar.');
    busy($('lt-ok'),true);
    try {
      const r = await rpc('he_convidar', {p_token:S.token, p_pessoas:ids, p_papel:'colaborador', p_superior:$('lt-s').value || null});
      const csv = '﻿' + [['Nome','Código de acesso','Convite','Mensagem'], ...r.map(x=>[x.nome, x.codigo, x.convite, textoConvite(x)])]
        .map(l => l.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
      a.download = `convites_horas_i9_${new Date().toISOString().slice(0,10)}.csv`; a.click();
      msg('lt-m', r.length + ' convites gerados. Guarde o arquivo com cuidado: cada convite dá acesso a uma pessoa.', true);
      S.pessoas = null;
    } catch(e){ msg('lt-m', e.message); busy($('lt-ok'),false); }
  };
}

/* ════ PIN ════ */
$('b-pin').onclick = () => {
  modal(`<div class="md-h"><h2 style="margin:0">Trocar PIN</h2><button class="x-btn" data-close>×</button></div>
    <label>PIN atual</label><input class="in" id="p-a" type="password" inputmode="numeric" maxlength="6">
    <label>Novo PIN (6 números)</label><input class="in" id="p-n" type="password" inputmode="numeric" maxlength="6">
    <button class="btn p w" id="p-ok">Trocar</button><div id="p-m"></div>`);
  $('p-ok').onclick = async () => {
    try { await rpc('he_trocar_pin', {p_token:S.token, p_pin_atual:$('p-a').value, p_pin_novo:$('p-n').value}); msg('p-m','PIN alterado.',true); }
    catch(e){ msg('p-m', e.message); }
  };
};

/* ════ modal ════ */
function modal(html){
  $('modal').innerHTML = `<div class="ov"><div class="md" role="dialog" aria-modal="true">${html}</div></div>`;
  $('modal').querySelector('.ov').onclick = e => { if (e.target.classList.contains('ov')) fecharModal(); };
  $('modal').querySelectorAll('[data-close]').forEach(b => b.onclick = fecharModal);
}
function fecharModal(){ $('modal').innerHTML = ''; }
function alertar(t){ modal(`<div class="md-h"><h2 style="margin:0">Atenção</h2><button class="x-btn" data-close>×</button></div><div class="msg e">${esc(t)}</div>`); }

/* ════ início ════ */
S.token = store.get('he_token');
if (S.token) iniciar(); else telaLogin();
</script>
