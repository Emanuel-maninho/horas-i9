<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22272E">
<title>Horas i9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ── marca i9 ── */
  --i9:#C00000;--i9-deep:#8E0000;--i9-wash:#FBEDED;
  --red:#C00000;--red-d:#8E0000;--red-l:#FBEDED;          /* nomes antigos, mantidos */
  /* ── chapa / tinta ── */
  --graphite:#22272E;--graphite-2:#2E353E;--dark:#22272E;
  --ink:#15181B;--ink2:#424B55;--ink3:#5A6472;--steel:#5A6472;
  /* ── régua e papel ── */
  --rule:#DDE1E6;--rule-soft:#ECEEF1;--line:#DDE1E6;
  --paper:#F2F3F5;--bg:#F2F3F5;--surface:#FFFFFF;--card:#FFFFFF;--wash:#F7F8F9;
  /* ── semânticos ── */
  --ok:#1E6B3A;--ok-l:#E6F1E9;--warn:#8A5A00;--warn-l:#FDF3DF;
  --blueprint:#1D4E89;--blueprint-l:#E8EEF7;
  /* ── forma ── */
  --r-s:6px;--r-m:10px;--r-l:14px;--r:10px;
  --sans:'Barlow','Segoe UI',system-ui,-apple-system,Arial,Helvetica,sans-serif;
  --cond:'Barlow Semi Condensed','Barlow','Segoe UI',system-ui,Arial,Helvetica,sans-serif;
  --sh-pop:0 12px 32px rgba(21,24,27,.18);
  --sh-stick:0 1px 0 var(--rule),0 6px 12px -8px rgba(21,24,27,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(32px + env(safe-area-inset-bottom,0))}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--i9);outline-offset:2px;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* topo — chapa pintada */
.top{background:var(--graphite);color:#fff;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:7px;background:var(--i9);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.01em;flex-shrink:0}
.top-t{flex:1;min-width:0}
.top-t b{display:block;font-size:15px;font-weight:600;letter-spacing:-.005em}
.top-t span{font-size:12.5px;color:#A9B2BD}
.top-a{display:flex;gap:8px;align-items:center}
.top input[type=month]{background:var(--graphite-2);border:1px solid #434C57;color:#fff;border-radius:var(--r-s);padding:6px 8px;font-size:13px;color-scheme:dark;cursor:pointer}
.top input[type=month]::-webkit-calendar-picker-indicator{opacity:1;cursor:pointer;padding:3px;border-radius:3px;background-color:#fff;filter:none;color-scheme:light}
.top input[type=month]::-webkit-calendar-picker-indicator:hover{background-color:#FFD9D9}
.top input[type=month]:focus-visible{outline-color:#fff}
.lnk{background:none;border:1px solid #495360;color:#E6E9ED;border-radius:var(--r-s);padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
.lnk:hover{background:var(--graphite-2);border-color:#5C6775}
.lnk:focus-visible{outline-color:#fff}

/* abas — tira clara, indicador i9 */
.tabs{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.tabs-in{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px 11px;font-size:14px;font-weight:500;color:var(--steel);cursor:pointer;white-space:nowrap;transition:color .12s,border-color .12s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--i9);font-weight:600}
.tab .n{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--i9);color:#fff;font-family:var(--cond);font-size:12px;font-weight:600;line-height:18px;text-align:center;margin-left:6px;vertical-align:1px}

.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:18px;margin-bottom:12px}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
.card>h2:first-child{padding-bottom:9px;border-bottom:1px solid var(--rule-soft);margin-bottom:12px}
h3{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--ink2)}
.sub{font-size:13px;color:var(--steel)}
.muted{color:var(--steel)}

/* formulários */
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
.in{width:100%;border:1px solid #C6CCD3;border-radius:var(--r-s);padding:10px 12px;background:#fff;font-size:16px;transition:border-color .12s,box-shadow .12s}
.in:hover{border-color:#AEB6BF}
.in:focus{outline:0;border-color:var(--i9);box-shadow:0 0 0 3px var(--i9-wash)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #C6CCD3;background:#fff;border-radius:var(--r-s);padding:9px 14px;min-height:40px;cursor:pointer;font-size:14px;font-weight:500;transition:background .12s,border-color .12s}
.btn:hover{background:var(--wash);border-color:#AEB6BF}
.btn.p{background:var(--i9);border-color:var(--i9);color:#fff;font-weight:600}
.btn.p:hover{background:#AD0000;border-color:#AD0000}
.btn.p:active{background:var(--i9-deep);border-color:var(--i9-deep)}
.btn.w{width:100%;margin-top:16px}
.btn.s{padding:6px 11px;font-size:13px;min-height:32px}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok:hover{background:var(--ok-l)}
.btn.no{border-color:var(--i9);color:var(--i9-deep)}
.btn.no:hover{background:var(--i9-wash)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:#fff;border-color:#C6CCD3}
/* manual */
.man details{border:1px solid var(--rule);border-radius:var(--r-m);margin-bottom:10px;background:var(--surface)}
.man summary{cursor:pointer;padding:13px 15px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.man summary::-webkit-details-marker{display:none}
.man summary::after{content:'▾';color:var(--steel);transition:transform .15s}
.man details[open] summary::after{transform:rotate(180deg)}
.man details[open] summary{border-bottom:1px solid var(--rule-soft)}
.man .bd{padding:6px 15px 15px;font-size:14px;line-height:1.6}
.man .bd p{margin:9px 0}
.man .bd ol,.man .bd ul{margin:9px 0 9px 20px;padding:0}
.man .bd li{margin:5px 0}
.man .bd table{font-size:13px;margin:10px 0}
.man .bd td,.man .bd th{white-space:normal;text-align:left;padding:7px 9px}
.man .ui{pointer-events:none;vertical-align:middle;margin:1px 2px}
.man .ui.btn{padding:3px 9px;font-size:12px;min-height:0}
.man .quem{font-family:var(--cond);font-size:12.5px;font-weight:600;color:var(--steel);text-transform:none;letter-spacing:0}
.man .dica{background:var(--wash);border-left:2px solid var(--rule);border-radius:0 var(--r-s) var(--r-s) 0;padding:10px 12px;font-size:13px;margin:10px 0}
.msg{margin-top:12px;font-size:13px;padding:9px 11px;border-radius:var(--r-s)}
.msg.e{background:var(--i9-wash);color:var(--i9-deep)}
.msg.o{background:var(--ok-l);color:var(--ok)}

/* login */
.login{max-width:420px;margin:40px auto;padding:0 16px}
.login .brand{text-align:center;margin-bottom:20px}
.login .brand .logo{margin:0 auto 12px;width:52px;height:52px;font-size:25px;border-radius:10px;color:#fff}
.login .brand b{font-size:21px;font-weight:600;letter-spacing:-.015em}
.switch{text-align:center;margin-top:16px;font-size:14px;color:var(--ink2)}
.switch a{color:var(--i9-deep);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.switch+.switch a{color:var(--steel);font-weight:500}   /* a 2a. linha e' apoio, nao acao */

/* saldo — o mostrador: único objeto escuro da página */
.saldo{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;margin-bottom:16px}
.big{background:var(--graphite);color:#fff;border-radius:var(--r-m);padding:18px 18px 18px 22px;position:relative;overflow:hidden}
.big::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--i9)}
.big .v{font-family:var(--cond);font-size:44px;font-weight:600;line-height:1.02;letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.big .l{font-size:13px;color:#AEB7C1;line-height:1.35}
.big.zero{background:var(--ok)}
.big.zero::before{background:#15491F}
.big.zero .l{color:#CDE4D5}
.st{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:15px}
.st .v{font-family:var(--cond);font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin:2px 0}
.st .l{font-size:12.5px;color:var(--steel);line-height:1.35}
@media(max-width:640px){.saldo{grid-template-columns:1fr 1fr}.big{grid-column:1/-1}.row{grid-template-columns:1fr}}
.note{background:var(--warn-l);color:var(--warn);border-left:2px solid #D9A93C;border-radius:0 var(--r-s) var(--r-s) 0;padding:11px 13px;font-size:13px;margin-bottom:14px}

/* listas de dias */
.day{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule-soft);align-items:flex-start}
.day:last-child{border-bottom:0}
.day.warn{background:var(--warn-l);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:var(--r-s);border-bottom-color:transparent}
.tag.t-sa{background:var(--blueprint-l);color:var(--blueprint)}
.tag.t-inc{background:var(--warn-l);color:var(--warn)}
.sa-wrap{overflow:auto;max-height:70vh;border:1px solid var(--rule);border-radius:var(--r-s)}
.sa-t{border-collapse:separate;border-spacing:0;font-size:12px;width:auto}
.sa-t th,.sa-t td{padding:0;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
.sa-t thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-family:var(--cond);font-size:11px;font-weight:600;text-align:center;padding:5px 0;color:var(--steel);text-transform:none;box-shadow:inset 0 -1px 0 var(--rule)}
.sa-t thead th.fds{background:var(--paper)}
.sa-t .nm{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:7px 12px 7px 8px;min-width:220px;max-width:260px;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;box-shadow:inset -1px 0 0 var(--rule)}
.sa-t thead .nm{z-index:3}
.sa-t td.dd{width:26px;min-width:26px;height:28px;text-align:center;cursor:pointer;border-left:1px solid var(--rule-soft);font-size:13px;font-variant-numeric:tabular-nums}
.sa-t td.dd.fds{background:#FAFBFC}
.sa-t td.dd:hover{background:var(--blueprint-l)}
.sa-t td.dd.on{background:var(--blueprint);color:#fff;font-weight:600}
.sa-t td.dd.busy{opacity:.4}
.sa-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sa-bar .in{margin:0;width:auto;padding:8px 10px;font-size:14px}
.sug{margin-top:8px;font-size:12.5px;background:var(--blueprint-l);color:var(--blueprint);border-radius:var(--r-s);padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day .d{width:52px;flex-shrink:0;text-align:center}
.day .d b{display:block;font-family:var(--cond);font-size:21px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.day .d span{font-size:11.5px;color:var(--steel);text-transform:none}
.day .c{flex:1;min-width:0;font-size:14px}
.day .c .x{font-size:12.5px;color:var(--steel)}
.day .h{font-weight:600;white-space:nowrap;width:72px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.day .hs{white-space:nowrap;width:72px;text-align:right;flex-shrink:0;color:var(--ink2);font-weight:500;font-variant-numeric:tabular-nums}
.day-cab{display:flex;gap:12px;padding:0 0 6px;border-bottom:1px solid var(--rule);font-family:var(--cond);font-size:12px;font-weight:600;color:var(--steel);text-transform:none;letter-spacing:0}
.day-cab span{width:72px;text-align:right;white-space:nowrap;flex-shrink:0}.day-cab span:first-child{flex:1;text-align:left}
.tag.t-aud{background:#EFE6F8;color:#59287F}
.selbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.selbar select{margin:0;width:auto;flex:0 1 260px;padding:8px 10px;font-size:14px}
.selbar .info{font-size:13px;color:var(--ink2)}
.selbar .info b{color:var(--ink);font-weight:600}
td.ck,th.ck{width:34px;text-align:center!important;padding-left:6px!important;padding-right:6px!important}
td.ck input,th.ck input{width:17px;height:17px;cursor:pointer;accent-color:var(--i9)}
tr.sel td{background:var(--i9-wash)}
td.alertas{white-space:normal;min-width:150px}
td.alertas .tag{margin:1px 0}
.gopt{display:flex;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:var(--r-s);padding:11px 12px;margin-bottom:6px;cursor:pointer;min-height:44px;transition:background .12s,border-color .12s}
.gopt:hover{background:var(--wash);border-color:#C6CCD3}
.gopt input{width:17px;height:17px;accent-color:var(--i9)}
.gopt .sub{margin:0}
.card.av.enviado{opacity:.6}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.card.av textarea{resize:vertical;font-family:inherit;line-height:1.5}
@media(max-width:640px){table.resp td.ck{display:block;float:right;width:auto;padding:0}}
.plus{color:var(--i9)}.minus{color:var(--ok)}
/* etiqueta de estado: quase retangular, para não se confundir com o chip de filtro */
.tag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:4px;font-weight:600;vertical-align:1px;white-space:nowrap}
.t-ok{background:var(--ok-l);color:var(--ok)}
.t-wait{background:var(--warn-l);color:var(--warn)}
.t-no{background:var(--i9-wash);color:var(--i9-deep)}
.t-gray{background:#EAECEF;color:var(--steel)}

/* tabelas — a folha de medição */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--cond);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--steel);text-align:right;padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--rule-soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
th.l,td.l{text-align:left}
td.l{font-variant-numeric:normal}
tr.click,th.click{cursor:pointer}
tr.click:hover td{background:var(--wash)}
tr.sel.click:hover td{background:#F6E2E2}   /* hover nao pode apagar a selecao */
tfoot td{font-weight:600;font-size:14px;border-top:2px solid var(--graphite);border-bottom:0;color:var(--ink);padding-top:10px}
.sync{display:flex;flex-direction:column;line-height:1.25;text-align:right;font-size:11.5px;color:#A9B2BD;cursor:help;margin-right:4px}
.sync .r1{font-family:var(--cond);font-size:12.5px;color:#fff}
.sync .r1 b{font-weight:600}
.sync .r2{opacity:.85}
.sync.velho .r1,.sync.velho .r2{color:#FFB3AB}
@media(max-width:640px){.sync{display:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}

.pend{border:1px solid var(--rule);border-radius:var(--r-s);padding:13px;margin-bottom:10px}
.pend .a{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--rule);border-radius:var(--r-s);margin-bottom:8px;cursor:pointer;transition:background .12s,border-color .12s}
.opt:hover{background:var(--wash)}

/* controle de revisão no cabeçalho — mesma lógica de REV. de projeto/RDO */
.rev{font-family:var(--cond);font-size:11.5px;color:#A9B2BD;border:1px solid #495360;border-radius:var(--r-s);padding:3px 7px;cursor:help;white-space:nowrap;letter-spacing:.02em}
.rev b{color:#fff;font-weight:600}
@media(max-width:640px){.rev{display:none}}

/* auditoria de ponto — folha de contato das fotos */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:12px}
.fcard{border:1px solid var(--rule);border-radius:var(--r-s);overflow:hidden;display:flex;flex-direction:column;background:#fff}
.fcard.rev-ok{border-color:var(--ok);background:var(--ok-l)}
.fcard.rev-not{border-color:var(--i9);background:var(--i9-wash)}
.fthumb{width:100%;aspect-ratio:3/4;object-fit:cover;background:#EAECEF;display:block;cursor:zoom-in}
.fthumb.vazia{display:grid;place-items:center;font-size:12px;color:var(--steel);text-align:center;padding:10px}
.fmeta{padding:9px 10px;font-size:12.5px;line-height:1.35;flex:1}
.fmeta b{display:block;font-size:13px;letter-spacing:-.005em;margin-bottom:2px}
.fmeta .q{color:var(--steel);font-size:11.5px}
.fmot{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fobs{color:var(--ink2);font-size:11.5px;line-height:1.3}
.sloc{font-style:italic;opacity:.75}
.fobs:not(:empty){margin-top:6px;padding-left:6px;border-left:2px solid var(--rule)}
.fa{display:flex;gap:6px;padding:0 10px 10px}
.fa .btn{flex:1;padding:6px 8px;font-size:12px}
.flupa{position:fixed;inset:0;background:rgba(17,20,24,.88);display:grid;place-items:center;z-index:90;padding:20px;cursor:zoom-out}
.flupa img{max-width:min(92vw,560px);max-height:88vh;border-radius:var(--r-s)}
.flupa .cap{color:#fff;text-align:center;font-size:13px;margin-top:10px}
.opt input{margin-top:3px;accent-color:var(--i9)}
.opt.on{border-color:var(--i9);background:var(--i9-wash)}
.opt b{display:block;font-size:14px;font-weight:600}
.opt span{font-size:12.5px;color:var(--ink2);font-weight:400}
.opt div{font-weight:400}
.top-t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){
  .wrap{padding:16px 14px}
  .card{padding:14px}
  .top-t{flex-basis:calc(100% - 46px)}
  .top-a{width:100%;justify-content:flex-end}
  /* a tira de abas rola: a máscara avisa que há mais abas à direita */
  .tabs::after{content:'';position:absolute;right:0;top:0;bottom:1px;width:40px;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 62%)}
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tfoot{display:block}
  table.resp tr{display:block;border:1px solid var(--rule);border-radius:var(--r-s);margin-bottom:8px;padding:9px 11px;background:var(--surface)}
  table.resp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 0;white-space:normal}
  table.resp td.l{display:block;text-align:left;padding-bottom:6px;font-weight:600}
  table.resp td[data-l]::before{content:attr(data-l);color:var(--steel);font-size:12.5px;font-weight:500;text-align:left;font-variant-numeric:normal}
  table.resp td:empty{display:none}
  table.resp tfoot td{border-top:0}
}
.expl{font-size:13px;color:var(--ink2);background:var(--wash);border-left:2px solid var(--rule);border-radius:0 var(--r-s) var(--r-s) 0;padding:11px 13px;margin-bottom:14px}

/* modal — o único elemento com elevação de verdade */
.ov{position:fixed;inset:0;background:rgba(21,24,27,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0));box-shadow:var(--sh-pop)}

.loading{padding:36px;text-align:center;color:var(--steel);font-size:14px}

/* filtro de grupo / setor */
.filtro{margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.sub{margin-top:6px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink2);transition:background .12s,border-color .12s,color .12s}
.chip:hover{background:var(--wash);border-color:#C6CCD3}
.chip span{color:var(--steel);font-weight:400;margin-left:3px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--graphite);border-color:var(--graphite);color:#fff;font-weight:600}
.chip.on:hover{background:var(--graphite-2)}
.chip.on span{color:#A9B2BD}
.chips.sub .chip{font-size:12.5px;padding:4px 10px}
/* quebra de seção na tabela: barra i9, não faixa cinza */
tr.grp td{background:var(--surface);text-align:left;font-weight:600;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);padding:14px 10px 7px;cursor:pointer;user-select:none;border-bottom:1px solid var(--rule);box-shadow:inset 2px 0 0 var(--i9)}
tr.grp td:hover{background:var(--wash)}
tr.grp .seta{display:inline-block;width:14px;transition:transform .15s;color:var(--steel)}
tr.grp.fechado .seta{transform:rotate(-90deg)}
.lote{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--warn-l);border:1px solid #E8CF95;border-radius:var(--r-m);padding:9px 11px;margin-bottom:10px;position:sticky;top:0;z-index:5;box-shadow:var(--sh-stick)}
.lote .in{margin:0;width:auto;flex:1 1 200px;padding:8px 10px;font-size:14px}
.grp-acoes{display:flex;gap:6px;justify-content:flex-end;margin:-2px 0 8px}
.lnk2{background:none;border:0;color:var(--steel);font-size:12.5px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:2px 4px;border-radius:3px}
.lnk2:hover{color:var(--ink)}
/* telas largas: tabelas cabem sem rolagem lateral */
body.largo .top-in,body.largo .tabs-in,body.largo .wrap{max-width:1480px}
@media(min-width:900px){
  table.cmp{font-size:13px}
  table.cmp th{padding:6px 6px;font-size:11.5px;white-space:normal;vertical-align:bottom;line-height:1.2}
  table.cmp td{padding:8px 6px}
  table.cmp td.l{white-space:normal}
  table.cmp td.l:first-child{min-width:190px;border-right:1px solid var(--rule-soft)}
  table.cmp th.l:first-child{border-right:1px solid var(--rule)}
  table.cmp td.w{white-space:normal}
}
tr.grp td span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--steel);margin-left:6px;font-variant-numeric:tabular-nums}
@media(max-width:640px){table.resp tr.grp{border:0;padding:12px 2px 2px;margin:12px 0 4px;background:none}table.resp tr.grp td{background:none;display:block;box-shadow:inset 2px 0 0 var(--i9);padding-left:10px}}

/* relatório impresso — layout de documento, preservado */
#print{display:none}

  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-size:11px}

}

<script>
/* ════ CONFIGURAÇÃO ════
   Preencher com os dados do projeto Supabase "I9 Engenharia" (Settings → API).
   Use a chave PUBLISHABLE / anon — nunca a service_role aqui. */
const SUPABASE_URL = 'https://blinftijbpyqduenkcub.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsaW5mdGlqYnB5cWR1ZW5rY3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzU1MDQsImV4cCI6MjA5MjgxMTUwNH0.ODQC6tpe1RKFe78LB6GhinD74iIzWzLQwQbAkJ4BxNM';
const API = (window.HE_API || SUPABASE_URL + '/rest/v1');

/* ════ CONVENÇÃO COLETIVA — 1ª faixa de HE (dia útil, 1ª e 2ª hora) ════
   A partir da competência abaixo (AAAA-MM) o adicional passa de 50% para 52%.
   Competências anteriores continuam a 50%, para não alterar demonstrativos já fechados.
   O banco (função he_resumo_mes / crédito de folga) precisa usar a MESMA regra.
   Out/2026: o RH antecipou o 52% enquanto a convenção estava em homologação — a
   folha de outubro/2026 já saiu toda na rubrica 1.052 "Horas Extras 52%", então a
   vigência aqui é 2026-10 e não 2026-11 (conferido no espelho da folha, 25/11/2026). */
const HE1_VIGENCIA = '2026-10';
const fat50 = (mes) => ((mes || S.mes) >= HE1_VIGENCIA ? 1.52 : 1.5);
const pct50 = (mes) => Math.round((fat50(mes) - 1) * 100) + '%';
const fmtF = f => f.toFixed(2).replace('.', ',');
const hmF = f => hm(60 * f);   // 1,52 → 1h31

/* ════ HORA NOTURNA REDUZIDA — art. 73, §1 da CLT ════
   Entre 22h e 5h, 52min30 de trabalho valem 1 hora. Então as horas noturnas
   REAIS do ponto são multiplicadas por 60/52,5 (+14,29%) para dar a referência
   que vai ao holerite, e o adicional de 20% incide sobre essa referência.
   Confirmado no espelho da folha de out/2026, ao minuto: 1h03 real -> 1,12 de
   referência; 6h07 -> 6,59 (as referências da folha são hh,mm, não decimal).
   Liberado pelo Emanuel em 28/11/2026 — antes disso o painel pagava sobre a hora
   real e ficava ~14% abaixo da folha.
   Só o VALOR usa a redução: as horas mostradas continuam as do ponto. */
const NOT_RED = 60 / 52.5;
const notRef = min => Math.round((min || 0) * NOT_RED);   // minutos reais → minutos de referência

/* ════ utilidades ════ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = m => { m = Math.round(m || 0); const s = m < 0 ? '−' : ''; m = Math.abs(m);
  return s + Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); };
const brl = v => (v < 0 ? '−' : '') + 'R$ ' + Math.abs(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const PAPEL = {colaborador:'Colaborador',supervisor:'Supervisor de campo',coordenador:'Coordenador',gc:'Gestor de Contrato',diretor:'Diretoria',admin:'Administrador'};
/* Quem pode AUTORIZAR hora extra. Diretor NAO entra aqui de proposito: no banco
   ele tambem ficou fora de he__eh_lider_de, entao botao de autorizar apareceria
   na tela e o banco recusaria depois. Diretoria enxerga, nao aprova. */
const LIDER = ['supervisor','coordenador','gc','admin'];
/* Quem ve as abas de gestao. Aqui o diretor entra. */
const CHEFIA = [...LIDER, 'diretor'];

/* ── controle de revisão ──────────────────────────────────────────────────
   Mesma ideia da REV. de um projeto: a data e o que mudou, visivel no
   cabecalho. Entrada nova vai SEMPRE no topo; REV e' a primeira.           */
const REVISOES = [
  ['2026.11.23', 'Motivo escrito quando falta o local da batida, e aviso ao listar todas as batidas'],
  ['2026.11.22', 'Foto sem pessoa como desvio (afirmado por quem revisa), filtro por colaborador e dossiê individual'],
  ['2026.11.21b', 'Sinalização de foto por rosto (tamanho, corte) e fundo escuro; observação escrita na notificação'],
  ['2026.11.21', 'Auditoria de ponto: fotos e locais das batidas (entrada e saída), papel Diretoria'],
  ['2026.11.16', 'Acesso de RH por permissão (acesso_rh), separado do papel'],
  ['2026.11.14', 'Pendências de ponto e fechamento de folha'],
];
const REV = REVISOES[0][0];
/* Funcao administrativa de RH/DP — independente da posicao no organograma.
   O teste de papel==='rh' e' tolerancia de transicao: vale enquanto o banco
   ainda nao migrou. Pode sair depois que a migracao _06/_07 estiver no ar. */
const temRH = p => !!p && (p.acesso_rh === true || p.papel === 'rh' || p.papel === 'admin');
const DIA = ['dom','seg','ter','qua','qui','sex','sáb'];

/* ── grupos de empresa e setores ── */
const SETORES_ENG = ['Gestão de Engenharia','Automação','Elétrica','Mecânica','Planejamento','Projetos','SESMT','Almoxarifado'];
const SETORES_ADM = ['Diretoria','Administrativo','Comercial','Financeiro','DP','RH','Suprimentos','Logística / Frota','TI'];
const SETORES = [...SETORES_ENG, ...SETORES_ADM];
const GRUPOS = ['I9 MATRIZ','I9 FILIAL','FIO FORTE','TODOS'];
function grupo(emp){
  const e = (emp||'').toUpperCase();
  if (/FIO\s*FORTE|FIOFORTE/.test(e)) return 'FIO FORTE';
  if (/\bI9\b/.test(e)) return /\bRJ\b|FILIAL/.test(e) ? 'I9 FILIAL' : 'I9 MATRIZ';
  return 'OUTRAS';
}
const ehEng = p => !p.setor || SETORES_ENG.includes(p.setor);     // sem setor fica visível até ser classificado
const usaFiltro = () => temRH(S.eu);
function filtrar(lista){
  if (!usaFiltro()) return lista;
  return lista.filter(p => (S.f.g === 'TODOS' || grupo(p.empresa) === S.f.g)
    && !(S.f.g === 'I9 MATRIZ' && S.f.eng && !ehEng(p)));
}
function porSetor(lista){
  const m = new Map();
  for (const p of lista) { const k = p.setor || 'Sem setor'; if (!m.has(k)) m.set(k, []); m.get(k).push(p); }
  const ordem = k => k === 'Sem setor' ? 999 : (SETORES.indexOf(k) + 1 || 500);
  return [...m.entries()].sort((a,b) => ordem(a[0]) - ordem(b[0]));
}
function barraFiltro(base){
  if (!usaFiltro()) return '';
  const n = g => g === 'TODOS' ? base.length : base.filter(p => grupo(p.empresa) === g).length;
  const chip = (on, attr, txt) => `<button class="chip ${on?'on':''}" ${attr}>${txt}</button>`;
  const nEng = base.filter(p => grupo(p.empresa) === 'I9 MATRIZ' && ehEng(p)).length;
  return `<div class="filtro">
    <div class="chips">${GRUPOS.filter(g => g === 'TODOS' || n(g)).map(g => chip(S.f.g===g, `data-g="${g}"`,
      `${g==='TODOS'?'Todos':g} <span>${n(g)}</span>`)).join('')}</div>
    ${S.f.g==='I9 MATRIZ'?`<div class="chips sub">${chip(S.f.eng,'data-eng="1"',`Só Engenharia <span>${nEng}</span>`)}${chip(!S.f.eng,'data-eng="0"',`Todos os setores <span>${n('I9 MATRIZ')}</span>`)}</div>`:''}
  </div>`;
}
function ligarFiltro(redesenhar){
  document.querySelectorAll('.filtro [data-g]').forEach(b => b.onclick = () => { S.f.g = b.dataset.g; salvarFiltro(); redesenhar(); });
  document.querySelectorAll('.filtro [data-eng]').forEach(b => b.onclick = () => { S.f.eng = b.dataset.eng === '1'; salvarFiltro(); redesenhar(); });
}
/* líderes possíveis: qualquer pessoa com função de liderança, mesmo antes de ativar o acesso */
function lideresTodos(excluir){
  return (S.pessoas||[]).filter(p => p.status !== 'bloqueado' && LIDER.includes(p.papel) && p.id !== excluir)
    .sort((a,b) => a.nome.localeCompare(b.nome));
}
function opcoesSuperior(sel, excluir, vazio){
  return `<option value="">${vazio||'— sem superior —'}</option>` + lideresTodos(excluir).map(l =>
    `<option value="${l.id}" ${l.id===sel?'selected':''}>${esc(l.nome)} (${PAPEL[l.papel]}${l.status!=='ativo'?' · ainda sem acesso':''})</option>`).join('');
}
function salvarFiltro(){ store.set('he_filtro', JSON.stringify(S.f)); }
/* grupos de setor recolhíveis (estado lembrado por aparelho) */
let FECHADOS = new Set();   /* restaurado do localStorage logo depois de `store` (ver abaixo) */
const salvarFechados = () => store.set('he_fechados', JSON.stringify([...FECHADOS]));
function cabGrupo(chave, cols, rotulo, resumo){
  const f = FECHADOS.has(chave);
  return `<tr class="grp ${f?'fechado':''}" data-grp="${esc(chave)}"><td colspan="${cols}"><span class="seta">▾</span>${esc(rotulo)}<span>${resumo}</span></td></tr>`;
}
const linhaDoGrupo = (chave, html) => html.replace('<tr ', `<tr data-de="${esc(chave)}" ${FECHADOS.has(chave)?'style="display:none" ':''}`);
function ligarGrupos(prefixo, chaves){
  document.querySelectorAll('tr[data-grp]').forEach(tr => tr.onclick = () => {
    const k = tr.dataset.grp, abrir = FECHADOS.has(k);
    abrir ? FECHADOS.delete(k) : FECHADOS.add(k); salvarFechados();
    tr.classList.toggle('fechado', !abrir);
    document.querySelectorAll(`tr[data-de="${CSS.escape(k)}"]`).forEach(l => l.style.display = abrir ? '' : 'none');
  });
  const todos = (fechar) => { chaves.forEach(k => fechar ? FECHADOS.add(k) : FECHADOS.delete(k)); salvarFechados();
    document.querySelectorAll('tr[data-grp]').forEach(tr => tr.classList.toggle('fechado', fechar));
    document.querySelectorAll('tr[data-de]').forEach(l => l.style.display = fechar ? 'none' : ''); };
  if ($(prefixo+'-rec')) $(prefixo+'-rec').onclick = () => todos(true);
  if ($(prefixo+'-exp')) $(prefixo+'-exp').onclick = () => todos(false);
}
const botoesGrupo = p => usaFiltro() ? `<div class="grp-acoes"><button class="lnk2" id="${p}-rec">Recolher todos</button><button class="lnk2" id="${p}-exp">Expandir todos</button></div>` : '';
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
/* restaura os grupos recolhidos SÓ DEPOIS de `store` existir: lá em cima `store` ainda estava
   na zona morta do const, o ReferenceError caía no catch vazio e o estado nunca voltava. */
try { FECHADOS = new Set(JSON.parse(store.get('he_fechados')||'[]')); } catch(e){}

async function rpc(fn, args = {}) {
  const h = {'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY};
  if (!SUPABASE_ANON_KEY.startsWith('sb_publishable_')) h.Authorization = 'Bearer ' + SUPABASE_ANON_KEY;
  let r;
  try { r = await fetch(API + '/rpc/' + fn, {method:'POST', headers:h, body:JSON.stringify(args)}); }
  catch(e) { throw new Error('Sem conexão. Verifique a internet e tente de novo.'); }
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : null;
  if (!r.ok) {
    if (data && data.code === '28000') { sair(true); }
    throw new Error((data && data.message) || 'Erro ' + r.status);
  }
  return data;
}
function msg(el, text, ok) { $(el).innerHTML = text ? `<div class="msg ${ok?'o':'e'}">${esc(text)}</div>` : ''; }
function busy(btn, on) { btn.disabled = on; }

/* ════ estado ════ */
const S = { token:null, eu:null, mes:null, tab:null, resumo:[], pend:[], ordem:'50_primeiro',
  sel:new Set(), grupoId:null, soSel:false, grupos:null, busca:'' };

function mesAtual(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function mesData(){ return S.mes + '-01'; }

/* data AAAA-MM-DD no fuso da operação (America/Sao_Paulo).
   toISOString() devolve a data em UTC: das 21h à meia-noite de Brasília ela já aponta o dia
   seguinte, e os formulários abriam com a data errada justamente no horário de hora extra. */
const FMT_DIA = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit'});
function diaLocal(d){
  const p = {}; for (const x of FMT_DIA.formatToParts(d == null ? new Date() : new Date(d))) p[x.type] = x.value;
  return `${p.year}-${p.month}-${p.day}`;
}

/* ════ LOGIN ════ */
function telaLogin(){
  $('v-app').classList.add('hidden'); $('v-login').classList.remove('hidden');
  const ult = store.get('he_codigo'); if (ult) $('l-cod').value = ult;
}
$('go-cad').onclick = () => { $('f-entrar').classList.add('hidden'); $('f-cad').classList.remove('hidden'); msg('m-cad',''); };
$('go-ent').onclick = () => { $('f-cad').classList.add('hidden'); $('f-entrar').classList.remove('hidden'); };

$('b-entrar').onclick = async () => {
  const cod = $('l-cod').value.replace(/\D/g,''), pin = $('l-pin').value.trim();
  if (!cod) return msg('m-entrar','Informe seu código de acesso.');
  if (!/^\d{6}$/.test(pin)) return msg('m-entrar','O PIN tem 6 números.');
  const b = $('b-entrar'); busy(b,true); msg('m-entrar','');
  try {
    const r = await rpc('he_login', {p_codigo:cod, p_pin:pin});
    if (r.erro) return msg('m-entrar', r.erro);
    if (r.status === 'pendente') return msg('m-entrar','Seu acesso ainda aguarda aprovação.', true);
    S.token = r.token; store.set('he_token', r.token); store.set('he_codigo', cod);
    $('l-pin').value = '';
    await iniciar();
  } catch(e){ msg('m-entrar', e.message); }
  finally { busy(b,false); }
};
$('l-pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('b-entrar').click(); });

const PAP_CONV = {colaborador:'colaborador',supervisor:'supervisor de campo',coordenador:'coordenador',gc:'gestor de contrato'};
$('b-conv').onclick = async () => {
  const c = $('a-conv').value.trim();

    const r = await rpc('he_convite_info', {p_convite:c});

};
$('b-cad').onclick = async () => {
  const p1 = $('c-pin').value, p2 = $('c-pin2').value;
  if (!/^\d{6}$/.test(p1)) return msg('m-cad','O PIN precisa ter 6 números.');
  if (p1 !== p2) return msg('m-cad','Os dois PINs não são iguais.');
  const b = $('b-cad'); busy(b,true); msg('m-cad','');

    const r = await rpc('he_ativar', {p_convite:$('a-conv').value.trim(), p_pin:p1, p_telefone:$('a-tel').value.trim() || null});

      <div style="font-size:44px;font-weight:700;letter-spacing:3px;margin:4px 0">${r.codigo}</div>
      <p class="sub">Anote. Para entrar, use este código e o PIN que você criou.</p>
      ${r.status==='ativo'?'<button class="btn p w" id="b-ir">Entrar agora</button>'
        :'<div class="msg o">Acesso ativado. Você poderá entrar assim que for aprovado.</div>'}`;

};

/* ════ APP ════ */
async function iniciar(){
  try { S.eu = await rpc('he_eu', {p_token:S.token}); }
  catch(e){ return telaLogin(); }
  S.ordem = S.eu.ordem_abatimento || '50_primeiro';
  try { S.f = JSON.parse(store.get('he_filtro')) || null; } catch(e){ S.f = null; }
  if (!S.f || !GRUPOS.includes(S.f.g)) S.f = S.eu.papel === 'admin' ? {g:'I9 MATRIZ', eng:true} : {g:'TODOS', eng:false};
  $('v-login').classList.add('hidden'); $('v-app').classList.remove('hidden');
  const pn = S.eu.nome.split(' ');
  $('u-nome').textContent = window.innerWidth < 640 && pn.length > 2 ? pn[0] + ' ' + pn[pn.length-1] : S.eu.nome;
  $('u-rev').innerHTML = 'REV <b>' + REV + '</b>';
  $('u-rev').title = 'Painel de Horas i9 — histórico de revisões' + '\n\n'
    + REVISOES.map(([v, q]) => v + '  ' + q).join('\n');
  $('u-papel').textContent = PAPEL[S.eu.papel] + (temRH(S.eu) && S.eu.papel !== 'admin' ? ' · RH' : '') + ' · código ' + S.eu.codigo + (S.eu.superior ? ' · superior: ' + S.eu.superior : '');
  S.mes = S.mes || mesAtual(); $('mes').value = S.mes;
  const tabs = [['minhas','Minhas horas']];
  if (CHEFIA.includes(S.eu.papel) || temRH(S.eu)) tabs.push(['equipe', temRH(S.eu)?'Pessoas':'Equipe']);
  if (CHEFIA.includes(S.eu.papel) || temRH(S.eu)) tabs.push(['sa','Sobreaviso']);
  if (CHEFIA.includes(S.eu.papel) || temRH(S.eu)) tabs.push(['pend','Pendências']);
  if (CHEFIA.includes(S.eu.papel) || temRH(S.eu)) tabs.push(['aud','Auditoria']);
  if (temRH(S.eu)) tabs.push(['rh','Fechamento RH']);
  if (temRH(S.eu)) tabs.push(['rhb','Benefícios extras']);
  if (temRH(S.eu)) tabs.push(['av','Avisos']);
  if (temRH(S.eu)) tabs.push(['cad','Cadastros']);
  tabs.push(['man','Manual']);
  S.tabs = tabs;
  S.tab = S.tab && tabs.some(t=>t[0]===S.tab) ? S.tab : (S.eu.papel==='colaborador' && !temRH(S.eu) ? 'minhas' : tabs[1]?.[0] || 'minhas');
  await carregar();
}
/* ── "ponto atualizado em…" logo abaixo das abas ──
   O ponto vem do Quark pela rotina automática; esta linha existe para ninguém
   olhar um número velho achando que é de agora. */
async function pintarSync(){
  const el = $('sync'); if (!el) return;
  let d;
  try { d = await rpc('he_sync_info', {p_token:S.token}); } catch(e){ el.innerHTML = ''; return; }
  if (!d || !d.importado_em) { el.innerHTML = '<span>Ponto ainda não importado.</span>'; return; }
  const q = new Date(d.importado_em), ag = new Date();
  const horas = (ag - q) / 36e5;
  const quando = q.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  const atraso = horas < 1 ? 'agora há pouco'
    : horas < 24 ? 'há ' + Math.round(horas) + 'h'
    : 'há ' + Math.round(horas / 24) + ' dia(s)';
  // o Quark é carregado em dias úteis; mais de ~3 dias sem carga merece atenção
  const velho = horas > 72;
  const dia = d.ultimo_dia ? d.ultimo_dia.slice(8,10) + '/' + d.ultimo_dia.slice(5,7) : '—';
  el.className = 'sync' + (velho ? ' velho' : '');
  el.title = `O ponto deste app vem do Quark. Última carga: ${quando} (${atraso}).\n`
    + `Último dia com marcação importada: ${dia}.\n`
    + (velho ? 'Faz mais de 3 dias — confira se a rotina automática rodou antes de comparar com o Quark.'
             : 'Comparando com o Quark, qualquer batida lançada depois deste horário ainda não está aqui.');
  el.innerHTML = `<span class="r1">ponto até <b>${dia}</b></span>`
    + `<span class="r2">sincronizado ${esc(quando)}${velho ? ' ⚠' : ''}</span>`;
}

function pintarAbas(){
  $('tabs').innerHTML = S.tabs.map(([k,t]) => {
    let n = '';
    if (k==='equipe' && S.pend.length) n = `<span class="n">${S.pend.length}</span>`;
    if (k==='cad' && S.nPendCad) n = `<span class="n">${S.nPendCad}</span>`;
    return `<button class="tab ${S.tab===k?'on':''}" data-t="${k}">${t}${n}</button>`;
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.t; carregar(); });
}
async function carregar(){
  $('main').innerHTML = '<div class="loading">Carregando…</div>';
  try {
    const [res, pend] = await Promise.all([
      rpc('he_resumo_mes', {p_token:S.token, p_mes:mesData()}),
      LIDER.includes(S.eu.papel) ? rpc('he_autorizacoes', {p_token:S.token, p_escopo:'pendentes', p_mes:mesData()}) : []
    ]);
    S.resumo = res; S.pend = pend;
    if (S.tab === 'equipe') S.grupos = await rpc('he_grupos', {p_token:S.token}).catch(() => null);  // null = banco ainda sem o 09
    if (S.eu.papel === 'admin') {
      const ps = await rpc('he_admin_pessoas', {p_token:S.token}); S.pessoas = ps;
      S.nPendCad = ps.filter(p=>p.status==='pendente').length;
    }
    pintarAbas();
    pintarSync();
    document.body.classList.toggle('largo', ['rh','cad','rhb','pend','aud'].includes(S.tab));
    if (S.tab === 'minhas') await vMinhas();
    else if (S.tab === 'equipe') vEquipe();
    else if (S.tab === 'rh') vRH();
    else if (S.tab === 'rhb') await vRHBen();
    else if (S.tab === 'pend') await vPendencias();
    else if (S.tab === 'aud') await vAuditoria();
    else if (S.tab === 'cad') await vCad();
    else if (S.tab === 'sa') await vSobreaviso();
    else if (S.tab === 'av') await vAvisos();
    else if (S.tab === 'man') $('main').innerHTML = manualHTML(S.eu.papel, temRH(S.eu));
  } catch(e){ $('main').innerHTML = `<div class="card"><div class="msg e">${esc(e.message)}</div></div>`; }
}
$('mes').onchange = () => { S.mes = $('mes').value || mesAtual(); carregar(); };
function sair(silencioso){
  if (S.token && !silencioso) rpc('he_sair', {p_token:S.token}).catch(()=>{});
  S.token = null; S.eu = null; store.del('he_token'); telaLogin();
}
$('b-sair').onclick = () => sair(false);

/* ── descrição de um dia para o colaborador (só horas) ── */
function linhasDia(d){
  const it = [];
  const f50 = d.he50*fat50(d.data.slice(0,7)), f75 = d.he75*1.75, f100 = d.he100*2;
  if (d.he50)  it.push({t:`Hora extra ${hm(d.he50)} (dia útil, 1ª e 2ª hora)`, v:f50, r:d.he50});
  if (d.he75)  it.push({t:`Hora extra ${hm(d.he75)} (${new Date(d.data+'T12:00').getDay()===6?'sábado':'após a 2ª hora'})`, v:f75, r:d.he75});
  if (d.he100) it.push({t:`Hora extra ${hm(d.he100)} (domingo/feriado)`, v:f100, r:d.he100});
  if (d.desconto && !d.abonado) it.push({t:`Horas a menos no dia (${hm(d.desconto)})`, v:-d.desconto});
  return it;
}
/* marcadores do dia: acionamento, descanso, sobreaviso, ponto incompleto */
function extrasDia(d){
  const x = [];
  if (d.acion_min) x.push(`<span class="tag t-sa">Acionamento de sobreaviso ${esc(d.acion_txt||'')} · ${hm(d.acion_min)} de HE</span>`);
  if (d.descanso_ate) x.push(`<span class="tag t-gray">Descanso de 11h até ${d.descanso_ate.slice(11,16)}</span>`);
  if (d.sa_noite) x.push(`<span class="tag t-sa">🌙 Sobreaviso ${hm(d.sa_min)}</span>`);
  if (d.incompleto) x.push(`<span class="tag t-inc">⚠ ${d.incompleto==='sem marcação'?'Sem marcação':'Ponto incompleto'}</span>`);
  if (d.aud_tol) x.push(`<span class="tag t-aud" title="Marcações dentro da tolerância do RH (até 5 min por marcação, 10 min no dia, almoço cumprido), mas o Quark apontou ${hm(d.aud_tol)} de HE.">⚠ Auditar Quark – erro de tolerância</span>`);
  return x.join(' ');
}
const diaRelevante = d => linhasDia(d).length || d.autorizacao || d.sa_noite || d.incompleto || d.acion_min || d.sugestao;
const cabDias = () => '<div class="day-cab"><span>Dia</span><span>HE feita</span><span>Vira folga</span></div>';
function diaHTML(d, extra){
  const it = linhasDia(d);
  return `<div class="day ${d.incompleto?'warn':''}"><div class="d"><b>${d.data.slice(8)}</b><span>${DIA[new Date(d.data+'T12:00').getDay()]}</span></div>
    <div class="c">${it.map(i=>`<div>${esc(i.t)}</div>`).join('')}
      <div class="x">${esc(d.batidas||'sem marcação')} ${tagAut(d.autorizacao)}${!d.autorizacao&&!d.aud_tol&&(d.he50+d.he75+d.he100-(d.acion_min||0))>0?' <span class="tag t-no">Sem autorização</span>':''} ${extrasDia(d)}</div>
      ${d.observacao?`<div class="x">${esc(d.observacao)}</div>`:''}${extra||''}</div>
    <div class="hs">${it.map(i=>`<div>${i.r?hm(i.r):'&nbsp;'}</div>`).join('')}</div>
    <div class="h">${it.map(i=>`<div class="${i.v>0?'plus':'minus'}">${i.v>0?'+':''}${hm(i.v)}</div>`).join('')}</div></div>`;
}
/* `a` é o string_agg do he_dias ("autorizada 17:30–19:30", podendo ter mais de um
   registro no mesmo dia). Testa por registro, não só o primeiro, e a negativa
   entra desde a migração _24 — antes ela nem saía do banco. */
function tagAut(a){
  if (!a) return '';
  if (/(^|, )autorizada/.test(a)) return `<span class="tag t-ok">Autorizada</span>`;
  if (/(^|, )negada/.test(a))     return `<span class="tag t-no">HE não autorizada</span>`;
  if (/(^|, )solicitada/.test(a)) return `<span class="tag t-wait">Aguardando</span>`;
  return '';
}

/* ── formulário de HE (pedido próprio, autorização direta ou NÃO autorização) ──
   o = {negar, data, volta}. O painel nasceu só para autorizar ANTES, com pedido
   do colaborador; na prática a hora é feita primeiro e o líder decide depois —
   por isso existe o lado negativo (migrações _24/_25). Negar NÃO apaga hora: o
   robô leva o dia ao Quark como "Não aprovado" e a justificativa de lá sai com o
   nome do líder, as horas como estavam e o texto que ele escreveu. */
function formHE(pessoa, o){
  o = o || {};
  const neg = !!o.negar;
  modal(`<div class="md-h"><h2 style="margin:0">${neg?'Não autorizar HE':pessoa?'Autorizar HE':'Solicitar hora extra'}</h2><button class="x-btn" data-close>×</button></div>
    ${pessoa?`<p class="sub">${esc(pessoa.nome)}</p>`:'<p class="sub">Seu superior imediato recebe o pedido para autorizar.</p>'}
    ${neg?`<div class="expl">A hora já foi feita, então ela <b>continua contando como está no ponto</b> — negar aqui não apaga hora de ninguém.
      O que fica registrado é a sua decisão, e o robô leva o dia ao Quark como <b>Não aprovado</b>, com uma justificativa que vai com
      o seu nome, as horas como estavam hoje e o motivo que você escrever. Daí para frente são dois caminhos: o colaborador pede
      inclusão de ponto e o dia deixa de gerar HE, ou o RH não paga e anexa esta negativa. O horário abaixo é só referência do
      registro — o Quark decide o dia inteiro.</div>`:''}
    <label for="h-data">Data</label><input class="in" type="date" id="h-data" value="${o.data || diaLocal()}">
    <div class="row"><div><label for="h-ini">Início${neg?'':' previsto'}</label><input class="in" type="time" id="h-ini" value="17:30"></div>
      <div><label for="h-fim">Fim${neg?'':' previsto'}</label><input class="in" type="time" id="h-fim" value="19:30"></div></div>
    <label for="h-mot">Motivo${neg?' da não autorização':''}</label><textarea class="in" id="h-mot" rows="3" placeholder="${neg?'Ex.: ficou sem combinar antes; o serviço não exigia passar das 17h30':'Ex.: parada programada do cliente, nota 4560795'}"></textarea>
    ${neg?'<p class="sub">Este texto vai inteiro para a justificativa no Quark (máx. 500 caracteres lá). Escreva pensando em quem for ler meses depois.</p>':''}
    <button class="btn ${neg?'no':'p'} w" id="h-ok">${neg?'Não autorizar':pessoa?'Autorizar':'Enviar pedido'}</button><div id="h-m"></div>`);
  $('h-ok').onclick = async () => {
    const a = {p_token:S.token, p_data:$('h-data').value, p_inicio:$('h-ini').value, p_fim:$('h-fim').value, p_motivo:$('h-mot').value.trim()};
    if (!a.p_data || !a.p_inicio || !a.p_fim) return msg('h-m','Preencha data e horários.');
    if (!a.p_motivo) return msg('h-m', neg?'Informe o motivo. O Quark exige justificativa para não aprovar.':'Informe o motivo.');
    busy($('h-ok'),true);
    try {
      if (neg)          await rpc('he_nao_autorizar',    {...a, p_pessoa:pessoa.pessoa_id});
      else if (pessoa)  await rpc('he_autorizar_direto', {...a, p_pessoa:pessoa.pessoa_id});
      else              await rpc('he_solicitar', a);
      fecharModal();
      const pr = carregar();
      if (o.volta && pessoa) pr.then(() => detalhe(S.resumo.find(r=>r.pessoa_id===pessoa.pessoa_id) || pessoa));
    } catch(e){ msg('h-m', e.message); busy($('h-ok'),false); }
  };
}

/* ════ EQUIPE ════ */
const mesmoConj = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
function vEquipe(){
  const base = S.resumo.filter(r => r.pessoa_id !== S.eu.id);
  const eq = filtrar(base);
  const naSel = r => S.sel.has(r.pessoa_id);
  const selEq = eq.filter(naSel);
  const alvo = selEq.length ? selEq : eq;                       // indicadores: seleção ou equipe toda

  const linhaEq = r => `<tr class="click ${naSel(r)?'sel':''}" data-i="${eq.indexOf(r)}" data-n="${esc(r.nome.toLowerCase())}">

  const corpo = usaFiltro()
    ? porSetor(lista).map(([k,ps]) => cabGrupo('eq:'+k, 7, k, `${ps.length} pessoas · folga gerada ${hm(ps.reduce((s,r)=>s+r.normalizado,0))} · a tirar ${hm(ps.reduce((s,r)=>s+r.saldo,0))}`) + ps.map(r => linhaDoGrupo('eq:'+k, linhaEq(r))).join('')).join('')
    : lista.map(linhaEq).join('');
  const tot = k => alvo.reduce((s,r)=>s+(r[k]||0),0);
  const heFeitas = alvo.reduce((s,r)=>s+r.he50+r.he75+r.he100,0);
  const semAut = tot('dias_sem_aut'), aud = tot('aud_dias'), negados = tot('dias_negados');
  const selbar = `<div class="selbar">
      ${S.grupos && S.grupos.length?`<select class="in" id="g-sel" aria-label="Grupo"><option value="">${temRH(S.eu)?'Todas as pessoas':'Toda a equipe'}</option>
        ${S.grupos.map(x=>`<option value="${x.id}" ${x.id===S.grupoId?'selected':''}>${esc(x.nome)} (${x.pessoas.length})</option>`).join('')}</select>`:''}
      ${selEq.length?`<span class="info">Indicadores de <b>${selEq.length}</b> de ${eq.length} pessoas${g?` · grupo <b>${esc(g.nome)}</b>${alterado?' (alterado)':''}`:''}</span>
        <label class="info" style="display:flex;gap:5px;align-items:center;margin:0"><input type="checkbox" id="g-so" ${S.soSel?'checked':''}> só os selecionados na tabela</label>
        ${S.grupos?(g?`${alterado?'<button class="btn p s" id="g-upd">Salvar alterações no grupo</button>':''}<button class="btn s" id="g-ren">Renomear</button><button class="btn s" id="g-new">Salvar como novo grupo</button>${S.grupos.length>1?'<button class="btn s" id="g-add">Adicionar a outro grupo</button>':''}<button class="btn no s" id="g-del">Excluir grupo</button>`
          :`${S.grupos.length?'<button class="btn p s" id="g-add">Adicionar a um grupo</button><button class="btn s" id="g-new">Criar novo grupo</button>':'<button class="btn p s" id="g-new">Salvar como grupo</button>'}`):''}
        <button class="lnk2" id="g-clr">Limpar seleção</button>`

  $('main').innerHTML = `

    ${S.pend.length?`<div class="card"><h2>Pedidos para decidir (${S.pend.length})</h2>
      ${S.pend.map(p=>`<div class="pend"><b>${esc(p.nome)}</b>
        <div>${new Date(p.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})} · ${p.inicio.slice(0,5)}–${p.fim.slice(0,5)}</div>
        <div class="sub">${esc(p.motivo)} ${p.antecedencia_horas<0?'<span class="tag t-no">Pedido depois do início</span>':''}</div>
        <div class="a"><button class="btn ok s" data-dec="autorizada" data-id="${p.id}">Autorizar</button>
          <button class="btn no s" data-dec="negada" data-id="${p.id}">Negar</button></div></div>`).join('')}</div>`:''}
    ${selbar}
    <div class="kpis">
      <div class="st"><div class="l">Pessoas com HE no mês</div><div class="v">${alvo.filter(r=>r.normalizado>0).length}</div><div class="l">de ${alvo.length}${selEq.length?' selecionadas':''}</div></div>
      <div class="st"><div class="l">HE feitas (sem fator)</div><div class="v">${hm(heFeitas)}</div><div class="l">horas reais além da jornada</div></div>
      <div class="st"><div class="l">Folga gerada</div><div class="v">${hm(tot('normalizado'))}</div><div class="l">≈ ${(tot('normalizado')/528).toFixed(1).replace('.',',')} dias de 8h48</div></div>
      <div class="st"><div class="l">Folga ainda a tirar</div><div class="v plus">${hm(tot('saldo'))}</div></div>
      <div class="st"><div class="l">Dias com HE sem autorização</div><div class="v ${semAut?'plus':''}">${semAut}</div>${aud?`<div class="l">+ ${aud} dia${aud>1?'s':''} para auditar no Quark</div>`:''}${negados?`<div class="l">+ ${negados} já decidido${negados>1?'s':''} como HE não autorizada</div>`:''}</div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <h2 style="margin:0">${temRH(S.eu)?'Pessoas':'Minha equipe'} no mês</h2>
      ${LIDER.includes(S.eu.papel)?'<button class="btn p s" id="b-conv-eq">+ Convidar pessoa</button>':''}</div>
      <p class="sub" style="margin-bottom:8px">Toque em uma pessoa para ver os dias${LIDER.includes(S.eu.papel)?' e autorizar HE':''}. Use as caixinhas para selecionar.</p>
      ${eq.length>12?`<input class="in" id="b-eq" placeholder="Buscar nome" style="margin-bottom:10px" value="${esc(S.busca)}">`:''}
      ${botoesGrupo('ge')}
      <div class="tw"><table class="resp">
        <thead><tr><th class="ck"><input type="checkbox" id="ck-all" title="Marcar/desmarcar todos os que aparecem" aria-label="Selecionar todos"></th><th class="l">Nome</th><th>HE feitas</th><th>Folga gerada</th><th>Compensado</th><th>Saldo</th><th class="l">Alertas</th></tr></thead>
        <tbody>${corpo}</tbody></table></div>
      ${eq.length?'':'<p class="muted">Ninguém da equipe aprovado ainda. As pessoas aparecem aqui quando o cadastro delas indicar você como superior.</p>'}
    </div>`;
  const redesenhar = () => { const y = scrollY; vEquipe(); scrollTo(0, y); };
  document.querySelectorAll('[data-dec]').forEach(b => b.onclick = async () => {
    try { await rpc('he_decidir', {p_token:S.token, p_id:+b.dataset.id, p_status:b.dataset.dec}); carregar(); } catch(e){ alertar(e.message); }
  });
  document.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = ev => { if (!ev.target.closest('td.ck')) detalhe(eq[+tr.dataset.i]); });
  document.querySelectorAll('td.ck').forEach(td => td.onclick = ev => { ev.stopPropagation(); if (ev.target.tagName !== 'INPUT') td.querySelector('input').click(); });
  document.querySelectorAll('[data-ck]').forEach(c => c.onchange = () => { c.checked ? S.sel.add(c.dataset.ck) : S.sel.delete(c.dataset.ck); redesenhar(); });
  const visiveis = () => [...document.querySelectorAll('tr[data-i]')].filter(tr => tr.style.display !== 'none').map(tr => tr.querySelector('[data-ck]').dataset.ck);
  const ckAll = $('ck-all'), vis = visiveis();
  ckAll.checked = vis.length > 0 && vis.every(id => S.sel.has(id));

  if ($('g-upd')) $('g-upd').onclick = () => salvarGrupo(g.id, g.nome);

      S.grupoId = null; S.sel = new Set(); S.soSel = false; redesenhar(); } catch(e){ alertar(e.message); } };
  if ($('b-conv-eq')) $('b-conv-eq').onclick = () => convidar();
  const buscar = () => { const q = S.busca.toLowerCase();
    document.querySelectorAll('tr[data-i]').forEach(tr => tr.style.display = tr.dataset.n.includes(q) ? '' : 'none');
    document.querySelectorAll('tr.grp').forEach(tr => tr.style.display = q ? 'none' : '');

  if ($('b-eq')) { $('b-eq').oninput = () => { S.busca = $('b-eq').value; buscar(); }; if (S.busca) buscar(); }
  ligarFiltro(vEquipe);
  ligarGrupos('ge', porSetor(lista).map(([k]) => 'eq:'+k));
}
/* adicionar a seleção a um grupo existente (opcional: mover, tirando dos outros grupos) */
function addAoGrupo(exceto){
  const sel = [...S.sel];
  const nomeDe = id => (S.resumo.find(r => r.pessoa_id === id) || {}).nome || '';
  const ops = S.grupos.filter(x => x.id !== exceto);
  modal(`<div class="md-h"><h2 style="margin:0">Adicionar a um grupo</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">${sel.length===1?esc(nomeDe(sel[0])):sel.length+' pessoas selecionadas'}. Escolha o grupo:</p>
    ${ops.map((x,i) => { const novos = sel.filter(id => !x.pessoas.includes(id)).length;
      return `<label class="gopt"><input type="radio" name="gdest" value="${x.id}" ${i===0?'checked':''}>
        <div><b>${esc(x.nome)}</b><div class="sub">${x.pessoas.length} pessoa${x.pessoas.length===1?'':'s'} · ${novos?`entra${novos>1?'m':''} ${novos}`:'todos já estão no grupo'}</div></div></label>`; }).join('')}
    <label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0 4px;font-weight:400">
      <input type="checkbox" id="g-mov" style="margin-top:3px">
      <span><b>Mover</b>: tirar ${sel.length===1?'essa pessoa':'essas pessoas'} dos outros grupos<br><span class="sub">Deixe desmarcado se a pessoa pode estar em mais de um grupo (ex.: atende dois contratos).</span></span></label>
    <button class="btn p w" id="g-ok">Adicionar</button><div id="g-m"></div>`);
  $('g-ok').onclick = async () => {
    const dest = S.grupos.find(x => String(x.id) === (document.querySelector('[name=gdest]:checked')||{}).value);
    if (!dest) return msg('g-m', 'Escolha um grupo.');
    busy($('g-ok'), true);
    try {
      const juntos = [...new Set([...dest.pessoas, ...sel])];
      await rpc('he_grupo_salvar', {p_token:S.token, p_id:dest.id, p_nome:dest.nome, p_pessoas:juntos});
      const vazios = [];
      if ($('g-mov').checked) for (const x of S.grupos) {
        if (x.id === dest.id || !x.pessoas.some(id => S.sel.has(id))) continue;
        const resto = x.pessoas.filter(id => !S.sel.has(id));
        if (!resto.length) { vazios.push(x.nome); continue; }
        await rpc('he_grupo_salvar', {p_token:S.token, p_id:x.id, p_nome:x.nome, p_pessoas:resto});
      }
      S.grupos = await rpc('he_grupos', {p_token:S.token});
      const g2 = S.grupos.find(x => x.id === dest.id);
      S.grupoId = dest.id; S.sel = new Set(g2 ? g2.pessoas : juntos); S.soSel = true;
      fecharModal(); vEquipe();
      if (vazios.length) alertar(`O grupo ${vazios.join(', ')} ficaria vazio, então não foi alterado. Se não precisar mais dele, escolha-o no menu e use "Excluir grupo".`);
    } catch(e){ msg('g-m', e.message); busy($('g-ok'), false); }
  };
}
/* grupos salvos: nome (novo ou renomear) e gravação */
function nomeGrupo(g, atual){
  modal(`<div class="md-h"><h2 style="margin:0">${g?'Renomear grupo':'Salvar grupo'}</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">${S.sel.size} pessoa${S.sel.size>1?'s':''} selecionada${S.sel.size>1?'s':''}. Só você vê seus grupos.</p>
    <label for="gn">Nome do grupo</label><input class="in" id="gn" maxlength="60" value="${esc(atual)}" placeholder="Ex.: Contrato CESAN Norte">
    <button class="btn p w" id="gn-ok">Salvar</button><div id="gn-m"></div>`);
  $('gn').focus();
  $('gn-ok').onclick = () => salvarGrupo(g ? g.id : null, $('gn').value.trim(), 'gn-m', g ? g.pessoas : null);
  $('gn').onkeydown = e => { if (e.key === 'Enter') $('gn-ok').click(); };
}
async function salvarGrupo(id, nome, el, pessoas){
  if (!nome) return el ? msg(el, 'Dê um nome ao grupo.') : null;
  try {
    const nid = await rpc('he_grupo_salvar', {p_token:S.token, p_id:id, p_nome:nome, p_pessoas:pessoas || [...S.sel]});
    S.grupos = await rpc('he_grupos', {p_token:S.token}); S.grupoId = nid; S.soSel = true; if (pessoas) S.sel = new Set(pessoas);
    fecharModal(); vEquipe();
  } catch(e){ el ? msg(el, e.message) : alertar(e.message); }
}
async function detalhe(p){

          <button class="btn s" data-sug="${d.data}|${d.sugestao}">Registrar acionamento</button></div>`:'')

      ${ev.length?cabDias():''}${ev.map(d=>diaHTML(d, extraDia(d))).join('')||'<p class="muted">Nada neste mês.</p>'}

      <h3 style="margin-top:14px">Autorizações e negativas do mês</h3>
      ${minhas.map(a=>`<div class="pend"><b>${a.data.split('-').reverse().slice(0,2).join('/')} · ${a.inicio.slice(0,5)}–${a.fim.slice(0,5)}</b>
        <span class="tag ${a.status==='autorizada'?'t-ok':a.status==='negada'?'t-no':a.status==='solicitada'?'t-wait':'t-gray'}">${a.status==='negada'?'não autorizada':a.status}</span>

          a.quark_espelhado_em?'Consta no Quark como não aprovada desde '+a.quark_espelhado_em.slice(8,10)+'/'+a.quark_espelhado_em.slice(5,7)+'.'
          :a.quark_erro?'<span class="tag t-no">não chegou ao Quark</span> '+esc(a.quark_erro)
          :'<span class="tag t-wait">aguardando o robô levar ao Quark</span>'}</div>`:''}
        ${podeAut&&(a.status==='autorizada'||a.status==='negada')?`<div class="a"><button class="btn s" data-dcx="${a.id}">Cancelar decisão</button></div>`:''}

    if (podeAut) {

      document.querySelectorAll('[data-dok]').forEach(b => b.onclick = () => formHE(p, {volta:true, data:b.dataset.dok}));

        catch(e){ msg('d-m', e.message); } });
      document.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => {
        const [noite, ini, fim] = b.dataset.sug.split('|'); formAcion(p, {noite, ini, fim}); });
      document.querySelectorAll('[data-acx]').forEach(b => b.onclick = async () => {
        if (!confirm('Excluir este acionamento? As horas voltam a ser calculadas como no ponto.')) return;
        try { await rpc('he_acionamento_excluir', {p_token:S.token, p_id:+b.dataset.acx}); carregar().then(()=>detalhe(p)); }
        catch(e){ msg('d-m', e.message); } });
    }
    $('b-imp').onclick = () => imprimir(p, dias, minhas);
    document.querySelectorAll('[data-imps]').forEach(b => b.onclick = async () => {
      const id = b.dataset.imps, v = document.querySelector(`[data-imp="${id}"]`).value;
      try { await rpc('he_registrar_impacto', {p_token:S.token, p_id:+id, p_impacto:v}); msg('d-m','Impacto salvo.',true); }
      catch(e){ msg('d-m', e.message); }
    });
  } catch(e){ modal(`<div class="msg e">${esc(e.message)}</div>`); }
}

/* ── acionamento de sobreaviso (líder) ── */
function formAcion(p, pre){
  pre = pre || {};
  const ontem = diaLocal(Date.now()-864e5);
  const noite = pre.noite || ontem;
  const prox = d => new Date(new Date(d+'T12:00').getTime()+864e5).toISOString().slice(0,10);
  modal(`<div class="md-h"><h2 style="margin:0">Acionamento de sobreaviso</h2><button class="x-btn" data-close>×</button></div>
    <p class="sub">${esc(p.nome)}</p>
    <div class="expl">O tempo do acionamento vira hora extra do dia da escala (somando às HE daquele dia) e para de contar como sobreaviso. No dia seguinte, a jornada fica abonada até 11h depois do fim do acionamento.</div>
    <label for="ac-noite">Noite de sobreaviso (dia da escala)</label><input class="in" type="date" id="ac-noite" value="${noite}">
    <div class="row"><div><label for="ac-ini">Início</label><input class="in" type="datetime-local" id="ac-ini" value="${pre.ini || prox(noite)+'T00:00'}"></div>
      <div><label for="ac-fim">Fim</label><input class="in" type="datetime-local" id="ac-fim" value="${pre.fim || prox(noite)+'T02:00'}"></div></div>
    <label for="ac-mot">Motivo</label><textarea class="in" id="ac-mot" rows="2" placeholder="Ex.: falha na bomba 2 da EE Carapina, OS 4560795"></textarea>
    <button class="btn p w" id="ac-ok">Registrar acionamento</button><div id="ac-m"></div>`);
  $('ac-ok').onclick = async () => {
    const ini = $('ac-ini').value, fim = $('ac-fim').value;
    if (!$('ac-noite').value || !ini || !fim) return msg('ac-m','Preencha a noite, o início e o fim.');
    busy($('ac-ok'), true);
    try {
      await rpc('he_acionamento_registrar', {p_token:S.token, p_pessoa:p.pessoa_id, p_noite:$('ac-noite').value,
        p_inicio:ini.replace('T',' '), p_fim:fim.replace('T',' '), p_motivo:$('ac-mot').value.trim()});
      await carregar(); detalhe((S.resumo.find(r=>r.pessoa_id===p.pessoa_id))||p);
    } catch(e){ msg('ac-m', e.message); busy($('ac-ok'), false); }
  };
}

/* ── relatório individual para impressão / PDF ──
   Valores em R$ só aparecem quando o banco devolve hora_base (RH e administrador). */
function imprimir(p, dias, auts){
  let mesTxt = new Date(S.mes+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  mesTxt = mesTxt.charAt(0).toUpperCase() + mesTxt.slice(1);
  const dt = s => s.split('-').reverse().join('/');
  const ev = dias.filter(d => d.he50||d.he75||d.he100||d.noturna||d.hn||(d.desconto&&!d.abonado)||d.sa_noite);
  const obsDia = d => [d.acion_min?`Acionamento de sobreaviso ${d.acion_txt} (${hm(d.acion_min)} de HE)`:'',
    d.sa_noite?`Sobreaviso ${hm(d.sa_min)}`:'', d.descanso_ate?`Descanso de 11h até ${d.descanso_ate.slice(11,16)}`:'', d.observacao||'']
    .filter(Boolean).join(' · ');
  const sa = p.sa_min || 0;
  const hb = p.hora_base != null ? +p.hora_base : null;
  const hbsa = p.hora_base_sa != null ? +p.hora_base_sa : null;   /* sobreaviso tem base própria: salário/220, sem periculosidade */
  const not = (p.noturna||0) + (p.hn||0);
  let fin = '';
  if (hb) {
    const r = rubricas(p, S.ordem);
    /* o noturno é pago sobre a hora noturna REDUZIDA (52min30 = 1h, art. 73, §1) */
    const v = {he50:r.he50/60*hb*fat50(), he75:r.he75/60*hb*1.75, he100:r.he100/60*hb*2, not:notRef(not)/60*hb*0.2, sa:sa/60*(hbsa||0)/3};
    const nomeOrd = {'50_primeiro':`abater primeiro as de ${pct50()}`,'100_primeiro':'abater primeiro as de 100%','proporcional':'abatimento proporcional'}[S.ordem];
    fin = `<h3>Valores a pagar em folha (hora base ${brl(hb)}${sa?` · hora base do sobreaviso ${hbsa?brl(hbsa):'não cadastrada'}`:''})</h3>
      <table><thead><tr><th class="l">Rubrica</th><th>Horas</th><th>Fator</th><th>Valor</th></tr></thead><tbody>
      <tr><td class="l">Horas extras ${pct50()} não compensadas</td><td>${hm(r.he50)}</td><td>${fmtF(fat50())}</td><td>${brl(v.he50)}</td></tr>
      <tr><td class="l">Horas extras 75% não compensadas</td><td>${hm(r.he75)}</td><td>1,75</td><td>${brl(v.he75)}</td></tr>
      <tr><td class="l">Horas extras 100% não compensadas</td><td>${hm(r.he100)}</td><td>2,00</td><td>${brl(v.he100)}</td></tr>
      <tr><td class="l">Adicional noturno${not?' <span style="font-weight:400">(referência '+hm(notRef(not))+', hora noturna de 52min30)</span>':''}</td><td>${hm(not)}</td><td>0,20</td><td>${brl(v.not)}</td></tr>
      ${sa?`<tr><td class="l">Sobreaviso${hbsa?'':' — hora base do sobreaviso não cadastrada'}</td><td>${hm(sa)}</td><td>1/3</td><td>${hbsa?brl(v.sa):'—'}</td></tr>`:''}
      <tr><th class="l">Total a pagar</th><th></th><th></th><th>${brl(v.he50+v.he75+v.he100+v.not+v.sa)}</th></tr>
      </tbody></table>
      <p class="nota">Critério de compensação: ${nomeOrd}.</p>
      ${not?`<p class="nota">Adicional noturno: entre 22h e 5h, cada 52min30 trabalhados contam como 1 hora (art. 73, §1 da CLT). Por isso a coluna "Horas" mostra o tempo do ponto e o valor é calculado sobre a referência de ${hm(notRef(not))}, a 20% da hora base.</p>`:''}
      ${sa?`<p class="nota">O sobreaviso usa hora base própria (salário ÷ 220), sem o adicional de periculosidade — Súmula 132, II do TST. As horas extras e o adicional noturno usam a hora base com periculosidade e insalubridade.</p>`:''}`;
  }
  const mesCurto = new Date(S.mes+'-15').toLocaleDateString('pt-BR',{month:'2-digit',year:'numeric'});
  $('print').innerHTML = `<div class="rp">
    <div class="cab"><div><h1>Demonstrativo de horas extras e compensações</h1><div>i9 Engenharia e Tecnologia</div></div>
      <div style="text-align:right"><b style="font-size:14px">Competência ${esc(mesTxt)}</b><div>Fonte: registro eletrônico de ponto</div></div></div>
    <div class="id">
      <div><b>Colaborador:</b> ${esc(p.nome)}</div><div><b>Cargo:</b> ${esc(p.cargo||'—')}</div>
      <div><b>Empresa:</b> ${esc(p.empresa||'—')}</div><div><b>Superior imediato:</b> ${esc(p.superior||'—')}</div>
    </div>
    <h3>Resumo da competência</h3>
    <table><thead><tr><th>Horas extras ${pct50()}</th><th>Horas extras 75%</th><th>Horas extras 100%</th><th>Crédito de folga</th><th>Folga compensada</th><th>Saldo pago em folha</th><th>Adicional noturno (horas)</th>${sa?'<th>Sobreaviso (horas)</th>':''}</tr></thead>
      <tbody><tr><td>${hm(p.he50)}</td><td>${hm(p.he75)}</td><td>${hm(p.he100)}</td><td>${hm(p.normalizado)}</td>
        <td>${hm(p.compensado)}</td><td><b>${hm(p.saldo)}</b></td><td>${hm(not)}</td>${sa?`<td>${hm(sa)}</td>`:''}</tr></tbody></table>
    ${p.acion_min?`<p class="nota">Das horas extras, ${hm(p.acion_min)} foram de acionamento durante o sobreaviso.</p>`:''}
    <p class="nota">Cada hora extra gera crédito de folga já com o adicional legal: 1h a ${pct50()} = ${hmF(fat50())}, a 75% = 1h45, a 100% = 2h.
      As folgas e ausências do mês são abatidas desse crédito. O crédito não compensado até o fim da competência é pago em folha,
      com os adicionais, e não é transferido para o mês seguinte.</p>
    ${fin}
    <h3>Detalhamento por dia</h3>
    ${ev.length?`<table><thead><tr><th class="l">Data</th><th class="l">Marcações</th><th>HE ${pct50()}</th><th>HE 75%</th><th>HE 100%</th><th>Noturno</th><th>Folga / ausência</th><th class="l">Observação</th></tr></thead><tbody>
      ${ev.map(d=>`<tr><td class="l">${dt(d.data)} ${DIA[new Date(d.data+'T12:00').getDay()]}</td><td class="l">${esc(d.batidas||'')}</td>
        <td>${d.he50?hm(d.he50):''}</td><td>${d.he75?hm(d.he75):''}</td><td>${d.he100?hm(d.he100):''}</td>
        <td>${(d.noturna+d.hn)?hm(d.noturna+d.hn):''}</td><td>${d.desconto&&!d.abonado?hm(d.desconto):''}</td>
        <td class="l">${esc(obsDia(d))}</td></tr>`).join('')}
    </tbody></table>`:'<p>Nenhuma hora extra ou compensação na competência.</p>'}
    ${auts.filter(a=>a.status==='autorizada').length?`<h3>Horas extras autorizadas</h3>
    <table><thead><tr><th class="l">Data</th><th class="l">Horário</th><th class="l">Motivo</th><th class="l">Autorizado por</th></tr></thead><tbody>
      ${auts.filter(a=>a.status==='autorizada').map(a=>`<tr><td class="l">${dt(a.data)}</td><td class="l">${a.inicio.slice(0,5)}–${a.fim.slice(0,5)}</td><td class="l">${esc(a.motivo)}</td>
        <td class="l">${esc(a.decisor||'')}</td></tr>`).join('')}
    </tbody></table>`:''}
    ${auts.filter(a=>a.status==='negada').length?`<h3>Horas extras não autorizadas pelo superior</h3>
    <table><thead><tr><th class="l">Data</th><th class="l">HE do dia</th><th class="l">Motivo da não autorização</th><th class="l">Decidido por</th></tr></thead><tbody>
      ${auts.filter(a=>a.status==='negada').map(a=>`<tr><td class="l">${dt(a.data)}</td><td class="l">${a.he_min_decisao?hm(a.he_min_decisao):'—'}</td>
        <td class="l">${esc(a.motivo)}</td><td class="l">${esc(a.decisor||'')}</td></tr>`).join('')}
    </tbody></table>
    <p class="nota">As horas destes dias continuam lançadas acima, como estão no registro de ponto: a não autorização é decisão do superior
      imediato e fica registrada também no ponto eletrônico (Quark), não é desconto automático. A regularização é por inclusão de ponto
      ou por decisão do RH, com esta negativa anexada. "HE do dia" é o que estava apurado quando a decisão foi tomada.</p>`:''}
    <p class="decl">Declaro ter recebido este demonstrativo e conferido as informações, extraídas do registro eletrônico de ponto da competência ${esc(mesCurto)}.</p>
    <div class="obs">Observações do colaborador:<div></div><div></div></div>
    <div class="ass"><div>Colaborador<br><span>data: ____/____/______</span></div><div>Superior imediato</div><div>Recursos Humanos</div></div>
    <div class="rod">Emitido em ${new Date().toLocaleString('pt-BR')}</div>
  </div>`;
  const tituloAntigo = document.title;
  document.title = `Demonstrativo de horas - ${p.nome} - ${S.mes}`;
  const limpar = () => { $('print').innerHTML = ''; document.title = tituloAntigo; window.removeEventListener('afterprint', limpar); };
  window.addEventListener('afterprint', limpar);
  setTimeout(() => window.print(), 50);
}
